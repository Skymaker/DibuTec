<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>DibuTec</title>
<style>
  :root {
    --ui-bg: #f4f1ea;
    --barra: #ffffff;
    --borde: #ddd6c8;
    --texto: #2d3047;
    --texto-suave: #6b6f85;
    --activo: #2f6fd0;
    --activo-fondo: #e2edfd;
    --hover: #f2eee6;
    --acento: #ffd166;
    --acento-activo: #b9d3fb;
    --foco: #ff9f1c;
    --mesa: #cdbb9f;
    --btn: 44px;
    --radio: 12px;
    --gap: 6px;
    --fuente: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  /* Táctil: objetivos más grandes */
  @media (pointer: coarse) {
    :root { --btn: 54px; --gap: 8px; }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--ui-bg); color: var(--texto);
    font-family: var(--fuente);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  #app {
    display: grid; height: 100%; height: 100dvh;
    grid-template-columns: auto 1fr;
    grid-template-rows: 1fr auto;
    grid-template-areas: "barra lienzo" "barra estado";
  }

  /* ---------- Barra de herramientas ---------- */
  #barra {
    grid-area: barra;
    display: flex; flex-direction: column; gap: var(--gap);
    padding: 8px; padding-left: max(8px, env(safe-area-inset-left));
    background: var(--barra); border-right: 1px solid var(--borde);
    overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
    z-index: 2;
  }
  #barra::-webkit-scrollbar { display: none; }
  .grupo { display: flex; flex-direction: column; gap: var(--gap); }
  .sep { flex: none; height: 1px; width: 100%; background: var(--borde); margin: 2px 0; }
  .espaciador { flex: 1 1 0; min-height: 4px; }

  .btn {
    width: var(--btn); height: var(--btn); flex: none;
    border: none; border-radius: var(--radio);
    background: transparent; color: var(--texto);
    display: grid; place-items: center; padding: 0;
    cursor: pointer; touch-action: manipulation;
    transition: background-color .12s, color .12s, transform .08s;
  }
  .btn svg {
    width: 62%; height: 62%; overflow: visible;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .btn svg .a { fill: var(--acento); }
  @media (hover: hover) { .btn:hover:not(:disabled) { background: var(--hover); } }
  .btn:active:not(:disabled) { transform: scale(.94); }
  .btn[aria-pressed="true"] {
    background: var(--activo-fondo); color: var(--activo);
    box-shadow: inset 0 0 0 2px var(--activo);
  }
  .btn[aria-pressed="true"] svg .a { fill: var(--acento-activo); }
  .btn:disabled { opacity: .3; cursor: default; }
  .btn:focus-visible { outline: 3px solid var(--foco); outline-offset: 1px; }

  /* ---------- Lienzo ---------- */
  #lienzo {
    grid-area: lienzo; position: relative; overflow: hidden;
    background: var(--mesa);
    touch-action: none;
  }
  #lienzo canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #lienzo.mover { cursor: grab; }
  #lienzo.mover.arrastrando { cursor: grabbing; }
  #lienzo.precision { cursor: crosshair; }

  /* ---------- Barra de estado ---------- */
  #estado {
    grid-area: estado;
    display: flex; align-items: center; gap: 14px;
    min-height: 34px; padding: 4px 12px;
    padding-bottom: max(4px, env(safe-area-inset-bottom));
    background: var(--barra); border-top: 1px solid var(--borde);
    font-size: 14px; color: var(--texto-suave);
  }
  #mensaje { flex: 1; min-width: 0; color: var(--texto); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #coords, #zoom { font-variant-numeric: tabular-nums; white-space: nowrap; }
  #zoom {
    border: 1px solid var(--borde); background: transparent; color: inherit;
    font: inherit; border-radius: 8px; padding: 2px 8px; cursor: pointer; touch-action: manipulation;
  }
  @media (pointer: coarse) { #coords { display: none; } }

  /* ---------- Orientación vertical: barra inferior ---------- */
  @media (orientation: portrait) {
    #app {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr auto auto;
      grid-template-areas: "lienzo" "estado" "barra";
    }
    #barra {
      flex-direction: row; overflow-x: auto; overflow-y: hidden;
      border-right: none; border-top: 1px solid var(--borde);
      padding: 6px 8px; padding-bottom: max(6px, env(safe-area-inset-bottom));
    }
    .grupo { flex-direction: row; }
    .sep { width: 1px; height: auto; margin: 0 2px; align-self: stretch; }
    .espaciador { min-width: 4px; min-height: 0; }
    #estado { padding-bottom: 4px; }
  }
  @media (orientation: portrait) and (pointer: coarse) {
    :root { --btn: 50px; --gap: 4px; }
  }

  /* ---------- Panel de configuración ---------- */
  #velo {
    position: fixed; inset: 0; background: rgba(30, 32, 50, .28);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10;
  }
  #velo.visible { opacity: 1; pointer-events: auto; }
  #panel-config {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 11;
    width: min(380px, 100%);
    background: var(--barra); box-shadow: -8px 0 30px rgba(0,0,0,.15);
    transform: translateX(105%); transition: transform .25s ease;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-right: env(safe-area-inset-right);
  }
  #panel-config.abierto { transform: none; }
  @media (max-width: 600px) { #panel-config { width: 100%; } }
  .panel-cab {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 10px 10px 18px; border-bottom: 1px solid var(--borde);
  }
  .panel-cab h2 { margin: 0; font-size: 20px; }
  .panel-cuerpo { padding: 8px 18px 24px; overflow-y: auto; }
  .panel-cuerpo h3 { font-size: 15px; margin: 18px 0 6px; color: var(--activo); text-transform: uppercase; letter-spacing: .04em; }
  .panel-cuerpo p { margin: 0; color: var(--texto-suave); font-size: 15px; line-height: 1.45; }

  /* Aviso emergente */
  #aviso {
    position: fixed; left: 50%; top: 16px; z-index: 20;
    transform: translate(-50%, -20px); opacity: 0;
    background: var(--texto); color: #fff; padding: 10px 16px; border-radius: 12px;
    font-size: 15px; max-width: calc(100% - 32px); text-align: center;
    pointer-events: none; transition: opacity .2s, transform .2s;
  }
  #aviso.visible { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="app">
  <nav id="barra" aria-label="Herramientas"></nav>
  <main id="lienzo" aria-label="Hoja de dibujo">
    <canvas id="capa-papel"></canvas>
    <canvas id="capa-dibujo"></canvas>
    <canvas id="capa-instrumentos"></canvas>
  </main>
  <footer id="estado">
    <span id="mensaje" aria-live="polite"></span>
    <span id="coords"></span>
    <button id="zoom" type="button" title="Ajustar la hoja a la pantalla (0)"></button>
  </footer>
</div>

<div id="velo"></div>
<aside id="panel-config" role="dialog" aria-modal="true" aria-labelledby="titulo-config" aria-hidden="true">
  <div class="panel-cab">
    <h2 id="titulo-config">Configuración</h2>
    <button class="btn" id="cerrar-config" type="button" aria-label="Cerrar" title="Cerrar (Esc)"></button>
  </div>
  <div class="panel-cuerpo">
    <h3>Papel</h3>
    <p>Papel en blanco, cuadriculado, milimetrado o isométrico. Disponible en la fase 1b.</p>
    <h3>Dibujo</h3>
    <p>Grosor de mina, color del grafito y etiquetas automáticas. Próximamente.</p>
    <h3>Ayudas</h3>
    <p>Fuerza del imán, sonidos, mensajes de ayuda y tamaño de la interfaz. Próximamente.</p>
  </div>
</aside>
<div id="aviso" role="status"></div>

<script>
'use strict';

/* =====================================================================
   Iconos SVG (viewBox 24×24, trazo currentColor, relleno de acento .a)
   ===================================================================== */
const Iconos = (() => {
  // Engranaje generado: 8 dientes
  function engranaje() {
    const n = 8, rExt = 10, rInt = 7.4, pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const d = Math.PI / n;
      const p = (r, ang) => `${(12 + r * Math.cos(ang)).toFixed(2)} ${(12 + r * Math.sin(ang)).toFixed(2)}`;
      pts.push(p(rInt, a - d * 0.75), p(rExt, a - d * 0.4), p(rExt, a + d * 0.4), p(rInt, a + d * 0.75));
    }
    return `<path class="a" d="M${pts.join('L')}Z"/><circle cx="12" cy="12" r="3"/>`;
  }
  const svg = (contenido) => `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">${contenido}</svg>`;
  const d = {
    lapiz: `<g transform="rotate(45 12 12)">
              <rect class="a" x="9.5" y="2" width="5" height="12.5" rx="1"/>
              <path d="M9.5 14.5 12 19.5l2.5-5"/><path d="M12 19.5v2.5"/>
              <path d="M12 4.5v4"/></g>`,
    mover:  `<path d="M12 2v20M2 12h20"/><path d="m9 5 3-3 3 3M9 19l3 3 3-3M5 9l-3 3 3 3M19 9l3 3-3 3"/>
              <circle class="a" cx="12" cy="12" r="2.5"/>`,
    regla:  `<rect class="a" x="1.5" y="7.5" width="21" height="9" rx="1.5"/>
              <path d="M5 7.5v3M8 7.5v2M11 7.5v4M14 7.5v2M17 7.5v3M20 7.5v2"/>`,
    escuadra: `<path class="a" d="M3 21V3l18 18Z"/><path d="M7 17v-5.5l5.5 5.5Z"/>`,
    cartabon: `<path class="a" d="M3 21V3l10.4 18Z"/><path d="M6.5 17.5v-6.2l3.6 6.2Z"/>`,
    compas: `<circle class="a" cx="12" cy="4.5" r="2.5"/><path d="M12 2v-.5"/>
              <path d="M10.8 6.8 5 21"/><path d="M13.2 6.8 17.6 17.4"/><path class="a" d="m16.6 17.8 2-.8 1 4Z"/>
              <path d="M7.5 15h9" stroke-dasharray="1.5 2"/>`,
    transportador: `<path class="a" d="M2 18a10 10 0 0 1 20 0Z"/><path d="M8 18a4 4 0 0 1 8 0"/>
              <path d="M12 8v2M4.9 10.9l1.4 1.4M19.1 10.9l-1.4 1.4M12 18l4.5-6.5"/>`,
    goma:   `<path class="a" d="M4.4 15.6 13.6 6.4a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8L11.8 20H8.8Z"/>
              <path d="m9 11 5.5 5.5"/><path d="M13 20h7"/>`,
    deshacer: `<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>`,
    rehacer:  `<path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>`,
    zoomMas:  `<circle class="a" cx="10.5" cy="10.5" r="7"/><path d="m21 21-5.5-5.5M10.5 7.5v6M7.5 10.5h6"/>`,
    zoomMenos:`<circle class="a" cx="10.5" cy="10.5" r="7"/><path d="m21 21-5.5-5.5M7.5 10.5h6"/>`,
    ajustar:  `<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/>
               <rect class="a" x="7" y="8" width="10" height="8" rx="1"/>`,
    engranaje: engranaje(),
    candado:  `<rect class="a" x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><path d="M12 15v2"/>`,
    guardar:  `<path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M7 3v5h8V3"/>
               <rect class="a" x="7" y="13" width="10" height="8"/>`,
    abrir:    `<path class="a" d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>`,
    exportar: `<rect x="3" y="3" width="18" height="18" rx="2"/><circle class="a" cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>`,
    papelera: `<path d="M3 6h18M8 6V4h8v2"/><path class="a" d="M6 6l1 15h10l1-15Z"/><path d="M10 11v6M14 11v6"/>`,
    cerrar:   `<path d="M6 6l12 12M18 6 6 18"/>`,
  };
  const out = {};
  for (const k in d) out[k] = svg(d[k]);
  return out;
})();

/* =====================================================================
   Configuración persistente
   ===================================================================== */
const Config = {
  defecto: {
    papel: 'blanco',       // blanco | cuadriculado | milimetrado | isometrico  (fase 1b)
    hoja: 'A4-h',          // A4-h | A4-v | A3-h | A3-v
    margen: true,
    colorPapel: '#ffffff',
  },
  valores: {},
  clave: 'dibutec.config',
  cargar() {
    let guardado = {};
    try { guardado = JSON.parse(localStorage.getItem(this.clave)) || {}; } catch (e) { guardado = {}; }
    this.valores = Object.assign({}, this.defecto, guardado);
  },
  guardar() {
    try { localStorage.setItem(this.clave, JSON.stringify(this.valores)); } catch (e) { /* sin almacenamiento */ }
  },
  get(k) { return this.valores[k]; },
  set(k, v) { this.valores[k] = v; this.guardar(); },
};

/* =====================================================================
   Geometría básica
   ===================================================================== */
const Geom = {
  dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
  clamp: (v, a, b) => Math.min(b, Math.max(a, v)),
};

/* =====================================================================
   Hoja de papel (mm)
   ===================================================================== */
const Hoja = {
  tamanos: { A4: [297, 210], A3: [420, 297] },
  ancho: 297, alto: 210, margen: 10,
  actualizar() {
    const [fmt, ori] = Config.get('hoja').split('-');
    const [l, c] = this.tamanos[fmt] || this.tamanos.A4;
    this.ancho = ori === 'v' ? c : l;
    this.alto  = ori === 'v' ? l : c;
  },
};

/* =====================================================================
   Vista: conversión mm ↔ píxeles CSS, zoom y desplazamiento
   ===================================================================== */
const Vista = {
  escala: 3,         // px CSS por mm
  ox: 0, oy: 0,      // posición en pantalla del origen (0,0) de la hoja
  min: 0.4, max: 40,
  PX_POR_MM_REAL: 96 / 25.4, // 100 % = tamaño real en un monitor de 96 ppp

  aPantalla(x, y) { return { x: x * this.escala + this.ox, y: y * this.escala + this.oy }; },
  aMundo(sx, sy)  { return { x: (sx - this.ox) / this.escala, y: (sy - this.oy) / this.escala }; },

  zoomEn(sx, sy, factor) {
    const nueva = Geom.clamp(this.escala * factor, this.min, this.max);
    const f = nueva / this.escala;
    this.ox = sx - (sx - this.ox) * f;
    this.oy = sy - (sy - this.oy) * f;
    this.escala = nueva;
    this.limitar();
    Render.cambioVista();
  },
  desplazar(dx, dy) {
    this.ox += dx; this.oy += dy;
    this.limitar();
    Render.cambioVista();
  },
  ajustar() {
    const { w, h } = Capas;
    if (!w || !h) return;
    const pad = Math.min(w, h) < 500 ? 12 : 32;
    this.escala = Math.min((w - 2 * pad) / Hoja.ancho, (h - 2 * pad) / Hoja.alto);
    this.min = this.escala * 0.5;
    this.ox = (w - Hoja.ancho * this.escala) / 2;
    this.oy = (h - Hoja.alto * this.escala) / 2;
    Render.cambioVista();
  },
  // Impide que la hoja se pierda fuera de la pantalla
  limitar() {
    const { w, h } = Capas, s = this.escala, borde = 60;
    const hw = Hoja.ancho * s, hh = Hoja.alto * s;
    this.ox = Geom.clamp(this.ox, borde - hw, w - borde);
    this.oy = Geom.clamp(this.oy, borde - hh, h - borde);
  },
  porcentaje() { return Math.round(this.escala / this.PX_POR_MM_REAL * 100); },
};

/* =====================================================================
   Capas de canvas (nítidas con devicePixelRatio)
   ===================================================================== */
const Capas = {
  contenedor: null, papel: null, dibujo: null, instrumentos: null,
  w: 0, h: 0, dpr: 1,
  iniciar() {
    this.contenedor = document.getElementById('lienzo');
    this.papel = document.getElementById('capa-papel');
    this.dibujo = document.getElementById('capa-dibujo');
    this.instrumentos = document.getElementById('capa-instrumentos');
  },
  redimensionar() {
    const r = this.contenedor.getBoundingClientRect();
    const antes = { w: this.w, h: this.h };
    this.w = r.width; this.h = r.height;
    this.dpr = window.devicePixelRatio || 1;
    for (const c of [this.papel, this.dibujo, this.instrumentos]) {
      c.width = Math.max(1, Math.round(this.w * this.dpr));
      c.height = Math.max(1, Math.round(this.h * this.dpr));
    }
    return antes;
  },
  // Contexto en píxeles CSS
  ctxPantalla(c) {
    const ctx = c.getContext('2d');
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    return ctx;
  },
  // Contexto en milímetros de la hoja
  ctxMundo(c) {
    const ctx = c.getContext('2d'), d = this.dpr, s = Vista.escala;
    ctx.setTransform(d * s, 0, 0, d * s, d * Vista.ox, d * Vista.oy);
    return ctx;
  },
  limpiar(c) {
    const ctx = c.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, c.width, c.height);
  },
};

/* =====================================================================
   Render: repintado bajo demanda con requestAnimationFrame
   ===================================================================== */
const Render = {
  pendiente: { papel: false, dibujo: false, instrumentos: false },
  programado: false,
  pedir(...capas) {
    for (const c of capas) this.pendiente[c] = true;
    if (!this.programado) {
      this.programado = true;
      requestAnimationFrame(() => this.pintar());
    }
  },
  cambioVista() {
    this.pedir('papel', 'dibujo', 'instrumentos');
    UI.actualizarZoom();
  },
  pintar() {
    this.programado = false;
    const p = this.pendiente;
    if (p.papel) this.papel();
    if (p.dibujo) this.dibujo();
    if (p.instrumentos) this.instrumentos();
    p.papel = p.dibujo = p.instrumentos = false;
  },

  papel() {
    const c = Capas.papel;
    Capas.limpiar(c);
    // Sombra de la hoja en píxeles de pantalla
    const ctx = Capas.ctxPantalla(c);
    const a = Vista.aPantalla(0, 0);
    const w = Hoja.ancho * Vista.escala, h = Hoja.alto * Vista.escala;
    ctx.save();
    ctx.shadowColor = 'rgba(60, 40, 10, .35)';
    ctx.shadowBlur = 18; ctx.shadowOffsetY = 4;
    ctx.fillStyle = Config.get('colorPapel');
    ctx.fillRect(a.x, a.y, w, h);
    ctx.restore();

    // Contenido en milímetros
    const m = Capas.ctxMundo(c);
    const px = 1 / Vista.escala; // 1 píxel CSS en mm
    // Fondo del papel (fase 1b: cuadriculado, milimetrado, isométrico)
    // Margen
    if (Config.get('margen')) {
      const mg = Hoja.margen;
      m.strokeStyle = 'rgba(70, 90, 140, .45)';
      m.lineWidth = Math.max(0.25, px);
      m.strokeRect(mg, mg, Hoja.ancho - 2 * mg, Hoja.alto - 2 * mg);
    }
  },

  dibujo() {
    Capas.limpiar(Capas.dibujo);
    // Fase 2: puntos, rectas, arcos, circunferencias
  },

  instrumentos() {
    Capas.limpiar(Capas.instrumentos);
    // Fases 3-6: regla, escuadra, cartabón, compás, transportador
  },
};

/* =====================================================================
   Herramientas (en esta fase solo «mover» es funcional)
   ===================================================================== */
const Herramientas = [
  { id: 'lapiz',         nombre: 'Portaminas',     tecla: 'P', icono: 'lapiz',         cursor: 'precision', fase: 2 },
  { id: 'mover',         nombre: 'Mover la vista', tecla: 'M', icono: 'mover',         cursor: 'mover',     fase: 1 },
  { id: 'regla',         nombre: 'Regla',          tecla: 'R', icono: 'regla',         cursor: '',          fase: 3 },
  { id: 'escuadra',      nombre: 'Escuadra',       tecla: 'E', icono: 'escuadra',      cursor: '',          fase: 4 },
  { id: 'cartabon',      nombre: 'Cartabón',       tecla: 'T', icono: 'cartabon',      cursor: '',          fase: 4 },
  { id: 'compas',        nombre: 'Compás',         tecla: 'C', icono: 'compas',        cursor: 'precision', fase: 5 },
  { id: 'transportador', nombre: 'Transportador',  tecla: 'A', icono: 'transportador', cursor: 'precision', fase: 6 },
  { id: 'goma',          nombre: 'Goma',           tecla: 'B', icono: 'goma',          cursor: 'precision', fase: 2 },
];

const App = {
  herramienta: 'lapiz',
  seleccionar(id) {
    const h = Herramientas.find(t => t.id === id);
    if (!h) return;
    this.herramienta = id;
    UI.marcarHerramienta(id);
    Entrada.actualizarCursor();
    if (h.fase > 1) UI.mensaje(`${h.nombre}: llegará en la fase ${h.fase}. Mientras tanto, puedes mover y acercar la hoja.`);
    else UI.mensaje('Arrastra para mover la hoja. Usa la rueda o dos dedos para acercar y alejar.');
  },
};

/* =====================================================================
   Entrada: ratón, lápiz digital y táctil con Pointer Events
   ===================================================================== */
const Entrada = {
  punteros: new Map(),    // id -> {x, y, tipo}
  arrastre: null,         // {id, x, y} desplazamiento con un puntero
  gesto: null,            // {dist, mx, my} pellizco con dos dedos
  espacio: false,
  lapizDigitalActivo: false,

  iniciar() {
    const el = Capas.contenedor;
    el.addEventListener('pointerdown', e => this.abajo(e));
    el.addEventListener('pointermove', e => this.mover(e));
    el.addEventListener('pointerup', e => this.arriba(e));
    el.addEventListener('pointercancel', e => this.arriba(e));
    el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') UI.coords(null); });
    el.addEventListener('wheel', e => this.rueda(e), { passive: false });
    el.addEventListener('contextmenu', e => e.preventDefault());
    // Safari: gestos propios del navegador
    for (const t of ['gesturestart', 'gesturechange', 'gestureend'])
      document.addEventListener(t, e => e.preventDefault(), { passive: false });
    document.addEventListener('dblclick', e => e.preventDefault());
    window.addEventListener('keydown', e => this.tecla(e));
    window.addEventListener('keyup', e => {
      if (e.code === 'Space') { this.espacio = false; this.actualizarCursor(); }
    });
    window.addEventListener('blur', () => { this.espacio = false; this.actualizarCursor(); });
  },

  local(e) {
    const r = Capas.contenedor.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  },

  abajo(e) {
    // Rechazo de palma: con lápiz digital en uso se ignoran los dedos
    if (e.pointerType === 'touch' && this.lapizDigitalActivo) return;
    if (e.pointerType === 'pen') this.lapizDigitalActivo = true;

    const p = this.local(e);
    this.punteros.set(e.pointerId, { x: p.x, y: p.y, tipo: e.pointerType });
    try { Capas.contenedor.setPointerCapture(e.pointerId); } catch (_) {}

    const toques = [...this.punteros.values()].filter(q => q.tipo === 'touch');
    if (e.pointerType === 'touch' && toques.length === 2) {
      // Empieza pellizco: cancela cualquier arrastre de un dedo
      this.arrastre = null;
      this.gesto = this.medirGesto(toques);
      return;
    }
    if (this.gesto) return;

    const quiereMover =
      App.herramienta === 'mover' ||
      e.button === 1 ||
      (this.espacio && e.pointerType === 'mouse');
    if (quiereMover) {
      e.preventDefault();
      this.arrastre = { id: e.pointerId, x: p.x, y: p.y };
      Capas.contenedor.classList.add('arrastrando');
      if (App.herramienta !== 'mover') Capas.contenedor.classList.add('mover');
    }
    // Fases 2+: aquí se delegará en la herramienta activa
  },

  mover(e) {
    const p = this.local(e);
    if (e.pointerType !== 'touch') UI.coords(Vista.aMundo(p.x, p.y));
    const q = this.punteros.get(e.pointerId);
    if (!q) return;
    q.x = p.x; q.y = p.y;

    if (this.gesto) {
      const toques = [...this.punteros.values()].filter(t => t.tipo === 'touch');
      if (toques.length < 2) return;
      const g = this.medirGesto(toques);
      Vista.desplazar(g.mx - this.gesto.mx, g.my - this.gesto.my);
      if (this.gesto.dist > 0) Vista.zoomEn(g.mx, g.my, g.dist / this.gesto.dist);
      this.gesto = g;
      return;
    }
    if (this.arrastre && this.arrastre.id === e.pointerId) {
      Vista.desplazar(p.x - this.arrastre.x, p.y - this.arrastre.y);
      this.arrastre.x = p.x; this.arrastre.y = p.y;
    }
  },

  arriba(e) {
    if (!this.punteros.has(e.pointerId)) return;
    this.punteros.delete(e.pointerId);
    if (e.pointerType === 'pen') this.lapizDigitalActivo = false;
    if (this.arrastre && this.arrastre.id === e.pointerId) {
      this.arrastre = null;
      Capas.contenedor.classList.remove('arrastrando');
      this.actualizarCursor();
    }
    if (this.gesto) {
      const toques = [...this.punteros.values()].filter(t => t.tipo === 'touch');
      if (toques.length < 2) this.gesto = null;
    }
  },

  medirGesto(t) {
    return {
      dist: Geom.dist(t[0].x, t[0].y, t[1].x, t[1].y),
      mx: (t[0].x + t[1].x) / 2,
      my: (t[0].y + t[1].y) / 2,
    };
  },

  rueda(e) {
    e.preventDefault();
    const p = this.local(e);
    let dy = e.deltaY;
    if (e.deltaMode === 1) dy *= 16;        // líneas
    else if (e.deltaMode === 2) dy *= 400;  // páginas
    // ctrlKey = pellizco en trackpad: más sensible
    const k = e.ctrlKey ? 0.01 : 0.0015;
    Vista.zoomEn(p.x, p.y, Math.exp(-dy * k));
  },

  tecla(e) {
    if (UI.panelAbierto) {
      if (e.key === 'Escape') UI.cerrarPanel();
      return;
    }
    if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.code === 'Space') {
      if (!this.espacio) { this.espacio = true; this.actualizarCursor(); }
      e.preventDefault();
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === '+' || k === '=') { this.zoomCentro(1.25); e.preventDefault(); return; }
    if (k === '-' || k === '_') { this.zoomCentro(1 / 1.25); e.preventDefault(); return; }
    if (k === '0') { Vista.ajustar(); return; }
    const mayus = k.toUpperCase();
    if (mayus === 'H') { App.seleccionar('mover'); return; }
    const h = Herramientas.find(t => t.tecla === mayus);
    if (h) App.seleccionar(h.id);
  },

  zoomCentro(f) { Vista.zoomEn(Capas.w / 2, Capas.h / 2, f); },

  actualizarCursor() {
    const el = Capas.contenedor;
    const h = Herramientas.find(t => t.id === App.herramienta);
    el.classList.remove('mover', 'precision');
    if (this.espacio || (h && h.cursor === 'mover')) el.classList.add('mover');
    else if (h && h.cursor) el.classList.add(h.cursor);
  },
};

/* =====================================================================
   Interfaz de usuario
   ===================================================================== */
const UI = {
  panelAbierto: false,
  temporizadorAviso: 0,

  crearBoton({ id, nombre, tecla, icono, alPulsar, conmutable }) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.type = 'button';
    if (id) b.dataset.id = id;
    b.innerHTML = Iconos[icono];
    b.setAttribute('aria-label', nombre);
    b.title = tecla ? `${nombre} (${tecla})` : nombre;
    if (conmutable) b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', alPulsar);
    return b;
  },

  construirBarra() {
    const barra = document.getElementById('barra');
    const grupo = () => { const g = document.createElement('div'); g.className = 'grupo'; barra.appendChild(g); return g; };
    const sep = () => { const s = document.createElement('div'); s.className = 'sep'; barra.appendChild(s); };

    const gH = grupo();
    for (const h of Herramientas) {
      gH.appendChild(this.crearBoton({
        id: h.id, nombre: h.nombre, tecla: h.tecla, icono: h.icono, conmutable: true,
        alPulsar: () => App.seleccionar(h.id),
      }));
    }
    sep();
    const gHist = grupo();
    this.btnDeshacer = this.crearBoton({ nombre: 'Deshacer', tecla: 'Ctrl+Z', icono: 'deshacer', alPulsar: () => {} });
    this.btnRehacer  = this.crearBoton({ nombre: 'Rehacer',  tecla: 'Ctrl+Y', icono: 'rehacer',  alPulsar: () => {} });
    this.btnDeshacer.disabled = this.btnRehacer.disabled = true;
    gHist.append(this.btnDeshacer, this.btnRehacer);
    sep();
    const gZoom = grupo();
    gZoom.append(
      this.crearBoton({ nombre: 'Acercar', tecla: '+', icono: 'zoomMas', alPulsar: () => Entrada.zoomCentro(1.25) }),
      this.crearBoton({ nombre: 'Alejar',  tecla: '−', icono: 'zoomMenos', alPulsar: () => Entrada.zoomCentro(1 / 1.25) }),
      this.crearBoton({ nombre: 'Ver la hoja entera', tecla: '0', icono: 'ajustar', alPulsar: () => Vista.ajustar() }),
    );
    const esp = document.createElement('div'); esp.className = 'espaciador'; barra.appendChild(esp);
    const gConf = grupo();
    gConf.appendChild(this.crearBoton({ nombre: 'Configuración', icono: 'engranaje', alPulsar: () => this.abrirPanel() }));
  },

  marcarHerramienta(id) {
    document.querySelectorAll('#barra .btn[data-id]').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.id === id)));
  },

  mensaje(txt) { document.getElementById('mensaje').textContent = txt; },

  aviso(txt) {
    const a = document.getElementById('aviso');
    a.textContent = txt;
    a.classList.add('visible');
    clearTimeout(this.temporizadorAviso);
    this.temporizadorAviso = setTimeout(() => a.classList.remove('visible'), 2200);
  },

  coords(p) {
    const el = document.getElementById('coords');
    if (!p || p.x < 0 || p.y < 0 || p.x > Hoja.ancho || p.y > Hoja.alto) { el.textContent = ''; return; }
    const f = v => v.toFixed(1).replace('.', ',');
    el.textContent = `x ${f(p.x)} mm · y ${f(p.y)} mm`;
  },

  actualizarZoom() {
    document.getElementById('zoom').textContent = `${Vista.porcentaje()} %`;
  },

  abrirPanel() {
    this.panelAbierto = true;
    const p = document.getElementById('panel-config');
    p.classList.add('abierto');
    p.setAttribute('aria-hidden', 'false');
    document.getElementById('velo').classList.add('visible');
    document.getElementById('cerrar-config').focus();
  },
  cerrarPanel() {
    this.panelAbierto = false;
    const p = document.getElementById('panel-config');
    p.classList.remove('abierto');
    p.setAttribute('aria-hidden', 'true');
    document.getElementById('velo').classList.remove('visible');
  },

  iniciar() {
    this.construirBarra();
    const cerrar = document.getElementById('cerrar-config');
    cerrar.innerHTML = Iconos.cerrar;
    cerrar.addEventListener('click', () => this.cerrarPanel());
    document.getElementById('velo').addEventListener('click', () => this.cerrarPanel());
    document.getElementById('zoom').addEventListener('click', () => Vista.ajustar());
  },
};

/* =====================================================================
   Arranque
   ===================================================================== */
function iniciar() {
  Config.cargar();
  Hoja.actualizar();
  Capas.iniciar();
  UI.iniciar();
  Entrada.iniciar();

  let primera = true;
  const alCambiarTamano = () => {
    const antes = Capas.redimensionar();
    if (primera || !antes.w) { primera = false; Vista.ajustar(); return; }
    // Mantiene centrado el mismo punto de la hoja
    Vista.ox += (Capas.w - antes.w) / 2;
    Vista.oy += (Capas.h - antes.h) / 2;
    Vista.limitar();
    Render.cambioVista();
  };
  new ResizeObserver(alCambiarTamano).observe(Capas.contenedor);
  // Cambio de densidad de píxeles (mover la ventana a otro monitor, zoom del navegador)
  window.addEventListener('resize', () => {
    if ((window.devicePixelRatio || 1) !== Capas.dpr) alCambiarTamano();
  });

  App.seleccionar('mover');
  UI.mensaje('¡Bienvenido a DibuTec! Arrastra para mover la hoja; usa la rueda o dos dedos para acercar.');
}

// Acceso para pruebas automáticas
window.DibuTec = { Config, Vista, Capas, Hoja, App, Entrada, UI, Render, Iconos };

iniciar();
</script>
