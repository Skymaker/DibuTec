    const pintar = () => {
      caja.textContent = '';
      const l = Paleta.lista().map(e => Object.assign({}, e));
      const guardar = () => Paleta.guardarLista(l.map(e => Object.assign({}, e)));
      l.forEach((e, i) => {
        const fila = document.createElement('div');
        fila.className = 'pe-fila';
        const col = document.createElement('input');
        col.type = 'color'; col.value = e.color;
        col.setAttribute('aria-label', `Color ${i + 1}`);
        const nom = document.createElement('input');
        nom.type = 'text'; nom.maxLength = 20; nom.value = e.nombre; nom.placeholder = e.color.toUpperCase();
        nom.setAttribute('aria-label', `Nombre del color ${i + 1} (vacío: su código)`);
        col.addEventListener('input', () => { e.color = col.value.toLowerCase(); nom.placeholder = e.color.toUpperCase(); guardar(); });
        nom.addEventListener('input', () => { e.nombre = nom.value; guardar(); });
        const quitar = document.createElement('button');
        quitar.type = 'button'; quitar.className = 'pe-quitar'; quitar.innerHTML = Iconos.papelera;
        quitar.setAttribute('aria-label', `Quitar el color ${Paleta.nombre(e)}`); quitar.title = 'Quitar este color';
        quitar.disabled = l.length <= 1;
        quitar.addEventListener('click', () => { l.splice(i, 1); guardar(); pintar(); });
        fila.append(col, nom, quitar);
        caja.appendChild(fila);
      });
      const acciones = document.createElement('div');
      acciones.className = 'pe-acciones';
      const mas = document.createElement('button');
      mas.type = 'button'; mas.className = 'btn-texto'; mas.textContent = '+ Añadir un color';
      mas.disabled = l.length >= Paleta.MAX_COLORES;
      mas.addEventListener('click', () => {
        let n = 1; while (l.some(e => e.id === 'c' + n)) n++;
        l.push({ id: 'c' + n, color: '#2a9d8f', nombre: '' });
        guardar(); pintar();
        const ult = caja.querySelectorAll('.pe-fila input[type=text]');
        if (ult.length) ult[ult.length - 1].focus();
      });
      const rest = document.createElement('button');
      rest.type = 'button'; rest.className = 'btn-texto'; rest.textContent = 'Colores de fábrica';
      rest.addEventListener('click', () => { Paleta.restaurarLista(); pintar(); UI.aviso('Colores restaurados'); });

      const nota = document.createElement('div');
      nota.className = 'nota';
      nota.textContent = `Son los colores que aparecen al elegir el color del portaminas (el compás pinta con el mismo). Si un color no tiene nombre, se muestra su código. Hasta ${Paleta.MAX_COLORES} colores. Lo ya dibujado no cambia.`;

  // Control deslizante para un valor numérico de la configuración
  formatos: { tamGoma: v => `${v} mm` },
  deslizador(clave, etiqueta) {
    const e = Config.esquema[clave];
    const caja = document.createElement('div');
    caja.className = 'deslizador';
    const r = document.createElement('input');
    r.type = 'range';
    r.min = e.min; r.max = e.max; r.step = e.paso || 1;
    r.dataset.clave = clave;
    r.setAttribute('aria-label', etiqueta);
    r.addEventListener('input', () => Config.set(clave, Number(r.value)));
    const o = document.createElement('output');
    o.dataset.valorDe = clave;
    caja.append(r, o);
    return caja;
  },

  // Grupo de botones de opción: role=radiogroup / radio
  grupo(clave, clase) {
    const g = document.createElement('div');
    g.className = clase;
    g.setAttribute('role', 'radiogroup');
    g.dataset.clave = clave;
    g.addEventListener('keydown', e => this.flechas(e, g));
    return g;
  },
  opcion(g, clave, valor, contenido, nombre, clase) {
    const b = document.createElement('button');
    b.type = 'button';
    if (clase) b.className = clase;
    b.setAttribute('role', 'radio');
    b.dataset.valor = JSON.stringify(valor);
    b.innerHTML = contenido;
    if (nombre) { b.setAttribute('aria-label', nombre); b.title = nombre; }
    b.addEventListener('click', () => Config.set(clave, valor));
    g.appendChild(b);
    return b;
  },
  flechas(e, g) {
    const dir = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (!dir) return;
    e.preventDefault();
    const bs = [...g.querySelectorAll('[role=radio]')];
    const i = bs.indexOf(document.activeElement);
    const b = bs[(i + dir + bs.length) % bs.length];
    b.focus(); b.click();
  },

  tarjetasPapel() {
    const g = this.grupo('papel', 'opciones-papel');
    const tipos = [['blanco', 'En blanco'], ['cuadriculado', 'Cuadriculado'], ['milimetrado', 'Milimetrado'], ['isometrico', 'Isométrico']];
    for (const [v, n] of tipos) {
      const b = this.opcion(g, 'papel', v, '', null, 'tarjeta');
      b.dataset.miniatura = v;
      b.dataset.nombre = n;
    }
    return g;
  },
  segmentado(clave, opciones, nombres) {
    const g = this.grupo(clave, 'segmentado');
    for (const [v, t] of opciones) this.opcion(g, clave, v, t, nombres && nombres[v]);
    return g;
  },
  muestras(clave, opciones) {
    const g = this.grupo(clave, 'muestras');
    for (const [v, color, nombre] of opciones) {
      const b = this.opcion(g, clave, v, '', nombre, 'muestra');
      b.style.background = color;
    }
    return g;
  },
  interruptor(c, clave, etiqueta, nota, condicion) {
    const f = document.createElement('div');
    f.className = 'fila';
    if (condicion) f.dataset.si = condicion;
    const fi = document.createElement('div');
    fi.className = 'fila-interruptor';
    const id = 'etq-' + clave;
    const e = document.createElement('label');
    e.className = 'etq'; e.id = id; e.textContent = etiqueta;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'interruptor';
    b.setAttribute('role', 'switch');
    b.setAttribute('aria-labelledby', id);
    b.dataset.interruptor = clave;
    b.addEventListener('click', () => Config.set(clave, !Config.get(clave)));
    e.addEventListener('click', () => b.click());
    fi.append(e, b);
    f.appendChild(fi);
    if (nota) { const n = document.createElement('div'); n.className = 'nota'; n.textContent = nota; f.appendChild(n); }
    c.appendChild(f);
  },

  // Refleja la configuración actual en los controles
  actualizar() {
    if (!this.cuerpo) return;
    const c = document;
    c.querySelectorAll('[role=radiogroup][data-clave]').forEach(g => {
      const actual = JSON.stringify(Config.get(g.dataset.clave));
      g.querySelectorAll('[role=radio]').forEach(b => {
        const sel = b.dataset.valor === actual;
        b.setAttribute('aria-checked', String(sel));
        b.tabIndex = sel ? 0 : -1;
      });
    });
    c.querySelectorAll('input[type=range][data-clave]').forEach(r => {
      if (Number(r.value) !== Config.get(r.dataset.clave)) r.value = Config.get(r.dataset.clave);
    });
    c.querySelectorAll('output[data-valor-de]').forEach(o => {
      const k = o.dataset.valorDe, f = this.formatos[k];
      o.textContent = f ? f(Config.get(k)) : String(Config.get(k));
    });
    c.querySelectorAll('[data-interruptor]').forEach(b =>
      b.setAttribute('aria-checked', String(!!Config.get(b.dataset.interruptor))));
    c.querySelectorAll('[data-miniatura]').forEach(b => {
      b.innerHTML = Papel.miniatura(b.dataset.miniatura) + `<span>${b.dataset.nombre}</span>`;
    });
    c.querySelectorAll('[data-si]').forEach(f => {
      const [, k, op, v] = f.dataset.si.match(/^(\w+)(!?=)(\w+)$/);
      const igual = String(Config.get(k)) === v;
      f.hidden = op === '=' ? !igual : igual;
    });
  },
};

/* =====================================================================
   Guardado automático en el navegador
   ===================================================================== */
const Guardado = {
  clave: 'dibutec.dibujo',
  temporizador: 0,
  listo: false,      // no guardar hasta haber recuperado lo anterior
  programar() {
    if (!this.listo) return;
    clearTimeout(this.temporizador);
    this.temporizador = setTimeout(() => this.guardar(), 400);
  },
  guardar() {
    try { localStorage.setItem(this.clave, Escena.datos()); } catch (_) { /* sin almacenamiento */ }
  },
  recuperar() {
    let datos = null;
    try { datos = localStorage.getItem(this.clave); } catch (_) {}
    if (datos) {
      try { Escena.cargarDatos(datos, true); } catch (_) { /* datos dañados: se empieza en blanco */ }
    }
    this.listo = true;
    return !!datos && !Escena.estaVacia();
  },
};

const Archivo = {

    Panel.interruptor(c, 'exportarFondo', 'Con el fondo del papel', 'Sin fondo, la imagen solo tiene el dibujo, sobre transparente.');

      const f = e.target.files && e.target.files[0];

    });
  },
  nombreBase() {
    const d = new Date(), z = n => String(n).padStart(2, '0');
    return `dibutec-${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`;
  },
  descargar(blob, nombre) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  },
  nueva() {
    UI.cerrarPanel();
    if (Escena.estaVacia()) { UI.aviso('La hoja ya está limpia.'); return; }
    Historial.registrar();
    Escena.vaciar();
    Sonido.tocar('borrar');
    UI.mensaje('Hoja nueva. Si te has equivocado, pulsa deshacer.');
  },
  guardar() {
    const papel = {};
    for (const k of this.clavesPapel) papel[k] = Config.get(k);
    const datos = { app: 'DibuTec', version: 1, guardado: new Date().toISOString(), papel, dibujo: JSON.parse(Escena.datos()) };
    this.descargar(new Blob([JSON.stringify(datos)], { type: 'application/json' }), this.nombreBase() + '.json');
    UI.aviso('Dibujo guardado en un archivo.');
  },
  leer(archivo) {
    const fallo = () => UI.aviso('Ese archivo no es un dibujo de DibuTec.');
    if (archivo.size > 5e6) { fallo(); return; }
    archivo.text().then(texto => {
      let d;
      try { d = JSON.parse(texto); } catch (_) { fallo(); return; }
      if (!d || d.app !== 'DibuTec' || !d.dibujo || typeof d.dibujo !== 'object') { fallo(); return; }
      Historial.registrar();
      if (d.papel && typeof d.papel === 'object')
        for (const k of this.clavesPapel) if (k in d.papel) Config.set(k, d.papel[k]);
      Escena.cargarDatos(d.dibujo, true);
      UI.cerrarPanel();
      UI.aviso('Dibujo abierto.');
      UI.mensaje(`Dibujo «${archivo.name}» abierto. Si quieres volver al anterior, pulsa deshacer.`);
    }, fallo);
  },
  // Imagen de la hoja entera a unos 200 ppp, sin instrumentos
  exportarPNG() {
    const k = 8;
    const W = Math.round(Hoja.ancho * k), H = Math.round(Hoja.alto * k);
    const lienzo = document.createElement('canvas');
    lienzo.width = W; lienzo.height = H;
    const ctx = lienzo.getContext('2d');
    const vista = { escala: Vista.escala, ox: Vista.ox, oy: Vista.oy };
    Vista.escala = k; Vista.ox = 0; Vista.oy = 0;   // los grosores se calculan con la escala de la imagen
    try {
      ctx.setTransform(k, 0, 0, k, 0, 0);
      if (Config.get('exportarFondo')) {
        ctx.fillStyle = Paleta.papel[Config.get('colorPapel')];
        ctx.fillRect(0, 0, Hoja.ancho, Hoja.alto);
        Papel.dibujar(ctx, { x0: 0, y0: 0, x1: Hoja.ancho, y1: Hoja.alto });
        Render.margen(ctx);
      }
      Cartela.dibujar(ctx);
      Render.pintarEscena(ctx);
    } finally {
      Object.assign(Vista, vista);
    }
    lienzo.toBlob(b => {
      if (!b) { UI.aviso('No se ha podido crear la imagen.'); return; }
      this.descargar(b, this.nombreBase() + '.png');
      UI.aviso('Imagen exportada.');
    }, 'image/png');
  },
};

/* =====================================================================
   Lupa de precisión: al usar el dedo muestra ampliado lo que hay debajo
   ===================================================================== */
const Lupa = {
  el: null,
  D: 150,           // diámetro en px CSS
  aumento: 2.5,
  dedo: null,       // posición del dedo en el lienzo (px CSS)
  seguir(p) { this.dedo = { x: p.x, y: p.y }; Render.pedir('instrumentos'); },
  ocultar() { this.dedo = null; if (this.el) this.el.style.display = 'none'; },
  // Lo que interesa ver: la punta del portaminas, la mina o la punta seca del compás, el centro del transportador
  objetivo() {
    const s = Manip.estado;
    if (s) {
      const i = s.inst;
      if (s.modo === 'abrir' || s.modo === 'trazar') return i.aMundo(i.r, 0);
      if (s.modo === 'mover' && (i.tipo === 'compas' || i.tipo === 'transportador')) return i.aMundo(...i.origenIman);
      return null;
    }
    if (App.herramienta === 'lapiz' && Lapiz.activo) return { x: Lapiz.activo.x, y: Lapiz.activo.y };
    return null;
  },
  pintar() {
    if (!this.el) this.el = document.getElementById('lupa');
    const o = this.dedo && Config.get('lupa') ? this.objetivo() : null;
    if (!o) { this.el.style.display = 'none'; return; }
    const dpr = Capas.dpr, D = this.D, lado = Math.round(D * dpr);
    if (this.el.width !== lado || this.el.height !== lado) { this.el.width = lado; this.el.height = lado; }
    const t = Vista.aPantalla(o.x, o.y);
    const fuente = D / this.aumento * dpr;
    const ctx = this.el.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#cdbb9f';
    ctx.fillRect(0, 0, lado, lado);
    for (const c of [Capas.papel, Capas.dibujo, Capas.instrumentos])
      ctx.drawImage(c, t.x * dpr - fuente / 2, t.y * dpr - fuente / 2, fuente, fuente, 0, 0, lado, lado);
    // Mira en el centro
    const m = lado / 2, g = 6 * dpr, l = 16 * dpr;
    ctx.strokeStyle = 'rgba(47, 111, 208, .9)';
    ctx.lineWidth = 1.5 * dpr;
    ctx.beginPath();
    ctx.moveTo(m - l, m); ctx.lineTo(m - g, m); ctx.moveTo(m + g, m); ctx.lineTo(m + l, m);
    ctx.moveTo(m, m - l); ctx.lineTo(m, m - g); ctx.moveTo(m, m + g); ctx.lineTo(m, m + l);
    ctx.stroke();
    // Por encima del dedo; si no cabe, por debajo
    let top = this.dedo.y - D - 70;
    if (top < 6) top = this.dedo.y + 70;
    const left = Geom.clamp(this.dedo.x - D / 2, 6, Math.max(6, Capas.w - D - 6));
    Object.assign(this.el.style, { display: 'block', left: left + 'px', top: top + 'px' });
  },
};

/* =====================================================================
   Ejercicios guiados: cada ejercicio es un archivo JSON independiente
   (formato descrito en ejercicios/LEEME.md)
   ===================================================================== */
const Ejercicio = {
  def: null,             // ejercicio activo
  paso: 0,               // índice del paso actual
  nombres: {},           // nombre -> {tipo, id} de los elementos del dibujo
  asignados: [],         // por paso: nombres que fijó al completarse
  iniciales: [],         // nombres de los elementos del enunciado
  completado: false,
  configPrevia: null,    // papel que había antes del ejercicio
  ultimoId: 0,           // para saber qué se ha dibujado desde la última comprobación
  minimizado: false,
  verPista: false,
  siguiente: false,      // botón «Siguiente» de los pasos de lectura
  clave: 'dibutec.ejercicio',
  TIPOS: ['punto', 'recta', 'arco', 'rectas', 'vertices', 'instrumento', 'continuar'],
  CLAVES_PAPEL: ['papel', 'cuadro', 'triangulo', 'colorLineas', 'colorPapel', 'hoja', 'margen', 'imanCuadricula'],

  // ---------- Validación del archivo ----------
  objetivosDe(p) { return Array.isArray(p.objetivos) ? p.objetivos : p.objetivo ? [p.objetivo] : []; },
  validar(d) {
    const err = m => { throw new Error(m); };
    if (!d || typeof d !== 'object' || d.formato !== 'dibutec-ejercicio') err('falta "formato": "dibutec-ejercicio"');
    if (typeof d.titulo !== 'string' || !d.titulo.trim()) err('falta el título');
    if (!Array.isArray(d.pasos) || !d.pasos.length) err('no tiene pasos');
    d.pasos.forEach((p, i) => {
      if (!p || typeof p.texto !== 'string') err(`el paso ${i + 1} no tiene texto`);
      const objs = this.objetivosDe(p);
      if (!objs.length) err(`el paso ${i + 1} no tiene objetivo`);
      for (const o of objs) if (!o || !this.TIPOS.includes(o.tipo)) err(`paso ${i + 1}: tipo de objetivo desconocido «${o && o.tipo}»`);
    });
    const ini = d.inicial || {};
    for (const k of ['puntos', 'rectas', 'arcos'])
      if (ini[k] !== undefined && !Array.isArray(ini[k])) err(`"inicial.${k}" tiene que ser una lista`);
    return d;
  },

  // ---------- Empezar y salir ----------
  iniciar(def) {
    try { this.validar(def); } catch (e) { UI.aviso('El ejercicio no es válido: ' + e.message); return false; }
    if (this.def) this.salir(false);
    UI.cerrarPanel();
    Acciones.cancelarActual();
    Historial.registrar();                         // se puede volver al dibujo anterior con deshacer
    this.configPrevia = {};
    for (const k of this.CLAVES_PAPEL) this.configPrevia[k] = Config.get(k);
    const papel = def.papel && typeof def.papel === 'object' ? def.papel : {};
    for (const k of this.CLAVES_PAPEL) if (k in papel) Config.set(k, papel[k]);
    Object.assign(this, { def, paso: 0, nombres: {}, asignados: [], omitidos: [], completado: false, minimizado: false, verPista: false });
    Escena.vaciar();
    this.crearInicial(def.inicial || {});
    this.colocarInstrumentos(def.instrumentos);
    this.ultimoId = Escena.sigId;
    App.seleccionar('lapiz');
    this.guardar();
    this.pintarTarjeta();
    this.marcarSugeridos();
    UI.mensaje(`Ejercicio: ${def.titulo}. Sigue los pasos de la tarjeta.`);
    Render.pedir('papel', 'dibujo', 'instrumentos');
    return true;
  },
  salir(aviso = true) {
    if (!this.def) return;
    if (this.configPrevia) for (const k in this.configPrevia) Config.set(k, this.configPrevia[k]);
    Object.assign(this, { def: null, paso: 0, nombres: {}, asignados: [], omitidos: [], iniciales: [], completado: false, configPrevia: null });
    this.guardar();
    this.pintarTarjeta();
    this.marcarSugeridos();
    Render.pedir('dibujo');
    if (aviso) UI.mensaje('Has salido del ejercicio. Lo dibujado se queda en la hoja.');
  },
  crearInicial(ini) {
    const fin = Number.isFinite;
    const nombrar = (n, tipo, id) => { if (typeof n === 'string' && n) this.nombres[n] = { tipo, id }; };
    for (const p of ini.puntos || []) {
      if (!p || !fin(p.x) || !fin(p.y)) continue;
      const q = Escena.agregarPunto(p.x, p.y);
      q.dado = true;
      const et = p.etiqueta || p.nombre;
      if (et) q.etiqueta = String(et).slice(0, 12);
      nombrar(p.nombre || q.etiqueta, 'punto', q.id);
    }
    const coord = (ref, x, y) => this.punto(ref) || (fin(x) && fin(y) ? { x, y } : null);
    for (const r of ini.rectas || []) {
      if (!r) continue;
      const a = coord(r.desde, r.x1, r.y1), b = coord(r.hasta, r.x2, r.y2);
      if (!a || !b) continue;
      const q = Escena.agregarRecta(a.x, a.y, b.x, b.y);
      q.dado = true;
      nombrar(r.nombre, 'recta', q.id);
    }
    for (const c of ini.arcos || []) {
      if (!c) continue;
      const o = coord(c.centro, c.cx, c.cy);
      if (!o || !fin(c.radio) || c.radio <= 0) continue;
      // Grados en sentido antihorario, como en el transportador
      const g0 = fin(c.desde) ? c.desde : 0, g1 = fin(c.hasta) ? c.hasta : g0 + 360;
      const q = Escena.agregarArco(o.x, o.y, c.radio, -g0 * Math.PI / 180, -g1 * Math.PI / 180);
      q.dado = true;
      nombrar(c.nombre, 'arco', q.id);
    }
    this.iniciales = Object.keys(this.nombres);
  },
  colocarInstrumentos(cfg) {
    for (const inst of Instrumentos.lista) { inst.visible = false; inst.bloqueado = false; inst.volteado = false; }
    if (cfg && typeof cfg === 'object') {
      for (const tipo of Object.keys(cfg)) {
        const inst = Instrumentos.porTipo[tipo], c = cfg[tipo];
        if (!inst || !c) continue;
        inst.visible = true;
        if (Number.isFinite(c.x) && Number.isFinite(c.y)) { inst.x = c.x; inst.y = c.y; inst.colocado = true; }
        if (Number.isFinite(c.giro)) inst.rot = -c.giro * Math.PI / 180;
        if (c.volteado === true && inst.volteo) inst.volteado = true;
        if (Number.isFinite(c.radio) && 'r' in inst) inst.r = inst.limitarRadio(c.radio);
        if (!inst.colocado) Instrumentos.colocarEnVista(inst);
        Instrumentos.alFrente(inst);
      }
    }
    UI.marcarInstrumentos();
  },

  // ---------- Referencias a elementos ----------
  buscarId(tipo, id) {
    const l = { punto: Escena.puntos, recta: Escena.rectas, arco: Escena.arcos }[tipo];
    return (l && l.find(o => o.id === id)) || null;
  },
  elemento(ref) {
    if (typeof ref !== 'string') return null;
    const n = this.nombres[ref];
    if (n) { const o = this.buscarId(n.tipo, n.id); return o ? { tipo: n.tipo, o } : null; }
    const p = Escena.puntos.find(q => q.etiqueta === ref);
    return p ? { tipo: 'punto', o: p } : null;
  },
  // Un punto: nombre de un punto o coordenadas {x, y} en mm
  punto(ref) {
    if (ref && typeof ref === 'object' && Number.isFinite(ref.x) && Number.isFinite(ref.y)) return { x: ref.x, y: ref.y };
    const e = this.elemento(ref);
    return e && e.tipo === 'punto' ? e.o : null;
  },
  linea(ref) { const e = this.elemento(ref); return e && e.tipo !== 'punto' ? e : null; },
  nombreDe(ref) {
    const t = this.def && this.def.textos;
    if (typeof ref === 'string' && t && typeof t[ref] === 'string') return t[ref];
    if (typeof ref === 'string') {
      const e = this.elemento(ref);
      if (e && e.tipo === 'punto') return `el punto ${e.o.etiqueta}`;
      return `«${ref}»`;
    }
    return 'el punto indicado';
  },

  // ---------- Geometría de apoyo ----------
  distLinea(p, L) {
    return L.tipo === 'recta' ? Geom.distSegmento(p.x, p.y, L.o.x1, L.o.y1, L.o.x2, L.o.y2) : Geom.distArco(p.x, p.y, L.o);
  },
  dirRecta(r) { return Math.atan2(r.y2 - r.y1, r.x2 - r.x1); },
  // Ángulo entre dos direcciones, de 0° a 90°
  difAng(a, b) {
    let d = Math.abs(a - b) % Math.PI;
    if (d > Math.PI / 2) d = Math.PI - d;
    return d * 180 / Math.PI;
  },
  cruces(o) {
    const par = Array.isArray(o.cruce) ? o.cruce : [];
    const A = this.linea(par[0]), B = this.linea(par[1]);
    return A && B ? Geom.intersecciones(A, B) : [];
  },
  // Índice del cruce donde está p (−1 si no está en ninguno). Si el ejercicio elige uno de
  // los cortes («corte»: {x, y} aproximado), solo vale el corte más cercano a ese sitio.
  indiceCruce(p, o, tol) {
    const cs = this.cruces(o);
    let validos = cs.map((c, i) => i);
    const ref = o.corte && typeof o.corte === 'object' ? this.punto(o.corte) : null;
    if (ref && cs.length > 1) {
      let k = 0;
      cs.forEach((c, i) => { if (Geom.dist(c.x, c.y, ref.x, ref.y) < Geom.dist(cs[k].x, cs[k].y, ref.x, ref.y)) k = i; });
      validos = [k];
    }
    let mejor = -1, dm = Infinity;
    for (const i of validos) {
      const d = Geom.dist(p.x, p.y, cs[i].x, cs[i].y);
      if (d <= tol && d < dm) { dm = d; mejor = i; }
    }
    return mejor;
  },

  // ---------- Condiciones: devuelven null si se cumplen o el motivo si no ----------
  condPunto(p, o, tol, tolA) {
    if (o.cerca !== undefined) {
      const c = this.punto(o.cerca);
      if (!c || Geom.dist(p.x, p.y, c.x, c.y) > tol) return 'El punto no está en su sitio.';
    }
    if (o.sobre !== undefined) {
      const L = this.linea(o.sobre);
      if (!L || this.distLinea(p, L) > tol) return `El punto tiene que estar sobre ${this.nombreDe(o.sobre)}.`;
    }
    if (o.cruce !== undefined && this.indiceCruce(p, o, tol) < 0)
      return o.corte && typeof o.corte === 'object' && this.cruces(o).length > 1 && this.cruces(o).some(c => Geom.dist(p.x, p.y, c.x, c.y) <= tol)
        ? 'Ese no es el corte que buscamos: las líneas se cortan en otro punto.'
        : 'Marca el punto justo donde se cortan las líneas.';
    if (o.angulo) {
      const a = o.angulo, V = this.punto(a.vertice), H = this.punto(a.desde);
      if (!V || !H) return 'Falta el ángulo de referencia.';
      let g = (Math.atan2(-(p.y - V.y), p.x - V.x) - Math.atan2(-(H.y - V.y), H.x - V.x)) * 180 / Math.PI;
      g = ((g % 360) + 540) % 360 - 180;
      const ok = a.sentido === 'antihorario' ? Math.abs(g - a.grados) <= tolA
        : a.sentido === 'horario' ? Math.abs(g + a.grados) <= tolA
        : Math.abs(Math.abs(g) - a.grados) <= tolA;
      if (!ok) return `El punto tiene que estar a ${a.grados}° (está a ${Math.round(Math.abs(g))}°).`;
    }
    if (o.distancia) {
      const c = this.punto(o.distancia.de);
      if (!c || Math.abs(Geom.dist(p.x, p.y, c.x, c.y) - o.distancia.mm) > tol)
        return `El punto tiene que estar a ${o.distancia.mm} mm de ${this.nombreDe(o.distancia.de)}.`;
    }
    return null;
  },
  condRecta(r, o, tol, tolA) {
    if (o.desde !== undefined || o.hasta !== undefined) {
      const a = this.punto(o.desde), b = this.punto(o.hasta);
      const cerca = (q, x, y) => !q || Geom.dist(q.x, q.y, x, y) <= tol;
      const ok = (o.desde === undefined || a) && (o.hasta === undefined || b) &&
        ((cerca(a, r.x1, r.y1) && cerca(b, r.x2, r.y2)) || (cerca(a, r.x2, r.y2) && cerca(b, r.x1, r.y1)));
      if (!ok) return o.hasta !== undefined
        ? `La recta tiene que ir de ${this.nombreDe(o.desde)} a ${this.nombreDe(o.hasta)}.`
        : `La recta tiene que empezar en ${this.nombreDe(o.desde)}.`;
    }
    for (const ref of [].concat(o.pasaPor || [])) {
      const q = this.punto(ref);
      if (!q || Geom.distSegmento(q.x, q.y, r.x1, r.y1, r.x2, r.y2) > tol) return `La recta tiene que pasar por ${this.nombreDe(ref)}.`;
    }
    const dir = this.dirRecta(r);
    if (o.paralelaA !== undefined) {
      const L = this.linea(o.paralelaA);
      if (!L || L.tipo !== 'recta' || this.difAng(dir, this.dirRecta(L.o)) > tolA) return `La recta tiene que ser paralela a ${this.nombreDe(o.paralelaA)}.`;
    }
    if (o.perpendicularA !== undefined) {
      const L = this.linea(o.perpendicularA);
      if (!L || L.tipo !== 'recta' || 90 - this.difAng(dir, this.dirRecta(L.o)) > tolA) return `La recta tiene que ser perpendicular a ${this.nombreDe(o.perpendicularA)}.`;
    }
    if (o.angulo) {
      const L = this.linea(o.angulo.con), g = o.angulo.grados > 90 ? 180 - o.angulo.grados : o.angulo.grados;
      if (!L || L.tipo !== 'recta' || Math.abs(this.difAng(dir, this.dirRecta(L.o)) - g) > tolA)
        return `La recta tiene que formar ${o.angulo.grados}° con ${this.nombreDe(o.angulo.con)}.`;
    }
    if (Number.isFinite(o.longitudMin) && Geom.dist(r.x1, r.y1, r.x2, r.y2) < o.longitudMin)
      return `Haz la recta más larga (al menos ${o.longitudMin} mm).`;
    return null;
  },
  condArco(a, o, tol) {
    if (o.centro !== undefined) {
      const c = this.punto(o.centro);
      if (!c || Geom.dist(a.cx, a.cy, c.x, c.y) > tol) return `Pincha la punta seca del compás en ${this.nombreDe(o.centro)}.`;
    }
    if (Number.isFinite(o.radio) && Math.abs(a.r - o.radio) > tol)
      return `El radio tiene que medir ${o.radio} mm (mide ${Lapiz.mmTexto(a.r)}).`;
    if (o.radio && typeof o.radio === 'object') {
      const mn = o.radio.min, mx = o.radio.max;
      if ((Number.isFinite(mn) && a.r < mn - tol) || (Number.isFinite(mx) && a.r > mx + tol))
        return Number.isFinite(mx) ? `El radio tiene que medir entre ${mn || 0} y ${mx} mm.` : `Abre más el compás (al menos ${mn} mm).`;
    }
    if (Array.isArray(o.radioComo)) {
      // Abertura igual a la distancia entre dos puntos: ["A", "B"]
      const p = this.punto(o.radioComo[0]), q = this.punto(o.radioComo[1]);
      if (!p || !q || Math.abs(a.r - Geom.dist(p.x, p.y, q.x, q.y)) > tol)
        return `Abre el compás con la distancia de ${this.nombreDe(o.radioComo[0])} a ${this.nombreDe(o.radioComo[1])}.`;
    } else if (o.radioComo !== undefined) {
      const L = this.linea(o.radioComo);
      if (!L || L.tipo !== 'arco' || Math.abs(a.r - L.o.r) > tol)
        return `No cambies la abertura del compás: usa el mismo radio que en ${this.nombreDe(o.radioComo)}.`;
    }
    if (o.completo && !Geom.esCircunferencia(a)) return 'Tiene que ser una circunferencia completa: da la vuelta entera con el compás.';
    if (Number.isFinite(o.barridoMin) && Math.abs(a.a1 - a.a0) * 180 / Math.PI < o.barridoMin) return 'Haz el arco más largo.';
    for (const ref of [].concat(o.pasaPor || [])) {
      const q = this.punto(ref);
      if (!q || Geom.distArco(q.x, q.y, a) > tol) return `El arco tiene que pasar por ${this.nombreDe(ref)}.`;
    }
    for (const c of [].concat(o.cortaA || [])) {
      const ref = typeof c === 'string' ? c : c && c.elemento, n = (c && c.cortes) || 1;
      const L = this.linea(ref), k = L ? Geom.intersecciones({ tipo: 'arco', o: a }, L).length : 0;
      if (k < n) return n > 1 ? `El arco tiene que cortar a ${this.nombreDe(ref)} en ${n} puntos.` : `El arco tiene que cortar a ${this.nombreDe(ref)}.`;
      // Con un corte elegido («corte»: {x, y}), el arco tiene que cortar por ese lado: de los dos
      // sitios donde su circunferencia corta a la línea, el más cercano al elegido
      // Vale el corte más cercano al sitio elegido. Si los dos quedan casi igual de cerca (el sitio no
      // distingue, o el alumno ha inclinado mucho la línea), no se exige ningún lado.
      const elegido = n === 1 && c && c.corte && typeof c.corte === 'object' ? this.punto(c.corte) : null;
      if (elegido) {
        const todos = Geom.intersecciones({ tipo: 'arco', o: Object.assign({}, a, { a0: 0, a1: Geom.DOS_PI }) }, L)
          .map(t => ({ t, d: Geom.dist(t.x, t.y, elegido.x, elegido.y) })).sort((p, q) => p.d - q.d);
        if (todos.length > 1 && todos[1].d - todos[0].d >= Math.max(3, a.r / 4) && Geom.distArco(todos[0].t.x, todos[0].t.y, a) > tol)
          return `El arco tiene que cortar a ${this.nombreDe(ref)} por el otro lado.`;
      }
    }
    return null;
  },
  condInstrumento(o, tol, tolA) {
    const inst = Instrumentos.porTipo[o.instrumento];
    if (!inst) return `Instrumento desconocido: ${o.instrumento}.`;
    if (!inst.visible) return `Saca ${inst.conArticulo} con su botón de la barra.`;
    if (typeof o.bloqueado === 'boolean' && inst.bloqueado !== o.bloqueado)
      return o.bloqueado ? `Fija ${inst.conArticulo} con su candado.` : `Quita el candado de ${inst.conArticulo}.`;
    if (o.origenEn !== undefined) {
      const p = this.punto(o.origenEn), q = inst.aMundo(...inst.origenIman);
      if (!p || Geom.dist(p.x, p.y, q.x, q.y) > tol) return `Coloca el centro de ${inst.conArticulo} en ${this.nombreDe(o.origenEn)}.`;
    }
    const cantos = inst.cantosApoyo();
    const dLinea = (k, x, y) => Math.abs((x - k.a.x) * k.n.x + (y - k.a.y) * k.n.y);
    if (o.cantoSobre !== undefined) {
      const L = this.linea(o.cantoSobre);
      const ok = L && L.tipo === 'recta' && cantos.some(k => dLinea(k, L.o.x1, L.o.y1) <= tol && dLinea(k, L.o.x2, L.o.y2) <= tol);
      if (!ok) return `Apoya un canto de ${inst.conArticulo} justo encima de ${this.nombreDe(o.cantoSobre)}.`;
    }
    if (o.cantoPasaPor !== undefined) {
      const pts = [].concat(o.cantoPasaPor).map(r => this.punto(r));
      const par = o.paraleloA !== undefined ? this.linea(o.paraleloA) : null;
      const per = o.perpendicularA !== undefined ? this.linea(o.perpendicularA) : null;
      const ok = pts.every(Boolean) && cantos.some(k => {
        if (!pts.every(p => dLinea(k, p.x, p.y) <= tol)) return false;
        const ang = Math.atan2(k.u.y, k.u.x);
        if (par && (par.tipo !== 'recta' || this.difAng(ang, this.dirRecta(par.o)) > tolA)) return false;
        if (per && (per.tipo !== 'recta' || 90 - this.difAng(ang, this.dirRecta(per.o)) > tolA)) return false;
        return true;
      });
      if (!ok) {
        const quien = [].concat(o.cantoPasaPor).map(r => this.nombreDe(r)).join(' y ');
        return `Coloca ${inst.conArticulo} para que un canto pase por ${quien}` +
          (par ? `, paralelo a ${this.nombreDe(o.paraleloA)}` : '') + (per ? `, perpendicular a ${this.nombreDe(o.perpendicularA)}` : '') + '.';
      }
    }
    if (o.apoyadoEn !== undefined) {
      const otro = Instrumentos.porTipo[o.apoyadoEn];
      if (!otro || !otro.visible || !this.apoyados(inst, otro))
        return `Apoya ${inst.conArticulo} contra un canto de ${otro ? otro.conArticulo : o.apoyadoEn}.`;
    }
    return null;
  },
  // Dos instrumentos con un canto apoyado en otro (paralelos, juntos y solapados)
  apoyados(a, b) {
    for (const k of a.cantosMundo()) for (const g of b.cantosMundo()) {
      if (this.difAng(Math.atan2(k.u.y, k.u.x), Math.atan2(g.u.y, g.u.x)) > 0.5) continue;
      const d = q => Math.abs((q.x - g.a.x) * g.n.x + (q.y - g.a.y) * g.n.y);
      if (d(k.a) > 0.3 || d(k.b) > 0.3) continue;
      const t = q => (q.x - g.a.x) * g.u.x + (q.y - g.a.y) * g.u.y;
      if (Math.min(g.len, Math.max(t(k.a), t(k.b))) - Math.max(0, Math.min(t(k.a), t(k.b))) > 1) return true;
    }
    return false;
  },

  // ---------- Evaluación de objetivos ----------
  evaluar(o) {
    const tol = Number.isFinite(o.tolerancia) ? o.tolerancia : 1;
    const tolA = Number.isFinite(o.toleranciaGrados) ? o.toleranciaGrados : 1;
    const nombrar = o.nombrar === undefined ? [] : [].concat(o.nombrar);
    // posteriorA: solo vale lo dibujado después de ese elemento (para no reutilizar un arco o un punto anterior)
    let desde = -Infinity;
    if (o.posteriorA !== undefined) {
      const e = this.elemento(o.posteriorA);
      if (!e) return { ok: false, motivo: null };
      desde = e.o.id;
    }
    const propios = l => l.filter(e => (o.permitirDados || !e.dado) && e.id > desde);
    // Un objetivo que pone nombre necesita un elemento nuevo: no vale uno que ya tenga otro nombre del ejercicio
    const conNombre = new Set(Object.values(this.nombres).map(n => n.tipo + ':' + n.id));
    const libres = (l, tipo) => (nombrar.length ? l.filter(e => !conNombre.has(tipo + ':' + e.id)) : l);
    const nuevos = l => l.filter(e => e.id >= this.ultimoId);   // para explicar qué falla
    const fallo = motivo => ({ ok: false, motivo });
    const elegirUno = (lista, cond, tipo) => {
      const orden = libres(propios(lista), tipo).sort((a, b) => b.id - a.id);    // lo más reciente primero
      const bueno = orden.find(e => !cond(e));
      if (bueno) return { ok: true, asignar: nombrar.slice(0, 1).map(n => ({ nombre: n, tipo, id: bueno.id })) };
      const nuevo = nuevos(orden)[0];
      return fallo(nuevo ? cond(nuevo) : null);
    };
    switch (o.tipo) {
      case 'continuar':
        return this.siguiente ? { ok: true, asignar: [] } : fallo(null);
      case 'punto': {
        const n = Number.isInteger(o.cantidad) && o.cantidad > 0 ? o.cantidad : 1;
        const elegidos = [], usados = new Set();
        for (const p of libres(propios(Escena.puntos), 'punto')) {
          if (this.condPunto(p, o, tol, tolA)) continue;
          if (o.cruce !== undefined) {
            const i = this.indiceCruce(p, o, tol);
            if (usados.has(i)) continue;
            usados.add(i);
          }
          elegidos.push(p);
          if (elegidos.length === n) break;
        }
        if (elegidos.length < n) {
          const nuevo = nuevos(propios(Escena.puntos)).sort((a, b) => b.id - a.id)[0];
          const m = nuevo && this.condPunto(nuevo, o, tol, tolA);
          return fallo(m || (elegidos.length && n > 1 ? `Llevas ${elegidos.length} de ${n} puntos.` : null));
        }
        return { ok: true, asignar: nombrar.map((nm, i) => elegidos[i] && { nombre: nm, tipo: 'punto', id: elegidos[i].id }).filter(Boolean) };
      }
      case 'recta': return elegirUno(Escena.rectas, r => this.condRecta(r, o, tol, tolA), 'recta');
      case 'arco': return elegirUno(Escena.arcos, a => this.condArco(a, o, tol), 'arco');
      case 'rectas': {
        const refs = Array.isArray(o.poligono) ? o.poligono : null;
        const segs = refs ? refs.map((r, i) => [r, refs[(i + 1) % refs.length]]).slice(0, o.cerrado === false ? refs.length - 1 : refs.length)
                          : Array.isArray(o.segmentos) ? o.segmentos : [];
        let hechas = 0;
        for (const s of segs) {
          const a = this.punto(s && s[0]), b = this.punto(s && s[1]);
          if (a && b && propios(Escena.rectas).some(r =>
            Geom.distSegmento(a.x, a.y, r.x1, r.y1, r.x2, r.y2) <= tol && Geom.distSegmento(b.x, b.y, r.x1, r.y1, r.x2, r.y2) <= tol)) hechas++;
        }
        if (hechas < segs.length) return fallo(nuevos(Escena.rectas).length ? `Llevas ${hechas} de ${segs.length} líneas.` : null);
        return { ok: true, asignar: [] };
      }
      case 'vertices': {
        const L = this.linea(o.circunferencia), P0 = this.punto(o.desde), n = o.lados;
        if (!L || L.tipo !== 'arco' || !P0 || !Number.isInteger(n) || n < 3) return fallo(null);
        const c = L.o, a0 = Math.atan2(P0.y - c.cy, P0.x - c.cx), hallados = [];
        for (let k = 0; k < n; k++) {
          const t = a0 + k * Geom.DOS_PI / n, x = c.cx + c.r * Math.cos(t), y = c.cy + c.r * Math.sin(t);
          // Los vértices de un polígono regular son los mismos en los dos sentidos de giro
          hallados.push(Escena.puntos.find(q => Geom.dist(q.x, q.y, x, y) <= tol) || null);
        }
        const bien = hallados.filter(Boolean).length;
        if (bien < n) return fallo(nuevos(Escena.puntos).length ? `Llevas ${bien} de ${n} vértices.` : null);
        return { ok: true, asignar: nombrar.map((nm, i) => hallados[i] && { nombre: nm, tipo: 'punto', id: hallados[i].id }).filter(Boolean) };
      }
      case 'instrumento': {
        const m = this.condInstrumento(o, tol, tolA);
        return m ? fallo(m) : { ok: true, asignar: [] };
      }
    }
    return fallo(null);
  },
  // sinOptativos: sin las condiciones marcadas como optativas (y nada si el paso entero lo es)
  evaluarPaso(p, sinOptativos = false) {
    if (sinOptativos && p.optativo === true) return { ok: true, asignar: [] };
    const asignar = [];
    for (const o of this.objetivosDe(p)) {
      const r = this.evaluar(sinOptativos ? this.reducido(o) : o);
      if (!r.ok) return r;
      asignar.push(...r.asignar);
    }
    return { ok: true, asignar };
  },
  // El objetivo sin sus condiciones optativas
  reducido(o) {
    const q = Object.assign({}, o);
    for (const k of [].concat(o.opcionales || [])) if (k !== 'tipo') delete q[k];
    delete q.opcionales;
    return q;
  },
  tieneOptativos(p) { return p.optativo === true || this.objetivosDe(p).some(o => Array.isArray(o.opcionales) && o.opcionales.length > 0); },
  // Un paso con algo optativo se da por bueno sin eso si el alumno ya ha hecho bien el paso siguiente
  // (o los siguientes, si también tienen algo optativo). Devuelve el resultado reducido o null.
  saltarOptativo(i, prof = 0) {
    const pasos = this.def.pasos, p = pasos[i];
    if (!p || !this.tieneOptativos(p) || i + 1 >= pasos.length || prof > 6) return null;
    const r = this.evaluarPaso(p, true);
    if (!r.ok) return null;
    const antes = Object.assign({}, this.nombres);
    for (const a of r.asignar) this.nombres[a.nombre] = { tipo: a.tipo, id: a.id };
    const sigue = this.evaluarPaso(pasos[i + 1]).ok || !!this.saltarOptativo(i + 1, prof + 1);
    this.nombres = antes;
    return sigue ? r : null;
  },

  // ---------- Comprobación tras cada cambio ----------
  comprobar() {
    if (!this.def || this.completado) return;
    // Si se ha deshecho el comienzo, el ejercicio termina
    if (this.iniciales.some(n => !this.elemento(n))) {
      this.salir(false);
      UI.mensaje('Se ha deshecho el comienzo del ejercicio, así que el ejercicio se ha cerrado.');
      return;
    }
    // Si falta algo conseguido en un paso anterior (deshacer, goma), se vuelve a ese paso
    let retrocede = false;
    for (let i = 0; i < this.paso; i++) {
      if ((this.asignados[i] || []).some(n => !this.elemento(n))) {
        for (let j = i; j < this.paso; j++) for (const n of this.asignados[j] || []) { this.desetiquetar(n); delete this.nombres[n]; }
        this.asignados.length = i;
        this.omitidos = (this.omitidos || []).filter(k => k < i);
        this.paso = i;
        retrocede = true;
        break;
      }
    }
    let avanza = 0, motivo = null, saltados = 0;
    const hayNuevo = Escena.sigId > this.ultimoId;
    if (!this.omitidos) this.omitidos = [];
    while (this.paso < this.def.pasos.length) {
      let r = this.evaluarPaso(this.def.pasos[this.paso]);
      if (!r.ok) {
        // Lo optativo no hace falta si el alumno ya ha seguido bien con el paso siguiente
        const s = this.saltarOptativo(this.paso);
        if (!s) {
          motivo = r.motivo;
          if (motivo && this.tieneOptativos(this.def.pasos[this.paso]) && this.evaluarPaso(this.def.pasos[this.paso], true).ok)
            motivo += ' (Es optativo: también puedes seguir con el paso siguiente.)';
          break;
        }
        r = s;
        this.omitidos.push(this.paso);
        saltados++;
      }
      for (const a of r.asignar) { this.nombres[a.nombre] = { tipo: a.tipo, id: a.id }; this.etiquetar(a); }
      this.asignados[this.paso] = r.asignar.map(a => a.nombre);
      this.paso++;
      avanza++;
      this.verPista = false;
    }
    this.siguiente = false;
    this.ultimoId = Escena.sigId;
    if (this.paso >= this.def.pasos.length) {
      this.completado = true;
      Sonido.tocar('fin');
      UI.aviso('¡Ejercicio completado!');
      UI.mensaje(this.def.final || '¡Has terminado el ejercicio! Muy bien.');
    } else if (avanza) {
      Sonido.tocar('bien');
      UI.aviso('¡Bien hecho!');
      UI.mensaje(`Paso ${this.paso + 1}: ${this.def.pasos[this.paso].texto}` + (saltados ? ' (Te has saltado algo optativo.)' : ''));
    } else if (retrocede) {
      UI.mensaje('Has quitado algo que hacía falta: vuelve a hacer este paso.');
    } else if (hayNuevo && motivo) {
      UI.mensaje(motivo);
    }
    if (avanza || retrocede) {
      this.guardar();
      this.pintarTarjeta();
      this.marcarSugeridos();
    }
  },
  // El elemento conseguido lleva en el dibujo el nombre que le da el ejercicio
  etiquetar(a) {
    const el = this.buscarId(a.tipo, a.id);
    if (!el || el.dado) return;
    const n = String(a.nombre).slice(0, 12);
    if (a.tipo === 'punto') {
      if (el.etiqueta === n) return;
      // Si otro punto ya se llamaba así, recibe la primera letra libre
      for (const q of Escena.puntos) if (q !== el && q.etiqueta === n) { q.etiqueta = ''; q.etiqueta = Escena.siguienteEtiqueta(); }
      if (el.etiquetaPrevia === undefined) el.etiquetaPrevia = el.etiqueta;
      el.etiqueta = n;
    } else {
      for (const q of [...Escena.rectas, ...Escena.arcos]) if (q !== el && q.nombre === n) delete q.nombre;
      if (!('nombrePrevio' in el)) el.nombrePrevio = el.nombre;
      el.nombre = n;
    }
    Render.pedir('dibujo');
  },
  desetiquetar(n) {
    const e = this.nombres[n], el = e && this.buscarId(e.tipo, e.id);
    if (!el || el.dado) return;
    if (e.tipo === 'punto' && el.etiqueta === n) {
      el.etiqueta = '';
      const previa = el.etiquetaPrevia;
      el.etiqueta = previa && !Escena.puntos.some(q => q !== el && q.etiqueta === previa) ? previa : Escena.siguienteEtiqueta();
      delete el.etiquetaPrevia;
    } else if (e.tipo !== 'punto' && el.nombre === n) {
      if (el.nombrePrevio) el.nombre = el.nombrePrevio; else delete el.nombre;
      delete el.nombrePrevio;
    }
    Render.pedir('dibujo');
  },
  pulsarSiguiente() { this.siguiente = true; this.comprobar(); this.siguiente = false; },

  // ---------- Guardado del progreso ----------
  guardar() {
    try {
      if (this.def) localStorage.setItem(this.clave, JSON.stringify({
        def: this.def, paso: this.paso, nombres: this.nombres, asignados: this.asignados, omitidos: this.omitidos || [],
        iniciales: this.iniciales, completado: this.completado, configPrevia: this.configPrevia }));
      else localStorage.removeItem(this.clave);
    } catch (_) { /* sin almacenamiento */ }
  },
  recuperar() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.clave)); } catch (_) { d = null; }
    if (!d || !d.def) return;
    try { this.validar(d.def); } catch (_) { return; }
    Object.assign(this, {
      def: d.def,
      paso: Number.isInteger(d.paso) ? Geom.clamp(d.paso, 0, d.def.pasos.length) : 0,
      nombres: d.nombres && typeof d.nombres === 'object' ? d.nombres : {},
      asignados: Array.isArray(d.asignados) ? d.asignados : [],
      omitidos: Array.isArray(d.omitidos) ? d.omitidos.filter(Number.isInteger) : [],
      iniciales: Array.isArray(d.iniciales) ? d.iniciales : [],
      completado: !!d.completado,
      configPrevia: d.configPrevia || null,
    });
    this.ultimoId = Escena.sigId;
    this.pintarTarjeta();
    this.marcarSugeridos();
  },

  // ---------- Tarjeta del ejercicio ----------
  marcarSugeridos() {
    const p = this.def && !this.completado ? this.def.pasos[this.paso] : null;
    const ids = p && Array.isArray(p.herramientas) ? p.herramientas : [];
    document.querySelectorAll('#barra .btn[data-id]').forEach(b => b.classList.toggle('sugerido', ids.includes(b.dataset.id)));
  },
  pintarTarjeta() {
    const el = document.getElementById('tarjeta-ejercicio');
    el.textContent = '';
    if (!this.def) { el.hidden = true; return; }
    el.hidden = false;
    el.classList.toggle('minimizado', this.minimizado);
    el.classList.toggle('completado', this.completado);
    const crear = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
    const N = this.def.pasos.length;
    const cab = crear('div', 'te-cab');
    const ico = crear('span', 'te-ico');
    ico.innerHTML = Iconos.ejercicios;
    cab.append(ico, crear('span', 'te-titulo', this.def.titulo),
      crear('span', 'te-paso', this.completado ? '¡Terminado!' : `Paso ${this.paso + 1} de ${N}`));
    cab.append(
      UI.crearBoton({ nombre: this.minimizado ? 'Mostrar el paso' : 'Ocultar el paso', icono: this.minimizado ? 'expandir' : 'contraer',
                      alPulsar: () => { this.minimizado = !this.minimizado; this.pintarTarjeta(); } }),
      UI.crearBoton({ nombre: 'Salir del ejercicio', icono: 'cerrar', alPulsar: () => this.salir() }));
    el.append(cab);
    const cuerpo = crear('div', 'te-cuerpo');
    const pie = crear('div', 'te-pie');
    const progreso = crear('div', 'te-progreso');
    const omitidos = new Set(this.omitidos || []);
    for (let i = 0; i < N; i++) {
      const t = crear('i', omitidos.has(i) && (i < this.paso || this.completado) ? 'hecho omitido' : i < this.paso || this.completado ? 'hecho' : i === this.paso ? 'actual' : '');
      if (omitidos.has(i)) t.title = `Paso ${i + 1}: te has saltado lo optativo`;
      progreso.append(t);
    }
    pie.append(progreso);
    const boton = (texto, accion, principal) => {
      const b = crear('button', 'te-boton' + (principal ? ' principal' : ''), texto);
      b.type = 'button';
      b.addEventListener('click', accion);
      pie.append(b);
    };
    if (this.completado) {
      cuerpo.append(crear('p', 'te-texto', this.def.final || '¡Has terminado el ejercicio! Muy bien.'));
      boton('Repetir', () => this.iniciar(this.def));
      boton('Otro ejercicio', () => UI.abrirPanel('ejercicios'), true);
    } else {
      const p = this.def.pasos[this.paso];
      cuerpo.append(crear('p', 'te-texto', p.texto));
      if (this.tieneOptativos(p)) cuerpo.append(crear('p', 'te-optativo', p.optativo === true
        ? 'Paso optativo: si quieres, puedes saltártelo y seguir con el siguiente.'
        : 'Una parte de este paso es optativa: si sigues bien con el siguiente paso, vale igual.'));
      if (this.verPista && typeof p.pista === 'string') cuerpo.append(crear('p', 'te-pista', p.pista));
      if (typeof p.pista === 'string') boton(this.verPista ? 'Ocultar pista' : 'Pista', () => { this.verPista = !this.verPista; this.pintarTarjeta(); });
      if (this.objetivosDe(p).some(o => o.tipo === 'continuar')) boton('Siguiente', () => this.pulsarSiguiente(), true);
    }
    cuerpo.append(pie);
    el.append(cuerpo);
  },
};

/* Lista de ejercicios: ejercicios/indice.json y un archivo por ejercicio */
const Catalogo = {
  estado: 'sin-cargar',   // sin-cargar | cargando | listo | error
  lista: [],              // {archivo, def} o {archivo, error}
  grupos: [],             // [{id, titulo, descripcion, abierto, items: [...]}], en el orden del índice
  ordenando: false,
  // Preferencias de cada persona: orden de los grupos y cuáles están desplegados
  CLAVE: 'dibutec.ejercicios.grupos',
  prefs() {
    try { const p = JSON.parse(localStorage.getItem(this.CLAVE)); if (p && typeof p === 'object') return p; } catch (_) {}
    return {};
  },
  guardarPrefs(p) { try { localStorage.setItem(this.CLAVE, JSON.stringify(p)); } catch (_) { /* sin almacenamiento */ } },
  aId(t) { return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'grupo'; },
  // Grupos en el orden elegido por la persona; los grupos nuevos del índice van al final, en su orden
  ordenados() {
    const orden = Array.isArray(this.prefs().orden) ? this.prefs().orden : [];
    const pos = id => { const i = orden.indexOf(id); return i < 0 ? Infinity : i; };
    return this.grupos.map((g, i) => ({ g, i })).sort((a, b) => (pos(a.g.id) - pos(b.g.id)) || (a.i - b.i)).map(x => x.g);
  },
  mover(id, paso) {
    const ids = this.ordenados().map(g => g.id), i = ids.indexOf(id), j = i + paso;
    if (i < 0 || j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    const p = this.prefs(); p.orden = ids; this.guardarPrefs(p);
    this.pintar();
    // El foco sigue en el mismo botón del grupo movido
    const b = document.querySelector(`.grupo-ej[data-id="${CSS.escape(id)}"] .ge-mover button[data-paso="${paso}"]`);
    if (b && !b.disabled) b.focus();
    else { const o = document.querySelector(`.grupo-ej[data-id="${CSS.escape(id)}"] .ge-mover button:not(:disabled)`); if (o) o.focus(); }
    UI.mensaje(`«${this.grupos.find(g => g.id === id).titulo}» movido a la posición ${j + 1} de ${ids.length}.`);
  },
  restablecerOrden() {
    const p = this.prefs(); delete p.orden; delete p.abiertos; this.guardarPrefs(p);
    this.pintar();
    UI.aviso('Orden de los temas restablecido');
  },
  CARPETA: 'ejercicios/',

  async cargar() {
    if (this.estado === 'cargando' || this.estado === 'listo') return;
    this.estado = 'cargando';
    this.pintar();
    try {
      const r = await fetch(this.CARPETA + 'indice.json', { cache: 'no-cache' });
      if (!r.ok) throw new Error('sin índice');
      const indice = await r.json();
      const valido = a => typeof a === 'string' && /^[\w.-]+\.json$/.test(a) && !a.startsWith('.');
      // Índice por temas ({grupos: [...]}) o, en el formato antiguo, una lista sin grupos
      const grupos = Array.isArray(indice.grupos)
        ? indice.grupos.filter(g => g && typeof g === 'object')
        : [{ id: 'ejercicios', titulo: 'Ejercicios', ejercicios: indice.ejercicios }];
      const usados = new Set();
      // Cada ejercicio se carga de su propio archivo; uno roto no impide los demás
      const cargarUno = async archivo => {
        try {
          const rr = await fetch(this.CARPETA + archivo, { cache: 'no-cache' });
          if (!rr.ok) throw new Error('no se encuentra el archivo');
          return { archivo, def: Ejercicio.validar(await rr.json()) };
        } catch (e) {
          return { archivo, error: e instanceof SyntaxError ? 'el JSON tiene un error de escritura' : e.message };
        }
      };
      this.grupos = await Promise.all(grupos.map(async (g, i) => {
        const titulo = typeof g.titulo === 'string' && g.titulo.trim() ? g.titulo.trim() : `Grupo ${i + 1}`;
        let id = typeof g.id === 'string' && g.id.trim() ? g.id.trim() : this.aId(titulo);
        while (usados.has(id)) id += '-' + (i + 1);
        usados.add(id);
        const archivos = (Array.isArray(g.ejercicios) ? g.ejercicios : []).filter(valido);
        return { id, titulo, descripcion: typeof g.descripcion === 'string' ? g.descripcion : '',
                 abierto: g.abierto !== false, items: await Promise.all(archivos.map(cargarUno)) };
      }));
      this.lista = this.grupos.flatMap(g => g.items);
      this.estado = 'listo';
    } catch (_) {
      this.estado = 'error';
    }
    this.pintar();
  },
  leerArchivo(archivo) {
    if (archivo.size > 2e6) { UI.aviso('Ese archivo es demasiado grande para ser un ejercicio.'); return; }
    archivo.text().then(t => {
      let d;
      try { d = JSON.parse(t); } catch (_) { UI.aviso('El archivo no es un JSON válido.'); return; }
      Ejercicio.iniciar(d);
    });
  },
  pintar() {
    const c = document.getElementById('ejercicios-lista');
    if (!c) return;
    c.textContent = '';
    const crear = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
    if (this.estado === 'cargando') { c.append(crear('p', 'nota', 'Cargando ejercicios…')); return; }
    if (this.estado === 'error') {
      c.append(crear('p', 'nota', 'No se ha podido leer la carpeta de ejercicios. Si has abierto DibuTec con doble clic, ' +
        'el navegador no deja leerla: ábrelo desde una página web o carga un ejercicio desde un archivo.'));
      return;
    }
    if (!this.lista.length) { c.append(crear('p', 'nota', 'La carpeta de ejercicios está vacía.')); return; }
    // Barra: ordenar los temas y volver al orden original
    const barra = crear('div', 'ej-herramientas');
    const bOrd = crear('button', null, this.ordenando ? 'Hecho' : 'Ordenar temas');
    bOrd.type = 'button';
    bOrd.setAttribute('aria-pressed', String(this.ordenando));
    bOrd.addEventListener('click', () => { this.ordenando = !this.ordenando; this.pintar(); document.querySelector('.ej-herramientas button').focus(); });
    barra.append(bOrd);
    if (this.ordenando) {
      const bRes = crear('button', null, 'Orden original');
      bRes.type = 'button';
      bRes.addEventListener('click', () => this.restablecerOrden());
      barra.append(bRes);
    }
    c.append(barra);
    const lista = crear('div', 'lista-ej' + (this.ordenando ? ' ordenando' : ''));
    c.append(lista);
    const prefs = this.prefs(), abiertos = prefs.abiertos || {};
    const ordenados = this.ordenados();
    ordenados.forEach((g, n) => {
      const det = crear('details', 'grupo-ej');
      det.dataset.id = g.id;
      det.open = g.id in abiertos ? !!abiertos[g.id] : g.abierto;
      det.addEventListener('toggle', () => {
        const p = this.prefs(); p.abiertos = Object.assign({}, p.abiertos, { [g.id]: det.open }); this.guardarPrefs(p);
      });
      const sum = crear('summary');
      const texto = crear('span', 'ge-texto');
      texto.append(crear('span', 'ge-titulo', g.titulo));
      if (g.descripcion) texto.append(crear('span', 'ge-desc', g.descripcion));
      const ok = g.items.filter(i => !i.error).length;
      sum.append(crear('span', 'ge-flecha'), texto, crear('span', 'ge-num', `${ok} ${ok === 1 ? 'ejercicio' : 'ejercicios'}`));
      const mov = crear('span', 'ge-mover');
      for (const [paso, sim, nombre] of [[-1, '↑', 'Subir'], [1, '↓', 'Bajar']]) {
        const b = crear('button', null, sim);
        b.type = 'button';
        b.dataset.paso = paso;
        b.setAttribute('aria-label', `${nombre} el tema «${g.titulo}»`);
        b.title = `${nombre} el tema`;
        b.disabled = paso < 0 ? n === 0 : n === ordenados.length - 1;
        // Dentro del summary: que el botón no despliegue ni pliegue el grupo
        b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); this.mover(g.id, paso); });
        mov.append(b);
      }
      sum.append(mov);
      const cuerpo = crear('div', 'ge-cuerpo');
      if (!g.items.length) cuerpo.append(crear('p', 'nota', 'Este tema todavía no tiene ejercicios.'));
      this.pintarItems(g.items, cuerpo, crear);
      det.append(sum, cuerpo);
      lista.append(det);
    });
  },
  pintarItems(items, c, crear) {
    for (const item of items) {
      if (item.error) { c.append(crear('p', 'nota error', `${item.archivo}: ${item.error}.`)); continue; }
      const d = item.def;
      const b = crear('button', 'ejercicio-item');
      b.type = 'button';
      b.append(crear('strong', null, d.titulo));
      b.append(crear('span', 'meta', [d.nivel, `${d.pasos.length} pasos`].filter(x => typeof x === 'string' && x).join(' · ')));
      if (typeof d.descripcion === 'string') b.append(crear('span', 'desc', d.descripcion));
      b.addEventListener('click', () => Ejercicio.iniciar(d));
      c.append(b);
    }
  },
  construir() {
    const c = document.getElementById('ejercicios-cuerpo');
    const titulo = t => { const h = document.createElement('h3'); h.textContent = t; c.appendChild(h); };
    titulo('Ejercicios');
    const lista = document.createElement('div');
    lista.id = 'ejercicios-lista';
    c.appendChild(lista);
    titulo('Desde un archivo');
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn-texto primero';
    b.innerHTML = Iconos.abrir + '<span>Cargar un ejercicio (.json)</span>';
    b.addEventListener('click', () => document.getElementById('abrir-ejercicio').click());
    c.appendChild(b);
    titulo('Crear ejercicios');
    const ed = document.createElement('a');
    ed.className = 'btn-texto primero';
    ed.href = 'editor.html';
    ed.target = '_blank';
    ed.rel = 'noopener';
    ed.innerHTML = Iconos.ejercicios + '<span>Abrir el editor de ejercicios</span>';
    c.appendChild(ed);
    const n = document.createElement('p');
    n.className = 'nota-final';
    n.textContent = 'También puedes arrastrar un archivo de ejercicio sobre la hoja. Para añadir ejercicios a la lista, ' +
      'copia su archivo .json en la carpeta «ejercicios» y escribe su nombre en ejercicios/indice.json.';
    c.appendChild(n);
    document.getElementById('abrir-ejercicio').addEventListener('change', e => {
      const f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (f) this.leerArchivo(f);
    });
    this.pintar();
  },
};

/* Aplica un cambio de configuración al resto de la aplicación */
function aplicarConfig(clave) {
  const todo = clave === '*';
  const raiz = document.documentElement;
  if (todo || clave === 'interfaz') raiz.dataset.interfaz = Config.get('interfaz');
  if (todo || clave === 'ayuda') raiz.dataset.ayuda = Config.get('ayuda') ? 'si' : 'no';
  if (todo || clave === 'hoja') {
    Hoja.actualizar();
    if (Capas.w) Vista.ajustar();
  }
  if (clave === 'modoGoma') {
    UI.mensaje(Goma.aTrozos()
      ? 'Goma a trozos: borra solo lo que pisa, para recortar los extremos de las líneas.'
      : 'Goma de líneas enteras: borra la línea, el arco o el punto que toques.');
    Render.pedir('instrumentos');
  }
  if (todo || clave.startsWith('tam') && clave !== 'tamGoma') Instrumentos.medir();
  if (todo || clave === 'colorLapiz' || clave === 'grosorLapiz') {
    UI.actualizarOpcionesLapiz();
    Render.pedir('instrumentos');   // punta del portaminas y mina del compás
  }
  if (clave === 'colorInstrumentos') Render.pedir('instrumentos');
  if (todo || clave === 'compas3d') Compas3D.alCambiar();
  if (clave === 'tamGoma') {
    UI.mensaje(`Tamaño de la goma: ${Config.get('tamGoma')} mm.`);
    Goma.mostrarTamano();
  }
  Render.pedir('papel', 'dibujo');
  Panel.actualizar();
}

/* =====================================================================
   Arranque
   ===================================================================== */
function iniciar() {
  Config.cargar();
  Cartela.cargar();
  PiezasSVG.cargar();
  Hoja.actualizar();
  Capas.iniciar();
  UI.iniciar();
  Entrada.iniciar();
  aplicarConfig('*');
  Config.alCambiar(aplicarConfig);

  let primera = true;
  const alCambiarTamano = () => {
    const antes = Capas.redimensionar();
    if (primera || !antes.w) { primera = false; Vista.ajustar(); return; }
    // Mantiene centrado el mismo punto de la hoja
    Vista.ox += (Capas.w - antes.w) / 2;
    Vista.oy += (Capas.h - antes.h) / 2;
    Vista.limitar();
    Render.cambioVista();
  };
  new ResizeObserver(alCambiarTamano).observe(Capas.contenedor);
  // Cambio de densidad de píxeles (mover la ventana a otro monitor, zoom del navegador)
  window.addEventListener('resize', () => {
    if ((window.devicePixelRatio || 1) !== Capas.dpr) alCambiarTamano();
  });

  const habia = Guardado.recuperar();
  Ejercicio.recuperar();
  App.seleccionar('lapiz');
  UI.mensaje(habia
    ? 'Aquí está tu dibujo de la última vez. Pulsa ? si necesitas ayuda.'
    : '¡Bienvenido a DibuTec! Toca la hoja con el portaminas para marcar puntos. Pulsa ? para ver la ayuda.');
  if (Ejercicio.def) UI.mensaje(`Sigues con el ejercicio «${Ejercicio.def.titulo}».`);

  // Abrir un ejercicio desde la dirección: index.html?ejercicio=ejercicios/mediatriz.json
  const ruta = new URLSearchParams(location.search).get('ejercicio');
  if (ruta && /^[\w./-]+\.json$/.test(ruta) && !ruta.includes('..') && !ruta.startsWith('/')) {
    fetch(ruta, { cache: 'no-cache' }).then(r => r.json()).then(d => Ejercicio.iniciar(d))
      .catch(() => UI.aviso('No se ha podido abrir el ejercicio indicado en la dirección.'));
  }

  // Probar un ejercicio desde el editor (editor.html): lo deja en localStorage y abre index.html?prueba=editor
  if (new URLSearchParams(location.search).get('prueba') === 'editor') {
    let d = null;
    try { d = JSON.parse(localStorage.getItem('dibutec.editor.prueba')); } catch (_) { d = null; }
    if (d && d.formato === 'dibutec-ejercicio') Ejercicio.iniciar(d);
    else UI.aviso('No hay ningún ejercicio del editor para probar.');
  }

  // Arrastrar un archivo sobre la hoja: ejercicio o dibujo guardado
  window.addEventListener('dragover', e => { e.preventDefault(); });
  window.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    if (f.size > 5e6) { UI.aviso('Ese archivo es demasiado grande.'); return; }
    f.text().then(t => {
      let d;
      try { d = JSON.parse(t); } catch (_) { UI.aviso('Solo se pueden abrir archivos de DibuTec (.json).'); return; }
      if (d && d.formato === 'dibutec-ejercicio') Ejercicio.iniciar(d);
      else if (d && d.app === 'DibuTec') Archivo.leer(f);
      else UI.aviso('Ese archivo no es un dibujo ni un ejercicio de DibuTec.');
    });
  });
}

// Acceso para pruebas automáticas
window.DibuTec = { Config, Vista, Capas, Hoja, App, Entrada, UI, Render, Iconos, Papel, Panel, Escena, Historial, Snap, Geom, SelectorLapiz, Instrumentos, Manip, Guardado, Archivo, Lupa, Ejercicio, Catalogo, Goma };

iniciar();
</script>
