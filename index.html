    }
    if (f.stroke) {
      ctx.globalAlpha = alfa0 * (Number.isFinite(f.stroke.alfa) ? f.stroke.alfa : 1);
      ctx.strokeStyle = f.mina && op.colorMina ? op.colorMina : f.stroke.color;
      ctx.lineWidth = f.grosor; ctx.lineCap = f.extremo; ctx.lineJoin = f.union;
      ctx.stroke(f.path);
    }
    ctx.globalAlpha = antes;
  },
  // Repite la pieza a lo largo de x, de 0 a «largo» (el paso es el ancho de su viewBox)
  repetir(ctx, nombre, mat, largo) {
    const pz = this.pieza(nombre);
    if (!pz) return;
    const vb = pz.viewBox || { x: 0, y: -1, w: 1, h: 2 };
    ctx.save();
    ctx.transform(...mat);
    ctx.beginPath();
    ctx.rect(0, vb.y, largo, vb.h);
    ctx.clip();
    for (let x = 0; x < largo; x += vb.w) {
      ctx.save();
      ctx.translate(x - vb.x, 0);
      for (const f of pz.formas) this.forma(ctx, f, {});
      ctx.restore();
    }
    ctx.restore();
  },
  marca(nombre, id) { const pz = this.pieza(nombre); return pz && pz.marcas[id] || null; },
  caja(nombre) { const pz = this.pieza(nombre); return pz && pz.caja; },
};

/* =====================================================================
   Compás en 3D (opción de la configuración): el mismo compás, dibujado con su
   modelo 3D (instrumentos/compas/3d/compas.glb, o construido desde las piezas
   SVG). Three.js y el motor (compas3d.js) se cargan solo al activarlo. Se pinta
   en un lienzo WebGL aparte y se copia en la capa de los instrumentos, en su
   sitio; el asa y el botón de la mina los sigue dibujando la clase Compas.
   ===================================================================== */
const Compas3D = {
  estado: 'apagado',   // apagado | cargando | listo | error
  SCRIPTS: ['vendor/three-r147/three.min.js', 'vendor/three-r147/GLTFLoader.js', 'vendor/three-r147/SVGLoader.js',
            'vendor/three-r147/RoomEnvironment.js', 'compas3d.js'],
  usar() { return !!Config.get('compas3d'); },
  alCambiar() {
    if (this.usar()) this.preparar();
    this.ponerLimites();
    this.ultima = null;
    Render.pedir('instrumentos');
  },
  script(src) {
    return new Promise((ok, mal) => {
      if (document.querySelector(`script[data-compas3d="${src}"]`)) { ok(); return; }
      const sc = document.createElement('script');
      sc.src = src; sc.dataset.compas3d = src;
      sc.onload = () => ok(); sc.onerror = () => mal(new Error('No se ha podido cargar ' + src));
      document.head.appendChild(sc);
    });
  },
  async preparar() {
    if (this.estado !== 'apagado') return;
    this.estado = 'cargando';
    UI.mensaje('Preparando el compás en 3D…');
    try {
      for (const src of this.SCRIPTS) await this.script(src);   // en orden: cada uno usa los anteriores
      const { modelo } = await DibuTecCompas3D.cargarModelo('instrumentos/compas/3d/compas.glb', n => PiezasSVG.incrustadas[n]);
      this.montar(modelo);
      this.estado = 'listo';
      this.ponerLimites();
      this.ultima = null;
      Render.pedir('instrumentos');
      if (this.usar()) UI.mensaje('Compás en 3D listo.');
    } catch (e) {
      console.warn('Compás 3D:', e);
      this.estado = 'error';
      UI.aviso('No se ha podido preparar el compás en 3D: se usa el de siempre.');
    }
  },
  montar(modelo) {
    THREE.ColorManagement.legacyMode = false;   // los colores del modelo son sRGB
    const lienzo = this.lienzo = document.createElement('canvas');
    const r = this.renderer = new THREE.WebGLRenderer({ canvas: lienzo, antialias: true, alpha: true, preserveDrawingBuffer: true });
    r.setClearColor(0x000000, 0);
    r.shadowMap.enabled = true;
    r.shadowMap.type = THREE.PCFSoftShadowMap;
    r.outputEncoding = THREE.sRGBEncoding;
    const e = this.escena = new THREE.Scene();
    e.environment = new THREE.PMREMGenerator(r).fromScene(new THREE.RoomEnvironment(), 0.04).texture;
    e.add(new THREE.HemisphereLight('#ffffff', '#b9ab90', 0.4));
    const sol = this.sol = new THREE.DirectionalLight('#ffffff', 0.7);
    sol.castShadow = true;
    sol.shadow.mapSize.set(1024, 1024);
    Object.assign(sol.shadow.camera, { left: -130, right: 130, top: 130, bottom: -130, near: 10, far: 500 });
    sol.shadow.bias = -0.0008;
    e.add(sol, sol.target);
    // Suelo invisible que solo recoge la sombra del compás sobre la hoja
    const suelo = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity: 0.22 }));
    suelo.receiveShadow = true;
    e.add(suelo);
    // Cámara desde arriba, como la hoja: x a la derecha y la y de la hoja hacia abajo (−z en la pantalla es arriba)
    this.camara = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 1000);
    this.camara.up.set(0, 0, -1);
    this.sitio = new THREE.Group();     // aguja en la hoja y giro
    this.alzadoG = new THREE.Group();   // tumbado o de pie
    this.sitio.add(this.alzadoG);
    e.add(this.sitio);
    this.alzadoG.add(modelo);
    modelo.traverse(o => { if (o.isMesh) o.castShadow = true; });
    const M = this.M = DibuTecCompas3D.Mecanica;
    M.init(modelo);
    M.reposar();
    this.grosor = Math.max(1, -new THREE.Box3().setFromObject(modelo).min.z);   // para apoyarlo tumbado
    M.p.mina.traverse(o => { if (o.isMesh) o.material = o.material.clone(); });
  },
  // Con el compás 3D, la abertura va de un tope a otro del tornillo de ajuste (dentro de 12-110 mm)
  ponerLimites() {
    const c = Instrumentos.porTipo.compas;
    if (!c) return;
    if (this.estado === 'listo' && this.usar()) {
      c.rMin = Math.max(12, Math.ceil(this.M.rMin * 10) / 10);
      c.rMax = Math.min(110, Math.floor(this.M.rMax * 10) / 10);
    } else { c.rMin = 12; c.rMax = 110; }
    c.r = c.limitarRadio(c.r);
  },
  // Dibuja el compás c en ctx (capa de instrumentos). false si no se usa o aún no está listo
  dibujar(ctx, c) {
    if (!this.usar()) return false;
    if (this.estado !== 'listo') { if (this.estado === 'apagado') this.preparar(); return false; }
    const w = Capas.w, h = Capas.h, d = Capas.dpr, color = Paleta.lapizActual();
    const clave = [c.x, c.y, c.rot, c.r, c.alzado, c.levantada, color, Vista.escala, Vista.ox, Vista.oy, w, h, d].join('|');
    if (clave !== this.ultima) {   // solo se vuelve a pintar si algo ha cambiado
      this.ultima = clave;
      const M = this.M, a = c.alzado, s = Vista.escala, cam = this.camara;
      M.ponerRadio(c.r);
      this.sitio.position.set(c.x, 0, c.y);
      this.sitio.rotation.set(0, -c.rot, 0);
      this.alzadoG.rotation.set(-(1 - a) * Math.PI / 2, 0, 0);
      this.alzadoG.position.set(0, (1 - a) * this.grosor, 0);
      M.p.mina.traverse(o => { if (o.isMesh) { o.material.color.set(color); o.material.transparent = c.levantada; o.material.opacity = c.levantada ? 0.35 : 1; } });
      this.sol.position.set(c.x - 60, 160, c.y - 90);
      this.sol.target.position.set(c.x, 0, c.y);
      Object.assign(cam, { left: -Vista.ox / s, right: (w - Vista.ox) / s, top: Vista.oy / s, bottom: -(h - Vista.oy) / s });
      cam.position.set(0, 400, 0);
      cam.lookAt(0, 0, 0);
      cam.updateProjectionMatrix();
      this.renderer.setPixelRatio(d);
      this.renderer.setSize(w, h, false);
      this.renderer.render(this.escena, cam);
    }
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(this.lienzo, 0, 0);
    ctx.restore();
    return true;
  },
};

class Compas extends Instrumento {
  constructor() {
    super('compas', 'Compás', 'o');
    this.r = 40;                 // radio en mm
    this.pierna = 75;            // longitud aparente de las patas (vista desde arriba)
    // Abertura (radio) mínima y máxima: cerrado del todo, las patas se montarían; muy abierto, el
    // compás pierde rigidez. Con estos límites caben todos los ejercicios (hasta 10 cm de radio)
    this.rMin = 12;
    this.rMax = 110;
    this.origenIman = [0, 0];    // la punta seca se pega a los puntos
    this.levantada = false;      // mina levantada: el compás gira sin pintar
    this.alzado = 0;             // 0: tumbado (visto desde arriba); 1: de pie, perpendicular al papel, al trazar
    this.ayuda = 'Compás: arrastra la punta seca hasta un punto, abre el compás moviendo la mina y gira el asa de arriba. El botón de la mina decide si pinta (apoyada) o solo gira (levantada).';
  }
  // Tornillos de la cabeza en los que giran las patas (respecto a la bisagra, en la vista tumbada)
  ejes() {
    const P = PiezasSVG;
    return [P.marca('compas/tumbado/cabeza', 'eje-aguja') || { x: -2.5, y: 7.3 }, P.marca('compas/tumbado/cabeza', 'eje-mina') || { x: 2.5, y: 7.3 }];
  }
  // Largo de una pata, de su tornillo a la punta (según su pieza)
  largoPata(vista, pata) {
    const P = PiezasSVG, n = `compas/${vista}/${pata}`;
    const punta = (P.marca(n, 'punta') || { y: vista === 'tumbado' ? 75 : 25.4 }).y, eje = (P.marca(n, 'eje') || { y: vista === 'tumbado' ? 7.7 : 2.5 }).y;
    return { punta, eje, largo: punta - eje };
  }
  // Distancia de la bisagra a la línea de las puntas con el compás tumbado: las patas, de largo fijo,
  // van de sus tornillos (en la cabeza) a las puntas
  altura() {
    const [ei, ed] = this.ejes(), ex = (ed.x - ei.x) / 2, ey = (ei.y + ed.y) / 2;
    const L = (this.largoPata('tumbado', 'pata-aguja').largo + this.largoPata('tumbado', 'pata-mina').largo) / 2;
    const h = Math.max(0, this.r / 2 - ex);
    return ey + Math.sqrt(Math.max(L * L - h * h, (L * 0.18) ** 2));
  }
  limitarRadio(r) { return Geom.clamp(r, this.rMin, this.rMax); }
  // De pie, visto desde arriba, la bisagra queda sobre el centro de las patas
  bisagra() { return [this.r / 2, -this.altura() * (1 - this.alzado)]; }
  // Asa: en la punta del mango, que sale de la cabeza (en la vista tumbada); de pie, casi sobre la bisagra.
  // Con poco zoom el mango se alarga para que el asa no tape la cabeza
  pomo() {
    const b = this.bisagra(), c = PiezasSVG.caja('compas/tumbado/cabeza') || { y: 1 };
    const asa = PiezasSVG.marca('compas/tumbado/mango', 'asa'), largo = asa ? -asa.y : 8;
    return [b[0], b[1] + (c.y - Math.max(largo, 19.5 / Vista.escala)) * (1 - this.alzado * 0.85)];
  }
  // Animación al ponerse de pie (1) o tumbarse (0)
  animarAlzado(objetivo, ms = 420) {
    let quieto = false;
    try { quieto = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) { /* */ }
    if (quieto) { this.alzado = objetivo; Render.pedir('instrumentos'); return; }
    const desde = this.alzado, t0 = performance.now();
    this._anim = t0;
    const paso = ahora => {
      if (this._anim !== t0) return;                     // otra animación la ha sustituido
      // Curva suave (seno) al empezar y al terminar
      const k = Math.min(1, (ahora - t0) / ms), e = (1 - Math.cos(Math.PI * k)) / 2;
      this.alzado = desde + (objetivo - desde) * e;
      Render.pedir('animacion');
      if (k < 1) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  }
  centroLocal() { return [this.r / 2, -this.altura() / 2]; }
  cantosMundo() { return []; }
  radioPunta() { return Math.max(3, 12 / Vista.escala); }
  contiene(wx, wy) { return !!this.tocarPropio({ x: wx, y: wy }, 0); }
  // Botón para apoyar o levantar la mina, junto al asa
  botonMina() { const k = this.pomo(); return [k[0] - this.radioAsa() * 2.3, k[1]]; }
  radioBotonMina() { return Math.max(4, 12 / Vista.escala); }
  alternarMina() {
    this.levantada = !this.levantada;
    Sonido.tocar('iman');
    UI.mensaje(this.levantada
      ? 'Mina levantada: el compás gira sin pintar.'
      : 'Mina apoyada: al girar el asa, el compás pinta.');
    Render.pedir('instrumentos');
  }
  tocarPropio(info, extra) {
    const p = this.aLocal(info.x, info.y), b = this.bisagra(), k = this.pomo();
    const d = q => Math.hypot(p.x - q[0], p.y - q[1]);
    if (d(this.botonMina()) <= this.radioBotonMina() + extra) return { inst: this, modo: 'mina' };
    if (d(k) <= this.radioAsa() + extra) return { inst: this, modo: 'trazar' };
    if (d([this.r, 0]) <= this.radioPunta() + extra) return { inst: this, modo: 'abrir' };
    if (d([0, 0]) <= this.radioPunta() + extra) return { inst: this, modo: 'mover' };
    const ancho = Math.max(2.5, 9 / Vista.escala) + extra;
    const seg = (q) => Geom.distSegmento(p.x, p.y, b[0], b[1], q[0], q[1]) <= ancho;
    const c = this.cabezal(), enCabeza = Math.abs(p.x - c.x) <= c.ancho / 2 + extra && p.y >= c.arriba - extra && p.y <= c.abajo + extra;
    if (seg([0, 0]) || seg([this.r, 0]) || seg(k) || d(b) <= 5 + extra || enCabeza) return { inst: this, modo: 'mover' };
    return null;
  }
  dibujarBotonMina(ctx) {
    const [x, y] = this.botonMina(), R = this.radioBotonMina(), px = 1 / Vista.escala, lev = this.levantada;
    ctx.beginPath();
    ctx.arc(x, y, R, 0, Geom.DOS_PI);
    ctx.fillStyle = lev ? 'rgba(255, 255, 255, .92)' : 'rgba(232, 93, 80, .95)';
    ctx.fill();
    ctx.strokeStyle = lev ? 'rgba(90, 95, 110, .8)' : '#9c3a30';
    ctx.lineWidth = 1.5 * px;
    ctx.stroke();
    // Punta de la mina sobre la línea del papel: tocándola (apoyada) o separada (levantada)
    const w = R * 0.32, sube = lev ? R * 0.3 : 0, col = lev ? '#5a5f6e' : '#fff';
    ctx.beginPath();
    ctx.moveTo(x - w, y - R * 0.45 - sube);
    ctx.lineTo(x + w, y - R * 0.45 - sube);
    ctx.lineTo(x, y + R * 0.18 - sube);
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - R * 0.55, y + R * 0.4);
    ctx.lineTo(x + R * 0.55, y + R * 0.4);
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(0.3, 1.6 * px);
    if (lev) ctx.setLineDash([R * 0.15, R * 0.12]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  // Medidas de la cabeza (mm locales), sacadas de su pieza SVG. De pie se ve desde arriba: más ancha y aplastada
  cabezal() {
    const b = this.bisagra(), s = 1 + this.alzado * 0.5, f = 1 - this.alzado * 0.8;
    const c = PiezasSVG.caja('compas/tumbado/cabeza') || { x: -4.4, y: 1, w: 8.8, h: 16 };
    return { s, f, x: b[0] + (c.x + c.w / 2) * s, arriba: b[1] + c.y * s * f, abajo: b[1] + (c.y + c.h) * s * f, ancho: c.w * s };
  }
  // Pata desde la bisagra hasta la punta t; n: hacia fuera (al otro lado de la otra pata)
  ladoPata(b, t, otra) {
    const L = Math.hypot(t[0] - b[0], t[1] - b[1]) || 1e-6, v = [(t[0] - b[0]) / L, (t[1] - b[1]) / L];
    let n = [-v[1], v[0]];
    if ((otra[0] - t[0]) * n[0] + (otra[1] - t[1]) * n[1] > 0) n = [-n[0], -n[1]];
    return { L, v, n };
  }
  // Dibujado con las piezas SVG de instrumentos/compas (ver instrumentos/LEEME.md): tumbado, el alzado del
  // compás; de pie, su planta (visto desde arriba). Al ponerse de pie, un dibujo da paso al otro.
  dibujar(ctx) {
    const b = this.bisagra(), k = this.pomo(), px = 1 / Vista.escala, a = this.alzado;
    const t = Geom.clamp((a - 0.35) / 0.3, 0, 1);   // 0: alzado; 1: planta
    const en3D = Compas3D.dibujar(ctx, this);        // con la opción «Compás en 3D»
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    if (!en3D && t < 1) { ctx.save(); ctx.globalAlpha = 1 - t; this.dibujarTumbado(ctx, b, k); ctx.restore(); }
    if (!en3D && t > 0) { ctx.save(); ctx.globalAlpha = t; this.dibujarDePie(ctx, b); ctx.restore(); }
    if (this.levantada) {
      // Sombra de la punta: la mina no toca el papel
      ctx.beginPath();
      ctx.arc(this.r, 0, Math.max(0.8, 3 * px), 0, Geom.DOS_PI);
      ctx.strokeStyle = 'rgba(90, 90, 100, .6)';
      ctx.lineWidth = px;
      ctx.stroke();
    }
    // Punta seca (en 3D ya se ve la aguja)
    if (!en3D) {
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(0.5, 2 * px), 0, Geom.DOS_PI);
      ctx.fillStyle = '#2b2f3a';
      ctx.fill();
    }
    // Asa para girar y trazar
    this.dibujarAsa(ctx, { x: k[0], y: k[1] });
    this.dibujarBotonMina(ctx);
    ctx.restore();
  }
  sombra(ctx, a, cerca = 0) {
    ctx.shadowColor = `rgba(30, 40, 60, ${.25 - a * .07})`;
    ctx.shadowBlur = (8 + a * 14 + cerca) * Capas.dpr;
    ctx.shadowOffsetY = (3 + a * 9) * Capas.dpr;
    ctx.shadowOffsetX = a * 5 * Capas.dpr;
  }
  // Tornillo de ajuste: varilla entre las marcas «ajuste» de las patas, una pinza en cada pata y la rueda en medio
  dibujarAjuste(ctx, vista, ql, qr, s) {
    const P = PiezasSVG, dl = Math.hypot(qr[0] - ql[0], qr[1] - ql[1]) || 1e-6;
    const u = [(qr[0] - ql[0]) / dl, (qr[1] - ql[1]) / dl], w = [-u[1], u[0]];
    const e0 = [ql[0] - u[0] * 4 * s, ql[1] - u[1] * 4 * s];
    P.repetir(ctx, `compas/${vista}/varilla`, [u[0], u[1], w[0] * s, w[1] * s, e0[0], e0[1]], dl + 8 * s);
    P.dibujar(ctx, `compas/${vista}/taco`, [-u[0] * s, -u[1] * s, w[0] * s, w[1] * s, ql[0], ql[1]]);
    P.dibujar(ctx, `compas/${vista}/taco`, [u[0] * s, u[1] * s, w[0] * s, w[1] * s, qr[0], qr[1]]);
    P.dibujar(ctx, `compas/${vista}/rueda-ajuste`, [u[0] * s, u[1] * s, w[0] * s, w[1] * s, (ql[0] + qr[0]) / 2, (ql[1] + qr[1]) / 2]);
  }
  // Alzado: las piezas se giran con la abertura y, al empezar a levantarse, se acercan (más anchas) y la cabeza se ve más corta
  dibujarTumbado(ctx, b, k) {
    const a = this.alzado, cab = this.cabezal(), s = cab.s, punta = [0, 0], mina = [this.r, 0], P = PiezasSVG;
    const [ei, ed] = this.ejes(), f = cab.f;
    // Cada pata gira en su tornillo de la cabeza y llega hasta su punta
    const pata = (nombre, t, otra, ej) => {
      const S = [b[0] + ej.x * s, b[1] + ej.y * s * f], p = this.ladoPata(S, t, otra), m = this.largoPata('tumbado', nombre);
      const e = p.L / m.largo, O = [S[0] - p.v[0] * m.eje * e, S[1] - p.v[1] * m.eje * e];
      const d = (P.marca(`compas/tumbado/${nombre}`, 'ajuste') || { y: 24 }).y * e;
      return { mat: [p.n[0] * s, p.n[1] * s, p.v[0] * e, p.v[1] * e, O[0], O[1]], q: [O[0] + p.v[0] * d, O[1] + p.v[1] * d] };
    };
    const pi = pata('pata-aguja', punta, mina, ei), pd = pata('pata-mina', mina, punta, ed);
    ctx.save();
    this.sombra(ctx, a);
    P.dibujar(ctx, 'compas/tumbado/pata-aguja', pi.mat);
    P.dibujar(ctx, 'compas/tumbado/pata-mina', pd.mat, { colorMina: Paleta.lapizActual(), minaLevantada: this.levantada });
    ctx.restore();
    this.dibujarAjuste(ctx, 'tumbado', pi.q, pd.q, s);
    // Mango: de la cabeza al asa (se estira hasta la marca «asa» de su pieza)
    if (k[1] < cab.arriba - 1) {
      const alto = -(P.marca('compas/tumbado/mango', 'asa') || { y: -8 }).y || 8;
      P.dibujar(ctx, 'compas/tumbado/mango', [s, 0, 0, (cab.arriba - k[1]) / alto, k[0], cab.arriba]);
    }
    ctx.save();
    this.sombra(ctx, a, -2);
    P.dibujar(ctx, 'compas/tumbado/cabeza', [s, 0, 0, s * cab.f, b[0], b[1]]);
    ctx.restore();
  }
  // Planta: visto desde arriba, las patas quedan en la línea de las puntas, tan cortas como abierto esté el compás
  dibujarDePie(ctx, b) {
    const P = PiezasSVG, punta = [0, 0], mina = [this.r, 0];
    const pata = (t, nombre) => {
      // Desde arriba, cada pata va de su tornillo (a un lado del centro) a la punta
      const L0 = Math.hypot(t[0] - b[0], t[1] - b[1]) || 1e-6, v = [(t[0] - b[0]) / L0, (t[1] - b[1]) / L0];
      const m = this.largoPata('de-pie', nombre), S = [b[0] + v[0] * m.eje, b[1] + v[1] * m.eje];
      const e = Math.max(1e-6, L0 - m.eje) / m.largo, O = [S[0] - v[0] * m.eje * e, S[1] - v[1] * m.eje * e];
      const d = (P.marca(`compas/de-pie/${nombre}`, 'ajuste') || { y: 8 }).y * e;
      // El +x de la pieza va hacia arriba en la pantalla (el lado de la cabeza cuando estaba tumbado)
      return { mat: [0, -1, v[0] * e, v[1] * e, O[0], O[1]], q: [O[0] + v[0] * d, O[1] + v[1] * d] };
    };
    const pi = pata(punta, 'pata-aguja'), pd = pata(mina, 'pata-mina');
    ctx.save();
    this.sombra(ctx, 1);
    P.dibujar(ctx, 'compas/de-pie/pata-aguja', pi.mat);
    P.dibujar(ctx, 'compas/de-pie/pata-mina', pd.mat, { colorMina: Paleta.lapizActual(), minaLevantada: this.levantada });
    ctx.restore();
    this.dibujarAjuste(ctx, 'de-pie', pi.q, pd.q, 1);
    ctx.save();
    this.sombra(ctx, 1, 4);
    P.dibujar(ctx, 'compas/de-pie/cabeza', [1, 0, 0, 1, b[0], b[1]]);
    ctx.restore();
  }
}

// Transportador: semicírculo con el centro en el canto de la base; 0° a la derecha, en sentido antihorario
class Transportador extends Instrumento {
  constructor() {
    super('transportador', 'Transportador', 'o');
    this.medir();
    this.ayuda = 'Transportador: pon el centro sobre el vértice, gira con las asas hasta que la línea de 0°-180° pase por la recta y, con el portaminas, toca el borde para marcar el ángulo.';
  }
  // Semicírculo; el centro está en el canto recto (la línea de 0°-180°)
  medir() {
    const cm = this.cm = Config.get('tamTransportador') || 13;
    const Ro = this.Ro = cm * 5, k = this.k = Ro / 65;
    const ri = this.ri = Ro - 23;                // radio del hueco: justo dentro de la escala interior
    const pt = (r, g) => [r * Math.cos(g * Math.PI / 180), -r * Math.sin(g * Math.PI / 180)];
    const arco = (r, a0, a1, paso) => {
      const v = [];
      for (let g = a0; g <= a1 + 1e-9; g += paso) v.push(pt(r, g));
      return v;
    };
    this.poligono = arco(Ro, 0, 180, 2);                 // de (Ro, 0) a (−Ro, 0); se cierra por la base
    // Hueco en forma de «D»: arco cerrado por una cuerda horizontal por encima del centro
    const hc = this.hc = 17 * k, g0 = Math.asin(hc / ri) * 180 / Math.PI;
    this.agujero = arco(ri, g0, 180 - g0, 3);
    this.agujero.push(pt(ri, 180 - g0));          // último punto exacto; el polígono se cierra por la cuerda
    // Canto recto de 0°-180°: pasa por el centro, sirve para alinear y para trazar
    this.cantos = [{ i: this.poligono.length - 1, j: 0 }];
    // Asas junto al borde del hueco, por debajo de la cuerda, sin tapar la escala interior
    const ra = ri + 1, ga = Math.min(13, g0 * 0.45);
    this.asas = [{ x: pt(ra, ga)[0], y: pt(ra, ga)[1], pivote: [0, 0] }, { x: pt(ra, 180 - ga)[0], y: pt(ra, 180 - ga)[1], pivote: [0, 0] }];
    this.candado = [0, -hc * 0.68];
    this.origenIman = [0, 0];
    this.rotulos = [
      { x: -Ro * 0.27, y: -hc * 0.42, texto: 'DibuTec', tam: 4 * k, marca: true },
      { x: Ro * 0.29, y: -hc * 0.42, texto: `– ${cm} cm –`, tam: 2.8 * k },
    ];
  }
  centroLocal() { return [0, -this.Ro * 0.42]; }
  zonaLapiz(info) {
    const p = this.aLocal(info.x, info.y), r = Math.hypot(p.x, p.y);
    const banda = Instrumentos.bandaPx(info.tipo) / Vista.escala;
    if (r < this.Ro - 14 || r > this.Ro + banda || p.y > banda * 0.5) return null;
    const g = Math.round(Geom.clamp(Math.atan2(-p.y, p.x), 0, Math.PI) * 180 / Math.PI);
    const t = g * Math.PI / 180;
    const w = this.aMundo(this.Ro * Math.cos(t), -this.Ro * Math.sin(t));
    return { x: w.x, y: w.y, grados: g };
  }
  dibujarMarcas(ctx) {
    const Ro = this.Ro, px = 1 / Vista.escala;
    const verGrado = Ro * Math.PI / 180 * Vista.escala >= 2.5;
    const pt = (r, g) => [r * Math.cos(g * Math.PI / 180), -r * Math.sin(g * Math.PI / 180)];
    const e = Paleta.instrumento();
    ctx.strokeStyle = e.tinta;
    ctx.lineWidth = Math.max(0.12, 0.8 * px);
    ctx.beginPath();
    for (let g = 0; g <= 180; g++) {
      const diez = g % 10 === 0, cinco = g % 5 === 0;
      if (!cinco && !verGrado) continue;
      const l = diez ? 6 : cinco ? 4 : 2.2;
      const a = pt(Ro, g), b = pt(Ro - l, g);
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
      if (diez) { const c = pt(Ro - 18.5, g), d = pt(Ro - 20.5, g); ctx.moveTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); }
    }
    // Trazo de 90° bajo el hueco y línea vertical que baja al centro
    ctx.moveTo(0, -this.hc); ctx.lineTo(0, -this.hc + 2.5);
    ctx.moveTo(0, -4.5); ctx.lineTo(0, 0);
    ctx.stroke();
    ctx.fillStyle = e.tinta;
    // Flechas junto al canto, en los extremos, y dos flechas que apuntan al centro
    const L = Ro - 1.5;
    for (const sg of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sg * L, -0.3); ctx.lineTo(sg * (L - 3.2), -0.3); ctx.lineTo(sg * (L - 3.2), -1.6);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(sg * 0.6, -0.6); ctx.lineTo(sg * 3.2, -2.2); ctx.lineTo(sg * 2.2, -3.2);
      ctx.closePath(); ctx.fill();
    }
    // Flechas en el borde del hueco a 45°, 90° y 135°
    for (const g of [45, 90, 135]) {
      const a = pt(this.ri + 0.4, g), b = pt(this.ri + 3.4, g), m = g * Math.PI / 180;
      const nx = Math.sin(m) * 1.1, ny = Math.cos(m) * 1.1;
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0] + nx, b[1] + ny); ctx.lineTo(b[0] - nx, b[1] - ny);
      ctx.closePath(); ctx.fill();
    }
    // Números: escala exterior (oscura) e interior (roja, al revés)
    const fuente = getComputedStyle(document.body).fontFamily;
    const numero = (texto, r, g, tam, color) => {
      const p = pt(r, g);
      ctx.save();
      ctx.translate(p[0], p[1]);
      ctx.rotate(Math.PI / 2 - g * Math.PI / 180);
      ctx.fillStyle = color;
      ctx.font = `600 ${tam}px ${fuente}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(texto, 0, 0);
      ctx.restore();
    };
    const paso = Ro * Math.PI / 18 * Vista.escala < 18 ? 30 : 10;
    const kn = Math.min(1, Ro / 65);   // números algo más pequeños en el transportador pequeño
    for (let g = 0; g <= 180; g += paso) {
      if (g === 90) {
        numero('90', Ro - 10.5, 90, 4.6, e.tinta);   // el 90, más grande, como en la referencia
        continue;
      }
      // El 0 y el 180 se suben lo justo (según el ancho del número) para no pisar la línea base
      const pos = (texto, r, tam) => {
        if (g !== 0 && g !== 180) return g;
        ctx.font = `600 ${tam}px ${fuente}`;
        const m = Math.asin((ctx.measureText(texto).width / 2 + 0.4) / r) * 180 / Math.PI;
        return g === 0 ? m : 180 - m;
      };
      const t1 = 3.2 * kn, t2 = 2.6 * kn;
      numero(String(g), Ro - 9.5, pos(String(g), Ro - 9.5, t1), t1, e.tinta);
      numero(String(180 - g), Ro - 15, pos(String(180 - g), Ro - 15, t2), t2, e.inversa || e.tinta);
    }
    this.dibujarRotulos(ctx);
  }
}

const Instrumentos = {
  lista: [],          // de abajo arriba
  porTipo: {},

  registrar(inst) { this.lista.push(inst); this.porTipo[inst.tipo] = inst; },
  visibles() { return this.lista.filter(i => i.visible); },
  deArribaAbajo() { return this.visibles().reverse(); },
  alFrente(inst) {
    const i = this.lista.indexOf(inst);
    if (i >= 0) { this.lista.splice(i, 1); this.lista.push(inst); }
  },

  alternar(tipo) {
    const inst = this.porTipo[tipo];
    if (!inst) return false;
    inst.visible = !inst.visible;
    if (inst.visible) {
      if (!inst.colocado) this.colocarEnVista(inst);
      this.alFrente(inst);
      if (inst.ayuda) UI.mensaje(inst.ayuda); else UI.mensaje(`${inst.nombre}: arrastra el cuerpo para mover${inst.g === 'a' ? 'la' : 'lo'}, usa las asas redondas para girar${inst.g === 'a' ? 'la' : 'lo'} y el candado para fijar${inst.g === 'a' ? 'la' : 'lo'}.`);
    } else {
      if (Manip.estado && Manip.estado.inst === inst) Manip.fin(false);
      UI.mensaje(`${inst.nombre} guardad${inst.g}.`);
    }
    UI.marcarInstrumentos();
    Render.pedir('instrumentos');
    return true;
  },
  colocarEnVista(inst) {
    const c = Vista.aMundo(Capas.w / 2, Capas.h / 2);
    const cx = Geom.clamp(c.x, 0, Hoja.ancho), cy = Geom.clamp(c.y, 0, Hoja.alto);
    const cl = inst.centroLocal();
    inst.rot = 0;
    inst.x = cx - cl[0]; inst.y = cy - cl[1];
    inst.colocado = true;
  },

  // Aplica los tamaños de la configuración a todos los instrumentos
  medir() {
    if (Manip.estado) Manip.fin(false);
    for (const inst of this.lista) inst.medir();
    Render.pedir('instrumentos');
  },

  bandaPx(tipo) { return tipo === 'touch' ? 22 : 12; },

  // Borde graduado del transportador bajo el puntero (marca el grado exacto)
  zonaMarcado(info) {
    for (const inst of this.deArribaAbajo()) {
      if (inst.zonaLapiz) {
        const z = inst.zonaLapiz(info);
        if (z) return Object.assign(z, { inst });
      }
      if (inst.contiene(info.x, info.y)) return null;
    }
    return null;
  },

  // Canto más cercano al puntero (para trazar con el portaminas)
  cantoCercano(info, excluir) {
    const banda = this.bandaPx(info.tipo) / Vista.escala;
    let mejor = null;
    for (const inst of this.deArribaAbajo()) {
      if (inst === excluir) continue;
      for (const k of inst.cantosMundo()) {
        const d = Geom.distSegmento(info.x, info.y, k.a.x, k.a.y, k.b.x, k.b.y);
        if (d <= banda && (!mejor || d < mejor.d)) mejor = Object.assign(k, { d });
      }
      if (mejor) return mejor;                         // el instrumento de arriba tapa a los de abajo
      if (inst.contiene(info.x, info.y)) return null;
    }
    return mejor;
  },

  // Candado, asa o cuerpo bajo el puntero. conCantos = deja libre la franja de los cantos (portaminas)
  tocar(info, conCantos) {
    const extra = (info.tipo === 'touch' ? 8 : 2) / Vista.escala;
    for (const inst of this.deArribaAbajo()) {
      if (inst.tocarPropio) {
        const h = inst.tocarPropio(info, extra);
        if (h) return h;
        continue;
      }
      if (inst.candado) {
        const w = inst.aMundo(...inst.candado);
        if (Geom.dist(info.x, info.y, w.x, w.y) <= inst.radioCandado() + extra) return { inst, modo: 'candado' };
      }
      if (inst.volteo && !inst.bloqueado) {
        const w = inst.aMundo(...inst.volteo);
        if (Geom.dist(info.x, info.y, w.x, w.y) <= inst.radioCandado() + extra) return { inst, modo: 'voltear' };
      }
      if (!inst.bloqueado) {
        for (const a of inst.asas) {
          const w = inst.aMundo(a.x, a.y);
          if (Geom.dist(info.x, info.y, w.x, w.y) <= inst.radioAsa() + extra) return { inst, modo: 'girar', asa: a };
        }
      }
      if (inst.contiene(info.x, info.y)) {
        if (inst.bloqueado) return null;               // fijo: no se mueve y tapa a los de abajo
        if (conCantos) {
          if (inst.zonaLapiz && inst.zonaLapiz(info)) return null;
          const banda = this.bandaPx(info.tipo) / Vista.escala;
          for (const k of inst.cantosMundo())
            if (Geom.distSegmento(info.x, info.y, k.a.x, k.a.y, k.b.x, k.b.y) <= banda) return null;
        }
        return { inst, modo: 'mover' };
      }
    }
    return null;
  },

  // Punto sobre un canto, con imán a puntos cercanos y a las marcas de milímetro
  puntoEnCanto(k, info) {
    const proy = (x, y) => {
      const t = Geom.clamp((x - k.a.x) * k.u.x + (y - k.a.y) * k.u.y, 0, k.len);
      return { x: k.a.x + k.u.x * t, y: k.a.y + k.u.y * t };
    };
    let p = proy(info.x, info.y);
    let snap = null;
    const radio = Snap.radioPx(info.tipo) / Vista.escala;
    const s = Snap.buscar(p.x, p.y, info.tipo);
    if (s && s.tipo === 'sobre' && Config.get('imanCruces')) {
      // Una línea que cruza el canto: se para justo en el cruce
      const canto = { tipo: 'recta', o: { x1: k.a.x, y1: k.a.y, x2: k.b.x, y2: k.b.y } };
      let mejor = null;
      for (const q of Geom.intersecciones(canto, { tipo: s.elTipo, o: s.obj })) {
        const d = Geom.dist(q.x, q.y, p.x, p.y);
        if (d <= radio && (!mejor || d < mejor.d)) mejor = { x: q.x, y: q.y, d };
      }
      if (mejor) { p = { x: mejor.x, y: mejor.y }; snap = { tipo: 'cruce', x: p.x, y: p.y }; }
    } else if (s) {
      const q = proy(s.x, s.y);
      if (Geom.dist(q.x, q.y, s.x, s.y) <= radio) { p = q; snap = s; }
    }
    let mm = null;
    if (k.graduado && k.origen) {
      mm = (p.x - k.origen.x) * k.u.x + (p.y - k.origen.y) * k.u.y;
      const r = Math.round(mm);
      if (!snap && Config.get('imanMarcas') && Math.abs(mm - r) * Vista.escala <= (info.tipo === 'touch' ? 6 : 4) && r >= 0 && r <= k.def.max) {
        p = { x: k.origen.x + k.u.x * r, y: k.origen.y + k.u.y * r };
        mm = r;
        snap = { tipo: 'marca', x: p.x, y: p.y };
      }
      if (mm < -0.05 || mm > k.def.max + 0.05) mm = null;
    }
    return { x: p.x, y: p.y, snap, mm };
  },

  // Imán al mover: el 0 a un punto, o un canto que pase por un punto
  imanMover(inst, tipo) {
    if (!Config.get('imanInstrumentos')) return null;
    const radio = Snap.radioPx(tipo) / Vista.escala;
    const objetivos = Escena.objetivos();
    if (inst.origenIman) {
      const o = inst.aMundo(...inst.origenIman);
      let mejor = null;
      for (const p of objetivos) {
        const d = Geom.dist(o.x, o.y, p.x, p.y);
        if (d <= radio && (!mejor || d < mejor.d)) mejor = { p, d };
      }
      if (mejor) {
        inst.x += mejor.p.x - o.x; inst.y += mejor.p.y - o.y;
        return { x: mejor.p.x, y: mejor.p.y };
      }
    }
    let mejor = null;
    for (const k of inst.cantosApoyo()) {
      for (const p of objetivos) {
        const t = (p.x - k.a.x) * k.u.x + (p.y - k.a.y) * k.u.y;
        if (t < 0 || t > k.len) continue;
        const d = (p.x - k.a.x) * k.n.x + (p.y - k.a.y) * k.n.y;
        if (Math.abs(d) <= radio && (!mejor || Math.abs(d) < Math.abs(mejor.d))) mejor = { p, d, k };
      }
    }
    if (mejor) {
      inst.x += mejor.k.n.x * mejor.d; inst.y += mejor.k.n.y * mejor.d;
      return { x: mejor.p.x, y: mejor.p.y };
    }
    return null;
  },

  // Punto marcado apoyado en un canto (el más alejado del asa): será el centro del giro
  pivoteEnPunto(inst, asa) {
    const tol = Math.max(0.3, 4 / Vista.escala);
    const am = inst.aMundo(asa.x, asa.y);
    let mejor = null;
    for (const k of inst.cantosMundo()) {
      for (const p of Escena.puntos) {
        const t = (p.x - k.a.x) * k.u.x + (p.y - k.a.y) * k.u.y;
        if (t < -tol || t > k.len + tol) continue;
        const d = (p.x - k.a.x) * k.n.x + (p.y - k.a.y) * k.n.y;
        if (Math.abs(d) > tol) continue;
        const lejos = Geom.dist(p.x, p.y, am.x, am.y);
        if (!mejor || lejos > mejor.lejos) mejor = { p, d, k, lejos };
      }
    }
    if (!mejor) return null;
    // Ajuste fino: el canto pasa exactamente por el punto
    inst.x += mejor.k.n.x * mejor.d; inst.y += mejor.k.n.y * mejor.d;
    const l = inst.aLocal(mejor.p.x, mejor.p.y);
    return { punto: mejor.p, mundo: { x: mejor.p.x, y: mejor.p.y }, local: [l.x, l.y] };
  },

  // Imán al girar: el canto que pasa por el pivote se alinea con otro punto
  imanGirar(inst, pivLocal, piv, tipo) {
    if (!Config.get('imanInstrumentos')) return null;
    const radio = Snap.radioPx(tipo) / Vista.escala;
    let mejor = null;
    for (const k of inst.cantosApoyo()) {
      const dp = (piv.x - k.a.x) * k.n.x + (piv.y - k.a.y) * k.n.y;
      if (Math.abs(dp) > 1e-6) continue;           // el pivote no está sobre este canto
      for (const p of Escena.objetivos()) {
        const vx = p.x - piv.x, vy = p.y - piv.y, dist = Math.hypot(vx, vy);
        if (dist < 3) continue;
        const along = vx * k.u.x + vy * k.u.y;
        // Vale cualquier punto de la prolongación del canto (alinear con una recta)
        const perp = k.u.x * vy - k.u.y * vx;
        // Tolerancia: el radio del imán o 2° de giro, lo que sea mayor (puntos lejanos)
        if (Math.abs(perp) > Math.max(radio, dist * Math.tan(2 * Math.PI / 180))) continue;
        const w = along >= 0 ? k.u : { x: -k.u.x, y: -k.u.y };
        const delta = Math.atan2(w.x * vy - w.y * vx, w.x * vx + w.y * vy);
        if (!mejor || Math.abs(perp) < Math.abs(mejor.perp)) mejor = { delta, perp, p };
      }
    }
    if (!mejor) return null;
    inst.rot += mejor.delta;
    inst.colocarPivote(pivLocal, piv);
    return { x: mejor.p.x, y: mejor.p.y };
  },

  // ---------- Deslizamiento ----------
  // Busca un canto de «inst» casi apoyado (paralelo y muy cerca) en un canto de otro instrumento
  buscarContacto(inst) {
    const umbralAng = 3 * Math.PI / 180;
    const umbralD = Math.max(2, 8 / Vista.escala);
    const cm = inst.centroMundo();
    let mejor = null;
    for (const otro of this.visibles()) {
      if (otro === inst) continue;
      const co = otro.centroMundo();
      for (const g of otro.cantosMundo()) {
        // Normal del canto guía hacia fuera de su instrumento
        let n = g.n;
        if ((co.x - g.a.x) * n.x + (co.y - g.a.y) * n.y > 0) n = { x: -n.x, y: -n.y };
        // El instrumento que se mueve tiene que estar al otro lado (apoyado, no encima)
        if ((cm.x - g.a.x) * n.x + (cm.y - g.a.y) * n.y <= 0) continue;
        for (const k of inst.cantosMundo()) {
          const cruz = g.u.x * k.u.y - g.u.y * k.u.x, punto = g.u.x * k.u.x + g.u.y * k.u.y;
          const ang = Math.atan2(Math.abs(cruz), Math.abs(punto));
          if (ang > umbralAng) continue;
          const da = (k.a.x - g.a.x) * n.x + (k.a.y - g.a.y) * n.y;
          const db = (k.b.x - g.a.x) * n.x + (k.b.y - g.a.y) * n.y;
          // Se tocan por el extremo más cercano (o se cruzan)
          const dm = da * db <= 0 ? 0 : Math.min(Math.abs(da), Math.abs(db));
          if (Math.abs(dm) > umbralD) continue;
          const ta = (k.a.x - g.a.x) * g.u.x + (k.a.y - g.a.y) * g.u.y;
          const tb = (k.b.x - g.a.x) * g.u.x + (k.b.y - g.a.y) * g.u.y;
          const solape = Math.min(g.len, Math.max(ta, tb)) - Math.max(0, Math.min(ta, tb));
          if (solape < 2) continue;
          const nota = Math.abs(dm) + ang * 30;
          if (!mejor || nota < mejor.nota) mejor = { otro, g, n, kdef: k.def, nota };
        }
      }
    }
    return mejor;
  },
  // Apoya el canto kdef de inst sobre el canto guía (gira alrededor de «p» y lo pega a la línea)
  apoyar(inst, c, p) {
    const k = inst.cantosMundo().find(q => q.def === c.kdef);
    let d = Math.atan2(k.u.x * c.g.u.y - k.u.y * c.g.u.x, k.u.x * c.g.u.x + k.u.y * c.g.u.y);
    if (d > Math.PI / 2) d -= Math.PI; else if (d < -Math.PI / 2) d += Math.PI;
    inst.girarEn(p, d);
    const k2 = inst.cantosMundo().find(q => q.def === c.kdef);
    const dist = (k2.a.x - c.g.a.x) * c.n.x + (k2.a.y - c.g.a.y) * c.n.y;
    inst.x -= c.n.x * dist; inst.y -= c.n.y * dist;
  },
  // ¿Sigue habiendo solape entre los cantos en contacto?
  haySolape(inst, c) {
    const k = inst.cantosMundo().find(q => q.def === c.kdef);
    const ta = (k.a.x - c.g.a.x) * c.g.u.x + (k.a.y - c.g.a.y) * c.g.u.y;
    const tb = (k.b.x - c.g.a.x) * c.g.u.x + (k.b.y - c.g.a.y) * c.g.u.y;
    return Math.min(c.g.len, Math.max(ta, tb)) - Math.max(0, Math.min(ta, tb)) > 1;
  },
  // Imán al deslizar: otro canto del instrumento pasa por un punto
  imanDeslizar(inst, c, tipo) {
    if (!Config.get('imanInstrumentos')) return null;
    const radio = Snap.radioPx(tipo) / Vista.escala;
    let mejor = null;
    for (const k of inst.cantosMundo()) {
      if (k.def === c.kdef) continue;
      const dn = c.g.u.x * k.n.x + c.g.u.y * k.n.y;
      if (Math.abs(dn) < 0.3) continue;
      for (const p of Escena.objetivos()) {
        const t = (p.x - k.a.x) * k.u.x + (p.y - k.a.y) * k.u.y;
        if (t < -radio || t > k.len + radio) continue;
        const d = (p.x - k.a.x) * k.n.x + (p.y - k.a.y) * k.n.y;
        if (Math.abs(d) <= radio && (!mejor || Math.abs(d) < Math.abs(mejor.d))) mejor = { p, d, dn };
      }
    }
    if (!mejor) return null;
    const s = mejor.d / mejor.dn;
    inst.x += c.g.u.x * s; inst.y += c.g.u.y * s;
    return { x: mejor.p.x, y: mejor.p.y };
  },
};

/* Manipulación de instrumentos: mover, deslizar, girar y dos dedos */
const Manip = {
  estado: null,
  halo: null,

  usa(id) {
    const e = this.estado;
    return !!e && (e.id === id || (e.modo === 'dos' && e.ids.includes(id)));
  },
  iniciar(hit, info) {
    const inst = hit.inst;
    Instrumentos.alFrente(inst);
    if (hit.modo === 'girar') {
      // Si hay un punto marcado sobre un canto, se gira alrededor de él
      const enPunto = inst.giraEnPuntos ? Instrumentos.pivoteEnPunto(inst, hit.asa) : null;
      const pv = enPunto ? enPunto.local : hit.asa.pivote, piv = enPunto ? enPunto.mundo : inst.aMundo(pv[0], pv[1]);
      this.estado = { inst, modo: 'girar', id: info.id, tipo: info.tipo, pivLocal: pv, piv, punto: enPunto && enPunto.punto,
                      ang0: Math.atan2(info.y - piv.y, info.x - piv.x), rot0: inst.rot };
      if (enPunto) UI.mensaje(`Girando alrededor del punto ${enPunto.punto.etiqueta}: busca la línea con otro punto.`);
    } else if (hit.modo === 'abrir') {
      this.estado = { inst, modo: 'abrir', id: info.id, tipo: info.tipo };
    } else if (hit.modo === 'trazar') {
      // El compás se pone de pie. La mina no se apoya sola: levantada, gira sin pintar para buscar dónde empezar
      inst.animarAlzado(1);
      // tramos: arcos ya pintados en este giro; tramo: el que se está pintando ahora
      this.estado = { inst, modo: 'trazar', id: info.id, tipo: info.tipo, tramos: [], tramo: null,
                      angPrev: Math.atan2(info.y - inst.y, info.x - inst.x) };
    } else {
      this.estado = { inst, modo: 'mover', id: info.id, tipo: info.tipo, dx: inst.x - info.x, dy: inst.y - info.y, guia: null };
    }
    this.estado.antes = Escena.datos();   // para poder deshacer el movimiento
    Capas.contenedor.classList.add('arrastrando');
    Render.pedir('instrumentos');
  },
  // Segundo dedo mientras se arrastra un instrumento: mover + girar
  dosDedos(toques) {
    const e = this.estado;
    if (!e || e.modo !== 'mover') return false;
    const [a, b] = toques;
    this.estado = { inst: e.inst, modo: 'dos', tipo: 'touch', antes: e.antes, ids: [a.id, b.id], pos: { [a.id]: Vista.aMundo(a.x, a.y), [b.id]: Vista.aMundo(b.x, b.y) } };
    return true;
  },
  mover(info, e) {
    const s = this.estado;
    if (!s) return;
    const inst = s.inst;
    this.halo = null;
    if (s.modo === 'mover') this.moverCuerpo(s, info, e);
    else if (s.modo === 'abrir') this.abrirCompas(s, info);
    else if (s.modo === 'trazar') this.girarCompas(s, info, e);
    else if (s.modo === 'girar') {
      const ang = Math.atan2(info.y - s.piv.y, info.x - s.piv.x);
      inst.rot = s.rot0 + ang - s.ang0;
      if (e && e.shiftKey) {
        const paso = Math.PI / 12;
        inst.rot = Math.round(inst.rot / paso) * paso;
        inst.colocarPivote(s.pivLocal, s.piv);
      } else {
        inst.colocarPivote(s.pivLocal, s.piv);
        this.halo = Instrumentos.imanGirar(inst, s.pivLocal, s.piv, s.tipo);
      }
      UI.mensaje(`${s.punto ? `Girando alrededor de ${s.punto.etiqueta} · ` : ''}Ángulo: ${this.anguloTexto(inst)}`);
    } else if (s.modo === 'dos') {
      const ids = s.ids, viejo = { a: s.pos[ids[0]], b: s.pos[ids[1]] };
      const nuevo = Object.assign({}, s.pos, { [info.id]: { x: info.x, y: info.y } });
      const a = nuevo[ids[0]], b = nuevo[ids[1]];
      const m0 = { x: (viejo.a.x + viejo.b.x) / 2, y: (viejo.a.y + viejo.b.y) / 2 };
      const m1 = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      const d = Math.atan2(b.y - a.y, b.x - a.x) - Math.atan2(viejo.b.y - viejo.a.y, viejo.b.x - viejo.a.x);
      inst.girarEn(m0, d);
      inst.x += m1.x - m0.x; inst.y += m1.y - m0.y;
      s.pos = nuevo;
      UI.mensaje(`Ángulo: ${this.anguloTexto(inst)}`);
    }
    Render.pedir('instrumentos');
  },
  moverCuerpo(s, info, e) {
    const inst = s.inst;
    const libreX = info.x + s.dx, libreY = info.y + s.dy;
    const c = s.guia;
    if (c) {
      // Deslizando: solo se mueve a lo largo del canto guía
      const vx = libreX - c.ancla.x, vy = libreY - c.ancla.y;
      const desvio = vx * c.n.x + vy * c.n.y;
      const soltar = Math.max(8, 30 / Vista.escala);
      if (Math.abs(desvio) > soltar || (e && e.altKey)) {
        s.guia = null;
        UI.mensaje(`${inst.nombre} separad${inst.g}.`);
      } else {
        const t = vx * c.g.u.x + vy * c.g.u.y;
        const antes = { x: inst.x, y: inst.y };
        inst.x = c.ancla.x + c.g.u.x * t; inst.y = c.ancla.y + c.g.u.y * t;
        if (!Instrumentos.haySolape(inst, c)) {
          inst.x = antes.x; inst.y = antes.y;          // al final del canto guía se detiene
        } else {
          this.halo = Instrumentos.imanDeslizar(inst, c, s.tipo);
        }
        return;
      }
    }
    inst.x = libreX; inst.y = libreY;
    if (!(e && e.altKey)) {
      const contacto = Instrumentos.buscarContacto(inst);
      if (contacto) {
        Instrumentos.apoyar(inst, contacto, { x: info.x, y: info.y });
        s.dx = inst.x - info.x; s.dy = inst.y - info.y;
        s.guia = Object.assign(contacto, { ancla: { x: inst.x, y: inst.y } });
        Sonido.tocar('iman');
        UI.mensaje(`${inst.nombre} apoyad${inst.g} en ${contacto.otro.conArticulo}: ahora se desliza a lo largo del canto. Aléjal${inst.g} para separar${inst.g === 'a' ? 'la' : 'lo'}.`);
        return;
      }
    }
    this.halo = Instrumentos.imanMover(inst, s.tipo);
    // La punta seca del compás también se pega a las marcas de una regla o escuadra
    if (!this.halo && inst.tocarPropio) {
      const k = Instrumentos.cantoCercano({ x: inst.x, y: inst.y, tipo: s.tipo }, inst);
      if (k) {
        const q = Instrumentos.puntoEnCanto(k, { x: inst.x, y: inst.y, tipo: s.tipo });
        if (q.snap) { inst.x = q.x; inst.y = q.y; this.halo = { x: q.x, y: q.y }; }
      }
    }
  },
  // Ángulo del canto principal respecto a la horizontal (sentido antihorario)
  anguloTexto(inst) {
    let g = -inst.rot * 180 / Math.PI;
    g = ((g % 360) + 360) % 360;
    const r = Math.round(g * 10) / 10;
    return (Number.isInteger(r) ? String(r) : r.toFixed(1).replace('.', ',')) + '°';
  },
  // Compás: la mina sigue al puntero (la punta seca no se mueve)
  abrirCompas(s, info) {
    const inst = s.inst, c = { x: inst.x, y: inst.y };
    let obj = { x: info.x, y: info.y }, halo = null;
    let sn = Snap.buscar(info.x, info.y, s.tipo);
    if (sn && Geom.dist(sn.x, sn.y, c.x, c.y) <= 0.5) sn = null;
    // Prioridad: puntos, extremos, cruces y centros; luego medidas en un instrumento; luego el trazo de una línea
    if (sn && sn.prio <= 3) { obj = sn; halo = sn; }
    else {
      const k = Instrumentos.cantoCercano(info, inst);
      const q = k && Instrumentos.puntoEnCanto(k, info);
      if (q && q.snap) { obj = q; halo = q; }
      else if (sn) { obj = sn; halo = sn; }
    }
    let r = Geom.dist(obj.x, obj.y, c.x, c.y);
    if (!halo && Config.get('imanMarcas')) { const rr = Math.round(r); if (Math.abs(r - rr) * Vista.escala <= 3) r = rr; }
    if (r < 0.5) return;
    inst.r = inst.limitarRadio(r);
    inst.rot = Math.atan2(obj.y - c.y, obj.x - c.x);
    this.halo = halo && inst.r === r ? { x: halo.x, y: halo.y } : null;
    UI.mensaje(`Radio: ${Lapiz.mmTexto(inst.r)}${inst.r < r ? ' (el compás no se abre más)' : inst.r > r ? ' (el compás no se cierra más)' : ''}`);
  },
  // Compás: gira alrededor de la punta seca. Con la mina apoyada va dejando el arco;
  // levantada (botón de la mina, tecla L o Alt mantenido) solo gira. Se puede cambiar a mitad del giro.
  girarCompas(s, info, e) {
    const inst = s.inst, c = { x: inst.x, y: inst.y };
    const ang = Math.atan2(info.y - c.y, info.x - c.x);
    let d = ang - s.angPrev;
    if (d > Math.PI) d -= Geom.DOS_PI; else if (d < -Math.PI) d += Geom.DOS_PI;
    s.angPrev = ang;
    this.halo = null;
    const levantada = inst.levantada || !!(e && e.altKey);
    if (levantada) {
      this.cerrarTramo(s);
      inst.rot += d;
      UI.mensaje('Mina levantada: el compás gira sin pintar. Apóyala con su botón (o la tecla L) donde quieras empezar.');
      return;
    }
    if (!s.tramo) s.tramo = { a0: inst.rot, libre: 0, barrido: 0 };
    const t = s.tramo;
    t.libre += d;
    let b = Geom.clamp(t.libre, -Geom.DOS_PI, Geom.DOS_PI);
    if (Math.abs(b) >= Geom.DOS_PI - 4 * Math.PI / 180) b = Math.sign(b) * Geom.DOS_PI;
    else {
      // Imán: terminar el arco justo en un punto de la circunferencia
      const radio = Snap.radioPx(s.tipo) / Vista.escala, fin = t.a0 + b;
      let mejor = null;
      for (const p of Escena.objetivos()) {
        if (Math.abs(Geom.dist(p.x, p.y, c.x, c.y) - inst.r) > radio) continue;
        let df = Math.atan2(p.y - c.y, p.x - c.x) - fin;
        df = Math.atan2(Math.sin(df), Math.cos(df));
        if (Math.abs(df) * inst.r <= radio && (!mejor || Math.abs(df) < Math.abs(mejor.df))) mejor = { p, df };
      }
      if (mejor && Math.abs(b + mejor.df) < Geom.DOS_PI) { b += mejor.df; this.halo = { x: mejor.p.x, y: mejor.p.y }; }
    }
    t.barrido = b;
    inst.rot = t.a0 + b;
    UI.mensaje(Math.abs(b) >= Geom.DOS_PI ? 'Circunferencia completa.' : `Arco: ${Math.round(Math.abs(b) * 180 / Math.PI)}°`);
  },
  // Guarda el tramo que se estaba pintando (al levantar la mina o al soltar)
  cerrarTramo(s) {
    if (s.tramo && Math.abs(s.tramo.barrido) > Math.PI / 180) s.tramos.push(s.tramo);
    s.tramo = null;
  },
  fin(confirmar = true) {
    const s = this.estado;
    if (s && s.modo === 'trazar' && confirmar) {
      this.cerrarTramo(s);
      const inst = s.inst;
      const arcos = s.tramos.flatMap(t => Zona.arco(inst.x, inst.y, inst.r, t.a0, t.a0 + t.barrido).map(([a0, a1]) => Escena.agregarArco(inst.x, inst.y, inst.r, a0, a1)));
      if (s.tramos.length && !arcos.length) UI.mensaje(Zona.aviso());
      if (arcos.length) {
        Sonido.tocar('punto');
        const a = arcos[arcos.length - 1];
        // Al terminar, la mina se levanta sola; para volver a pintar hay que apoyarla (botón de la mina, L o Alt)
        inst.levantada = true;
        UI.mensaje((arcos.length > 1 ? `${arcos.length} arcos trazados (radio ${Lapiz.mmTexto(a.r)}).`
          : Geom.esCircunferencia(a) ? `Circunferencia trazada (radio ${Lapiz.mmTexto(a.r)}).`
          : `Arco trazado: ${Math.round(Math.abs(a.a1 - a.a0) * 180 / Math.PI)}°, radio ${Lapiz.mmTexto(a.r)}.`) + ' La mina se ha levantado: apóyala con su botón (o la tecla L) para volver a pintar.');
      }
    }
    if (s && s.modo === 'trazar') s.inst.animarAlzado(0);   // vuelve a quedar tumbado
    if (s && s.antes && Escena.datos() !== s.antes) Historial.empujar(s.antes);
    this.estado = null;
    this.halo = null;
    Capas.contenedor.classList.remove('arrastrando');
    Render.pedir('instrumentos');
  },
  overlay(ctx) {
    const s = this.estado;
    const px = 1 / Vista.escala;
    if (s && s.modo === 'abrir') {
      // Circunferencia que se trazaría
      const inst = s.inst;
      ctx.save();
      ctx.setLineDash([6 * px, 5 * px]);
      ctx.strokeStyle = 'rgba(47, 111, 208, .55)';
      ctx.lineWidth = 1.2 * px;
      ctx.beginPath(); ctx.arc(inst.x, inst.y, inst.r, 0, Geom.DOS_PI); ctx.stroke();
      ctx.restore();
    }
    if (s && s.modo === 'trazar') {
      const inst = s.inst;
      if (inst.levantada) {
        // Camino de la mina mientras está levantada
        ctx.save();
        ctx.setLineDash([4 * px, 6 * px]);
        ctx.strokeStyle = 'rgba(90, 95, 110, .45)';
        ctx.lineWidth = 1.2 * px;
        ctx.beginPath(); ctx.arc(inst.x, inst.y, inst.r, 0, Geom.DOS_PI); ctx.stroke();
        ctx.restore();
      }
      ctx.save();
      Zona.recortar(ctx);   // fuera de la zona de dibujo no pinta
      ctx.strokeStyle = Paleta.lapizActual();
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = Dibujo.grosor();
      ctx.lineCap = 'round';
      for (const t of s.tramos.concat(s.tramo ? [s.tramo] : []))
        if (t.barrido) Dibujo.trazo(ctx, 'arco', { cx: inst.x, cy: inst.y, r: inst.r, a0: t.a0, a1: t.a0 + t.barrido });
      ctx.restore();
    }
    if (s && s.guia) {
      // Canto de apoyo en verde
      const c = s.guia, px = 1 / Vista.escala;
      ctx.strokeStyle = 'rgba(40, 170, 90, .85)';
      ctx.lineWidth = 4 * px;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(c.g.a.x, c.g.a.y); ctx.lineTo(c.g.b.x, c.g.b.y);
      ctx.stroke();
    }
    if (s && s.modo === 'girar' && s.punto) {
      // Punto alrededor del que se gira
      ctx.beginPath();
      ctx.arc(s.piv.x, s.piv.y, 7 * px, 0, Geom.DOS_PI);
      ctx.fillStyle = 'rgba(47, 111, 208, .9)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(s.piv.x, s.piv.y, 2.5 * px, 0, Geom.DOS_PI);
      ctx.fillStyle = '#fff';
      ctx.fill();
    }
    if (this.halo) Dibujo.halo(ctx, this.halo.x, this.halo.y);
  },
};

  { id: 'cartabon',      nombre: 'Cartabón',       tecla: 'T', icono: 'cartabon',      instrumento: true,   fase: 4 },
  { id: 'compas',        nombre: 'Compás',         tecla: 'C', icono: 'compas',        instrumento: true,   fase: 5 },
  { id: 'transportador', nombre: 'Transportador',  tecla: 'A', icono: 'transportador', instrumento: true,   fase: 6 },
  { id: 'goma',          nombre: 'Goma',           tecla: 'B', icono: 'goma',          cursor: 'precision', fase: 2 },
  { id: 'nombrar',       nombre: 'Nombrar puntos y líneas', tecla: 'N', icono: 'nombrar', cursor: 'precision', fase: 2 },
];

const App = {
  herramienta: 'lapiz',
  // La goma y Nombrar trabajan por debajo de los instrumentos
  debajo() { return this.herramienta === 'goma' || this.herramienta === 'nombrar'; },
  seleccionar(id) {
    const h = Herramientas.find(t => t.id === id);
    if (!h) return;
    // Los instrumentos se muestran u ocultan sin cambiar la herramienta activa
    if (h.instrumento) {
      if (!Instrumentos.alternar(id)) UI.mensaje(`${h.nombre}: llegará en la fase ${h.fase}.`);
      return;
    }
    // Pulsar otra vez la goma (o la tecla B) cambia entre borrar a trozos y borrar enteras
    if (id === 'goma' && this.herramienta === 'goma') { Goma.alternarModo(); return; }
    if (id !== this.herramienta) Acciones.cancelarActual();
    this.herramienta = id;
    UI.marcarHerramienta(id);
    Entrada.actualizarCursor();
    UI.mensaje(this.ayudas[id] || `${h.nombre}: llegará en la fase ${h.fase}. Mientras tanto, puedes marcar puntos y mover la hoja.`);
    Render.pedir('instrumentos');
  },
  ayudas: {
    mover: 'Arrastra para mover la hoja. Usa la rueda o dos dedos para acercar y alejar.',
    lapiz: 'Toca o haz clic para marcar un punto. Mantén pulsado y arrastra para colocarlo con precisión.',
    goma: 'Goma: elige abajo si borra a trozos o líneas enteras y su tamaño. Pulsa otra vez la goma (o B) para cambiar de modo.',
    nombrar: 'Nombrar: toca un punto para cambiarle el nombre o una línea para ponerle uno.',
  },
};

/* =====================================================================
   Entrada: ratón, lápiz digital y táctil con Pointer Events
   ===================================================================== */
const Entrada = {
  punteros: new Map(),    // id -> {x, y, tipo}
  arrastre: null,         // {id, x, y} desplazamiento con un puntero
  accion: null,           // {id} puntero que usa la herramienta activa
  gesto: null,            // {dist, mx, my} pellizco con dos dedos
  espacio: false,
  lapizDigitalActivo: false,

  iniciar() {
    const el = Capas.contenedor;
    el.addEventListener('pointerdown', e => this.abajo(e));
    el.addEventListener('pointermove', e => this.mover(e));
    el.addEventListener('pointerup', e => this.arriba(e));
    el.addEventListener('pointercancel', e => this.arriba(e));
    el.addEventListener('pointerleave', e => {
      if (e.pointerType === 'touch') return;
      UI.coords(null);
      if (!this.accion) this.cursorInstrumento(null);
      const acc = Acciones.actual();
      if (acc && !this.accion) acc.salir();
    });
    el.addEventListener('wheel', e => this.rueda(e), { passive: false });
    el.addEventListener('contextmenu', e => e.preventDefault());
    // Safari: gestos propios del navegador
    for (const t of ['gesturestart', 'gesturechange', 'gestureend'])
      document.addEventListener(t, e => e.preventDefault(), { passive: false });
    document.addEventListener('dblclick', e => e.preventDefault());
    window.addEventListener('keydown', e => this.tecla(e));
    window.addEventListener('keyup', e => {
      if (e.code === 'Space') { this.espacio = false; this.actualizarCursor(); }
    });
    window.addEventListener('blur', () => { this.espacio = false; this.actualizarCursor(); });
  },

  local(e) {
    const r = Capas.contenedor.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  },

  abajo(e) {
    // Rechazo de palma: con lápiz digital en uso se ignoran los dedos
    if (e.pointerType === 'touch' && this.lapizDigitalActivo) return;
    if (e.pointerType === 'pen') this.lapizDigitalActivo = true;

    const p = this.local(e);
    this.punteros.set(e.pointerId, { id: e.pointerId, x: p.x, y: p.y, tipo: e.pointerType });
    try { Capas.contenedor.setPointerCapture(e.pointerId); } catch (_) {}

    const toques = [...this.punteros.values()].filter(q => q.tipo === 'touch');
    // Con un dedo girando el compás, otro dedo puede apoyar o levantar la mina sin soltarlo
    if (e.pointerType === 'touch' && toques.length === 2 && Manip.estado && Manip.estado.modo === 'trazar') {
      const h = Instrumentos.tocar(this.info(e, p), false);
      if (h && h.modo === 'mina') {
        h.inst.alternarMina();
        this.punteros.delete(e.pointerId);     // este toque no cuenta como gesto
        return;
      }
    }
    if (e.pointerType === 'touch' && toques.length === 2) {
      Lupa.ocultar();
      // Segundo dedo mientras se arrastra un instrumento: mover y girar con dos dedos
      if (this.accion && this.accion.manip && Manip.dosDedos(toques)) return;
      // Empieza pellizco: cancela cualquier arrastre o acción de un dedo
      if (this.accion && this.accion.manip) { Manip.fin(false); this.accion = null; }
      this.arrastre = null;
      if (this.accion) Acciones.cancelarActual();
      this.gesto = this.medirGesto(toques);
      return;
    }
    if (this.gesto) return;

    // Instrumentos: asas de giro y cuerpo (la goma trabaja por debajo de ellos)
    const info = this.info(e, p);
    if (e.button === 0 && !this.accion && !this.espacio && !App.debajo()) {
      const hit = Instrumentos.tocar(info, App.herramienta === 'lapiz');
      if (hit && hit.modo === 'mina') {
        e.preventDefault();
        hit.inst.alternarMina();
        return;
      }
      if (hit && hit.modo === 'voltear') {
        e.preventDefault();
        Historial.registrar();
        hit.inst.voltear();
        Sonido.tocar('iman');
        UI.mensaje(`${hit.inst.nombre} ${hit.inst.volteado ? 'del revés' : 'del derecho'}: le has dado la vuelta.`);
        Render.pedir('instrumentos');
        return;
      }
      if (hit && hit.modo === 'candado') {
        e.preventDefault();
        const inst = hit.inst;
        Historial.registrar();
        inst.bloqueado = !inst.bloqueado;
        Sonido.tocar('iman');
        UI.mensaje(inst.bloqueado
          ? `${inst.nombre} fijad${inst.g}: no se moverá, pero puedes trazar y deslizar otros instrumentos sobre ${inst.g === 'a' ? 'ella' : 'él'}.`
          : `${inst.nombre} suelt${inst.g}: ya se puede mover.`);
        Render.pedir('instrumentos');
        return;
      }
      if (hit) {
        e.preventDefault();
        const acc = Acciones.actual();
        if (acc) acc.salir();
        this.accion = { id: e.pointerId, manip: true };
        Manip.iniciar(hit, info);
        if (e.pointerType === 'touch') Lupa.seguir(p);
        return;
      }
    }

    const quiereMover =
      App.herramienta === 'mover' ||
      e.button === 1 ||
      (this.espacio && e.pointerType === 'mouse');
    if (quiereMover) {
      e.preventDefault();
      this.arrastre = { id: e.pointerId, x: p.x, y: p.y };
      Capas.contenedor.classList.add('arrastrando');
      if (App.herramienta !== 'mover') Capas.contenedor.classList.add('mover');
      return;
    }
    // Herramienta activa (solo botón principal o toque)
    const acc = Acciones.actual();
    if (acc && e.button === 0 && !this.accion) {
      e.preventDefault();
      this.accion = { id: e.pointerId };
      acc.abajo(info);
      if (e.pointerType === 'touch') Lupa.seguir(p);
    }
  },

  info(e, p) {
    const m = Vista.aMundo(p.x, p.y);
    return { x: m.x, y: m.y, sx: p.x, sy: p.y, tipo: e.pointerType, id: e.pointerId };
  },

  mover(e) {
    const p = this.local(e);
    if (e.pointerType !== 'touch') UI.coords(Vista.aMundo(p.x, p.y));
    const q = this.punteros.get(e.pointerId);
    if (!q) {
      // Ratón o lápiz sin pulsar: vista previa de la herramienta o del instrumento
      if (e.pointerType === 'touch' || this.arrastre || this.espacio) return;
      const info = this.info(e, p);
      const hit = !App.debajo() && Instrumentos.tocar(info, App.herramienta === 'lapiz');
      this.cursorInstrumento(hit);
      const acc = Acciones.actual();
      if (acc) { if (hit) acc.salir(); else acc.pasar(info); }
      return;
    }
    q.x = p.x; q.y = p.y;
    if (e.pointerType === 'touch' && this.accion && !this.gesto) Lupa.seguir(p);
    if (this.accion && this.accion.manip) {
      if (Manip.usa(e.pointerId)) Manip.mover(this.info(e, p), e);
      return;
    }
    if (this.accion && this.accion.id === e.pointerId) {
      const acc = Acciones.actual();
      if (acc) acc.mover(this.info(e, p));
      return;
    }

    if (this.gesto) {
      const toques = [...this.punteros.values()].filter(t => t.tipo === 'touch');
      if (toques.length < 2) return;
      const g = this.medirGesto(toques);
      Vista.desplazar(g.mx - this.gesto.mx, g.my - this.gesto.my);
      if (this.gesto.dist > 0) Vista.zoomEn(g.mx, g.my, g.dist / this.gesto.dist);
      this.gesto = g;
      return;
    }
    if (this.arrastre && this.arrastre.id === e.pointerId) {
      Vista.desplazar(p.x - this.arrastre.x, p.y - this.arrastre.y);
      this.arrastre.x = p.x; this.arrastre.y = p.y;
    }
  },

  arriba(e) {
    if (!this.punteros.has(e.pointerId)) return;
    this.punteros.delete(e.pointerId);
    if (e.pointerType === 'touch') Lupa.ocultar();
    if (e.pointerType === 'pen') this.lapizDigitalActivo = false;
    if (this.accion && this.accion.manip) {
      if (Manip.usa(e.pointerId)) {
        this.accion = null;
        Manip.fin();
      }
    } else if (this.accion && this.accion.id === e.pointerId) {
      this.accion = null;
      const acc = Acciones.actual();
      if (acc) {
        if (e.type === 'pointercancel') acc.cancelar();
        else acc.arriba(this.info(e, this.local(e)));
      }
    }
    if (this.arrastre && this.arrastre.id === e.pointerId) {
      this.arrastre = null;
      Capas.contenedor.classList.remove('arrastrando');
      this.actualizarCursor();
    }
    if (this.gesto) {
      const toques = [...this.punteros.values()].filter(t => t.tipo === 'touch');
      if (toques.length < 2) this.gesto = null;
    }
  },

  medirGesto(t) {
    return {
      dist: Geom.dist(t[0].x, t[0].y, t[1].x, t[1].y),
      mx: (t[0].x + t[1].x) / 2,
      my: (t[0].y + t[1].y) / 2,
    };
  },

  rueda(e) {
    e.preventDefault();
    const p = this.local(e);
    let dy = e.deltaY;
    if (e.deltaMode === 1) dy *= 16;        // líneas
    else if (e.deltaMode === 2) dy *= 400;  // páginas
    // ctrlKey = pellizco en trackpad: más sensible
    const k = e.ctrlKey ? 0.01 : 0.0015;
    Vista.zoomEn(p.x, p.y, Math.exp(-dy * k));
  },

  tecla(e) {
    if (UI.panelAbierto) {
      if (e.key === 'Escape') UI.cerrarPanel();
      return;
    }
    if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.code === 'Space') {
      if (!this.espacio) { this.espacio = true; this.actualizarCursor(); }
      e.preventDefault();
      return;
    }
    const k = e.key;
    if ((e.ctrlKey || e.metaKey) && !e.altKey) {
      const kl = k.toLowerCase();
      if (kl === 'z' && !e.shiftKey) { Historial.deshacer(); e.preventDefault(); }
      else if (kl === 'y' || (kl === 'z' && e.shiftKey)) { Historial.rehacer(); e.preventDefault(); }
      return;
    }
    if (e.altKey) return;
    if (k === 'Escape') { if (SelectorLapiz.abierto) { SelectorLapiz.cerrar(true); return; } Acciones.cancelarActual(); return; }
    if (k === '?' || k === 'F1') { UI.abrirPanel('ayuda'); e.preventDefault(); return; }
    if (k === 'l' || k === 'L') {
      const c = Instrumentos.porTipo.compas;
      if (c.visible) c.alternarMina(); else UI.mensaje('Saca el compás para apoyar o levantar su mina.');
      return;
    }
    if (k === '+' || k === '=') { this.zoomCentro(1.25); e.preventDefault(); return; }
    if (k === '-' || k === '_') { this.zoomCentro(1 / 1.25); e.preventDefault(); return; }
    if (k === '0') { Vista.ajustar(); return; }
    const mayus = k.toUpperCase();
    if (mayus === 'H') { App.seleccionar('mover'); return; }
    if (k === '[' || k === ']') {
      Config.set('tamGoma', Config.get('tamGoma') + (k === ']' ? 1 : -1));
      return;
    }
    const h = Herramientas.find(t => t.tecla === mayus);
    if (h) App.seleccionar(h.id);
  },

  zoomCentro(f) { Vista.zoomEn(Capas.w / 2, Capas.h / 2, f); },

  cursorInstrumento(hit) {
    const el = Capas.contenedor;
    el.classList.toggle('sobre-asa', !!hit && hit.modo === 'girar');
    el.classList.toggle('sobre-instrumento', !!hit && hit.modo === 'mover');
    el.classList.toggle('sobre-candado', !!hit && (hit.modo === 'candado' || hit.modo === 'mina' || hit.modo === 'voltear'));
  },

  actualizarCursor() {
    const el = Capas.contenedor;
    const h = Herramientas.find(t => t.id === App.herramienta);
    el.classList.remove('mover', 'precision');
    if (this.espacio || (h && h.cursor === 'mover')) el.classList.add('mover');
    else if (h && h.cursor) el.classList.add(h.cursor);
  },
};

/* =====================================================================
   Interfaz de usuario
   ===================================================================== */
const UI = {
  panelAbierto: false,
  temporizadorAviso: 0,

  crearBoton({ id, nombre, tecla, icono, alPulsar, conmutable }) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.type = 'button';
    if (id) b.dataset.id = id;
    b.innerHTML = Iconos[icono];
    b.setAttribute('aria-label', nombre);
    b.title = tecla ? `${nombre} (${tecla})` : nombre;
    if (conmutable) b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', alPulsar);
    return b;
  },

  construirBarra() {
    const barra = document.getElementById('barra');
    const grupo = () => { const g = document.createElement('div'); g.className = 'grupo'; barra.appendChild(g); return g; };
    const sep = () => { const s = document.createElement('div'); s.className = 'sep'; barra.appendChild(s); };

    // Herramientas de mano y, aparte, los instrumentos (se muestran u ocultan)
    for (const instr of [false, true]) {
      const g = grupo();
      for (const h of Herramientas.filter(t => !!t.instrumento === instr)) {
        g.appendChild(this.crearBoton({
          id: h.id, nombre: instr ? `${h.nombre} (mostrar u ocultar)` : h.nombre, tecla: h.tecla, icono: h.icono, conmutable: true,
          alPulsar: () => App.seleccionar(h.id),
        }));
        if (instr) g.lastChild.dataset.instrumento = '1';
      }
      sep();
    }
    const gHist = grupo();
    this.btnDeshacer = this.crearBoton({ nombre: 'Deshacer', tecla: 'Ctrl+Z', icono: 'deshacer', alPulsar: () => Historial.deshacer() });
    this.btnRehacer  = this.crearBoton({ nombre: 'Rehacer',  tecla: 'Ctrl+Y', icono: 'rehacer',  alPulsar: () => Historial.rehacer() });
    this.btnDeshacer.disabled = this.btnRehacer.disabled = true;
    gHist.append(this.btnDeshacer, this.btnRehacer);
    sep();
    const gZoom = grupo();
    const mas = this.crearBoton({ nombre: 'Acercar', tecla: '+', icono: 'zoomMas', alPulsar: () => Entrada.zoomCentro(1.25) });
    const menos = this.crearBoton({ nombre: 'Alejar', tecla: '−', icono: 'zoomMenos', alPulsar: () => Entrada.zoomCentro(1 / 1.25) });
    mas.classList.add('solo-raton'); menos.classList.add('solo-raton');   // en tablet se usan dos dedos
    gZoom.append(mas, menos,
      this.crearBoton({ nombre: 'Ver la hoja entera', tecla: '0', icono: 'ajustar', alPulsar: () => Vista.ajustar() }),
    );
    const esp = document.createElement('div'); esp.className = 'espaciador'; barra.appendChild(esp);
    const gConf = grupo();
    gConf.append(
      this.crearBoton({ nombre: 'Ejercicios guiados', icono: 'ejercicios', alPulsar: () => this.abrirPanel('ejercicios') }),
      this.crearBoton({ nombre: 'Ayuda', tecla: '?', icono: 'ayuda', alPulsar: () => this.abrirPanel('ayuda') }),
      this.crearBoton({ nombre: 'Dibujo: nuevo, guardar, abrir, exportar', icono: 'guardar', alPulsar: () => this.abrirPanel('archivo') }),
      this.crearBoton({ nombre: 'Configuración', icono: 'engranaje', alPulsar: () => this.abrirPanel('config') }),
    );
  },

  construirOpcionesGoma() {
    const o = document.getElementById('opciones-goma');
    const ico = document.createElement('span');
    ico.className = 'og-ico';
    ico.innerHTML = Iconos.goma;
    const modos = Panel.segmentado('modoGoma', [['trozos', 'A trozos'], ['enteras', 'Enteras']],
      { trozos: 'Borrar solo lo que pisa la goma', enteras: 'Borrar líneas y arcos enteros' });
    modos.setAttribute('aria-label', 'Modo de la goma');
    o.append(ico, modos, Panel.deslizador('tamGoma', 'Tamaño de la goma'));
    for (const t of ['pointerdown', 'pointermove', 'pointerup', 'wheel', 'dblclick'])
      o.addEventListener(t, e => e.stopPropagation(), { passive: true });
    Panel.actualizar();
  },
  // Barra del portaminas: color y grosor actuales; cada uno abre su ventana flotante
  construirOpcionesLapiz() {
    const o = document.getElementById('opciones-lapiz');
    const ico = document.createElement('span');
    ico.className = 'og-ico';
    ico.innerHTML = Iconos.lapiz;
    const boton = (que, nombre) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'ol-boton';
      b.dataset.selector = que;
      b.setAttribute('aria-haspopup', 'dialog');
      b.setAttribute('aria-expanded', 'false');
      b.title = nombre;
      b.addEventListener('click', () => SelectorLapiz.alternar(que, b));
      return b;
    };
    this.btnColorLapiz = boton('color', 'Elegir el color del portaminas');
    this.btnGrosorLapiz = boton('grosor', 'Elegir el grosor de la mina');
    o.append(ico, this.btnColorLapiz, this.btnGrosorLapiz);
    for (const el of [o, document.getElementById('selector-lapiz')])
      for (const t of ['pointerdown', 'pointermove', 'pointerup', 'wheel', 'dblclick'])
        el.addEventListener(t, e => e.stopPropagation(), { passive: true });
    this.actualizarOpcionesLapiz();
  },
  actualizarOpcionesLapiz() {
    if (!this.btnColorLapiz) return;
    const c = Config.get('colorLapiz'), g = Config.get('grosorLapiz');
    const nombre = Paleta.nombre(Paleta.info(c));
    this.btnColorLapiz.innerHTML = `<span class="pinta" style="background:${Paleta.colorLapiz(c)}"></span><span>${nombre}</span><span class="flecha"></span>`;
    this.btnColorLapiz.setAttribute('aria-label', `Color del portaminas: ${nombre}. Pulsa para cambiarlo`);
    this.btnGrosorLapiz.innerHTML = `<span style="color:${Paleta.colorLapiz(c)};display:contents">${SelectorLapiz.muestraGrosor(g)}</span><span>${SelectorLapiz.mm(g)}</span><span class="flecha"></span>`;
    this.btnGrosorLapiz.setAttribute('aria-label', `Grosor de la mina: ${SelectorLapiz.mm(g)}. Pulsa para cambiarlo`);
    SelectorLapiz.refrescar();
  },
  marcarHerramienta(id) {
    document.getElementById('opciones-goma').hidden = id !== 'goma';
    document.getElementById('opciones-lapiz').hidden = id !== 'lapiz';
    if (id !== 'nombrar') Nombrar.cerrar();
    if (id !== 'lapiz') SelectorLapiz.cerrar();
    document.querySelectorAll('#barra .btn[data-id]:not([data-instrumento])').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.id === id)));
  },
  marcarInstrumentos() {
    document.querySelectorAll('#barra .btn[data-instrumento]').forEach(b => {
      const inst = Instrumentos.porTipo[b.dataset.id];
      b.setAttribute('aria-pressed', String(!!(inst && inst.visible)));
    });
  },

  actualizarHistorial() {
    this.btnDeshacer.disabled = !Historial.pasado.length;
    this.btnRehacer.disabled = !Historial.futuro.length;
  },

  mensaje(txt) { document.getElementById('mensaje').textContent = txt; },

  aviso(txt) {
    const a = document.getElementById('aviso');
    a.textContent = txt;
    a.classList.add('visible');
    clearTimeout(this.temporizadorAviso);
    this.temporizadorAviso = setTimeout(() => a.classList.remove('visible'), 2200);
  },

  coords(p) {
    const el = document.getElementById('coords');
    if (!p || p.x < 0 || p.y < 0 || p.x > Hoja.ancho || p.y > Hoja.alto) { el.textContent = ''; return; }
    const f = v => v.toFixed(1).replace('.', ',');
    el.textContent = `x ${f(p.x)} mm · y ${f(p.y)} mm`;
  },

  actualizarZoom() {
    document.getElementById('zoom').textContent = `${Vista.porcentaje()} %`;
  },

  abrirPanel(id = 'config') {
    if (this.panelAbierto) this.cerrarPanel();
    Acciones.cancelarActual();
    this.panelAbierto = id;
    const p = document.getElementById('panel-' + id);
    p.classList.add('abierto');
    p.setAttribute('aria-hidden', 'false');
    p.inert = false;
    document.getElementById('velo').classList.add('visible');
    p.querySelector('.cerrar-panel').focus();
    if (id === 'ejercicios') Catalogo.cargar();
  },
  cerrarPanel() {
    this.panelAbierto = false;
    for (const p of document.querySelectorAll('.panel')) {
      p.classList.remove('abierto');
      p.setAttribute('aria-hidden', 'true');
      p.inert = true;
    }
    document.getElementById('velo').classList.remove('visible');
  },

  iniciar() {
    this.construirBarra();
    Panel.construir();
    Archivo.construir();
    Ayuda.construir();
    Catalogo.construir();
    this.construirOpcionesGoma();
    this.construirOpcionesLapiz();
    Nombrar.construir();
    // La tarjeta del ejercicio está sobre el lienzo: sus toques no deben dibujar ni mover la hoja
    const tarjeta = document.getElementById('tarjeta-ejercicio');
    for (const t of ['pointerdown', 'pointermove', 'pointerup', 'wheel', 'dblclick'])
      tarjeta.addEventListener(t, e => e.stopPropagation(), { passive: true });
    for (const p of document.querySelectorAll('.panel')) p.inert = true;
    for (const b of document.querySelectorAll('.cerrar-panel')) {
      b.innerHTML = Iconos.cerrar;
      b.addEventListener('click', () => this.cerrarPanel());
    }
    document.getElementById('velo').addEventListener('click', () => this.cerrarPanel());
    document.getElementById('zoom').addEventListener('click', () => Vista.ajustar());
  },
};

/* =====================================================================
   Ventana flotante del portaminas: biblioteca de colores y grosores
   ===================================================================== */
const SelectorLapiz = {
  abierto: null,     // 'color' | 'grosor' | null
  boton: null,
  grosores() {
    const e = Config.esquema.grosorLapiz, l = [];
    for (let g = e.min; g <= e.max + 1e-9; g += e.paso) l.push(Number(g.toFixed(1)));
    return l;
  },
  mm(g) { return `${g.toFixed(1).replace('.', ',')} mm`; },
  // Línea de muestra con un grosor proporcional al de la mina (0,5 mm → 2 px; 1,5 mm → 8 px)
  muestraGrosor(g) { return `<span class="linea" style="height:${(2 + (g - 0.5) * 6).toFixed(1)}px"></span>`; },
  alternar(que, boton) {
    if (this.abierto === que) { this.cerrar(); return; }
    this.abrir(que, boton);
  },
  abrir(que, boton) {
    this.cerrar();
    this.abierto = que;
    this.boton = boton;
    boton.setAttribute('aria-expanded', 'true');
    const v = document.getElementById('selector-lapiz');
    v.hidden = false;
    v.setAttribute('aria-label', que === 'color' ? 'Color del portaminas' : 'Grosor de la mina');
    this.pintar();
    // Encima de la barra del portaminas
    const barra = document.getElementById('opciones-lapiz');
    v.style.bottom = (barra.offsetHeight + 18) + 'px';
    const sel = v.querySelector('[aria-checked="true"]');
    if (sel) sel.focus();
    document.addEventListener('pointerdown', this.fuera, true);   // el pointerdown del clic que la abre ya pasó
  },
  cerrar(enfocar) {
    if (!this.abierto) return;
    document.getElementById('selector-lapiz').hidden = true;
    document.removeEventListener('pointerdown', this.fuera, true);
    if (this.boton) { this.boton.setAttribute('aria-expanded', 'false'); if (enfocar) this.boton.focus(); }
    this.abierto = null;
    this.boton = null;
  },
  // Pulsar fuera de la ventana (y de su botón) la cierra
  fuera(e) {
    const v = document.getElementById('selector-lapiz');
    if (v.contains(e.target) || (SelectorLapiz.boton && SelectorLapiz.boton.contains(e.target))) return;
    // Un toque en la hoja solo cierra la ventana: no marca un punto ni traza
    if (Capas.contenedor.contains(e.target) && e.target.tagName === 'CANVAS') { e.stopPropagation(); e.preventDefault(); }
    SelectorLapiz.cerrar();
  },
  pintar() {
    const v = document.getElementById('selector-lapiz');
    v.innerHTML = '';
    const h = document.createElement('h4');
    const g = document.createElement('div');
    g.className = 'sl-rejilla';
    g.setAttribute('role', 'radiogroup');
    g.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.stopPropagation(); this.cerrar(true); return; }
      const dir = { ArrowRight: 1, ArrowDown: 3, ArrowLeft: -1, ArrowUp: -3 }[e.key];
      if (!dir) return;
      e.preventDefault();
      const bs = [...g.querySelectorAll('[role=radio]')];
      const i = bs.indexOf(document.activeElement);
      bs[Math.max(0, Math.min(bs.length - 1, i + dir))].focus();
    });
    const opcion = (clase, contenido, nombre, alElegir) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = clase;
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-label', nombre);
      b.innerHTML = contenido;
      b.addEventListener('click', () => { alElegir(); this.cerrar(true); });
      g.appendChild(b);
      return b;
    };
    if (this.abierto === 'color') {
      h.textContent = 'Color';
      g.setAttribute('aria-label', 'Color del portaminas');
      for (const e of Paleta.lista()) {
        const nombre = Paleta.nombre(e);
        const b = opcion('sl-color', `<span class="pinta" style="background:${e.color}"></span><span></span>`, nombre, () => Config.set('colorLapiz', e.id));
        b.lastChild.textContent = nombre;   // el nombre lo escribe el usuario: como texto
        b.dataset.valor = e.id;
      }
    } else {
      h.textContent = 'Grosor de la mina';
      g.setAttribute('aria-label', 'Grosor de la mina');
      const col = Paleta.lapizActual();
      for (const gr of this.grosores())
        opcion('sl-grosor', `<span style="color:${col};display:contents">${this.muestraGrosor(gr)}</span><span>${this.mm(gr)}</span>`, this.mm(gr),
          () => Config.set('grosorLapiz', gr)).dataset.valor = gr;
    }
    v.append(h, g);
    this.refrescar();
  },
  refrescar() {
    if (!this.abierto) return;
    const actual = this.abierto === 'color' ? Config.get('colorLapiz') : Config.get('grosorLapiz');
    document.querySelectorAll('#selector-lapiz [role=radio]').forEach(b => {
      const sel = this.abierto === 'color' ? b.dataset.valor === actual : Math.abs(Number(b.dataset.valor) - actual) < 1e-6;
      b.setAttribute('aria-checked', String(sel));
      b.tabIndex = sel ? 0 : -1;
    });
  },
};

  // Lista editable de colores: muestra, nombre (si se deja vacío, se ve el código) y quitar
