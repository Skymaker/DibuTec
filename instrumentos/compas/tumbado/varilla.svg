<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="1.352mm" viewBox="0 -0.676 160 1.352">
  <!--
    DibuTec · compás · varilla del tornillo de ajuste (tumbado)
    Es un TROZO que se repite a lo largo de la varilla, cada 160 mm (el ancho del viewBox).
    La varilla va en horizontal, centrada en y = 0.
  -->
  <rect id="varilla" x="0" y="-0.576" width="160" height="1.152" fill="#bebebe"/>
  <path id="bordes" d="M 0 -0.576 L 160 -0.576 M 0 0.576 L 160 0.576" stroke="#555a60" stroke-width="0.0645" fill="none"/>
</svg>
