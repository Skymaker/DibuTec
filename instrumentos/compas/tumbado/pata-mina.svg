    DibuTec · compás · pata de la mina (tumbado)
    Unidades: milímetros. La bisagra está en (0, 0) y la punta hacia abajo (+y): marca «punta».
    Hacia +x queda el lado de FUERA del compás. La marca «ajuste» fija la altura del tornillo de ajuste.
    DibuTec gira la pata según lo abierto que esté el compás y la estira o encoge a lo largo hasta la punta.
    La forma con id="mina" se pinta del color del portaminas.
