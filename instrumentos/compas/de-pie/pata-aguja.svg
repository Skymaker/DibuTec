  <!--
    DibuTec · compás · pata de la punta seca (de pie, desde arriba)
    Vista desde arriba con el compás de pie: las patas, tumbadas en la línea de las puntas.
    Unidades: milímetros. El centro del compás está en (0, 0) y la punta hacia abajo (+y): marca «punta».
    La marca «eje» es donde queda, visto desde arriba, el tornillo en el que gira la pata.
    Hacia +x queda el lado que, en la pantalla, está por encima de la línea de las puntas.
    DibuTec estira o encoge la pata a lo largo según lo abierto que esté el compás.
  -->
