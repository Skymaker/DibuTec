<svg xmlns="http://www.w3.org/2000/svg" width="21mm" height="6.45mm" viewBox="-10.5 -2.25 21 6.45">
  <!--
    DibuTec · compás DE PIE (visto desde arriba) · cabeza
    Es la pieza tumbada (../tumbado/cabeza.svg) con la deformación que le aplica DibuTec al ponerse de pie:
    1,5 veces más ancha (está más cerca de quien mira) y aplastada a 0,3 de su altura (se ve por arriba).
    Mismo anclaje, mismas marcas y mismos nombres que la pieza tumbada.
    La deformación está en el grupo «de-pie» (transform). Para editar los nodos ya deformados,
    en Inkscape: selecciona el grupo y Objeto › Desagrupar (Mayús+Ctrl+G); la transformación pasa a los trazados.
  -->
  <g id="de-pie" transform="scale(1.5 0.3)">
  <path id="cuerpo" d="M -4.5 -6.5 L 4.5 -6.5 Q 6 -6.5 6 -5 L 6 8 L 3.6 13 L -3.6 13 L -6 8 L -6 -5 Q -6 -6.5 -4.5 -6.5 Z" fill="#17191d"/>
  <path id="brillos" d="M -4.32 -5.5 L -4.32 -3.5 M 4.32 -5.5 L 4.32 -3.5" stroke="#ffffff" stroke-opacity="0.13" stroke-width="0.6" fill="none"/>
  <g id="tornillo-izquierdo">
    <circle cx="-2.8" cy="0" r="1.3" fill="#d9dce2" stroke="#6e737d" stroke-width="0.2"/>
    <path d="M -3.406 -0.764 L -2.194 0.764" stroke="#4a4f59" stroke-width="0.364"/>
  </g>
  <g id="tornillo-derecho">
    <circle cx="2.8" cy="0" r="1.3" fill="#d9dce2" stroke="#6e737d" stroke-width="0.2"/>
    <path d="M 3.374 -0.788 L 2.226 0.788" stroke="#4a4f59" stroke-width="0.364"/>
  </g>
  </g>
</svg>
