<svg xmlns="http://www.w3.org/2000/svg" width="6mm" height="10.5mm" viewBox="-3 -5.25 6 10.5">
  <!--
    DibuTec · compás DE PIE (visto desde arriba) · rueda-ajuste
    Es la pieza tumbada (rueda-ajuste.svg) con la deformación que le aplica DibuTec al ponerse de pie:
    1,5 veces más grande.
    Mismo anclaje, mismas marcas y mismos nombres que la pieza tumbada.
    La deformación está en el grupo «de-pie» (transform). Para editar los nodos ya deformados,
    en Inkscape: selecciona el grupo y Objeto › Desagrupar (Mayús+Ctrl+G); la transformación pasa a los trazados.
  -->
  <g id="de-pie" transform="scale(1.5 1.5)">
  <rect id="rueda" x="-1.08" y="-2.7" width="2.16" height="5.4" rx="1.35" fill="#1b1d22"/>
  <path id="estrias" d="M -1.08 -1.8 L 1.08 -1.8 M -1.08 -0.6 L 1.08 -0.6 M -1.08 0.6 L 1.08 0.6 M -1.08 1.8 L 1.08 1.8" stroke="#41444d" stroke-width="0.15" fill="none"/>
  </g>
</svg>
