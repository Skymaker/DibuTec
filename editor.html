<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>Editor de ejercicios · DibuTec</title>
<link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
<link rel="icon" href="iconos/favicon-32.png" type="image/png" sizes="32x32">
<style>
  :root {
    --ui-bg: #f4f1ea;
    --barra: #ffffff;
    --borde: #ddd6c8;
    --texto: #2d3047;
    --texto-suave: #6b6f85;
    --activo: #2f6fd0;
    --activo-fondo: #e2edfd;
    --hover: #f2eee6;
    --acento: #ffd166;
    --acento-activo: #b9d3fb;
    --foco: #ff9f1c;
    --mesa: #cdbb9f;
    --error: #c0392b;
    --error-fondo: #fdecea;
    --avisoc: #a06a00;
    --aviso-fondo: #fff4d6;
    --bien: #24814f;
    --paso: #e07b12;
    --radio: 12px;
    --btn: 40px;
    --fuente: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (pointer: coarse) { :root { --btn: 48px; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ui-bg); color: var(--texto); font-family: var(--fuente); font-size: 15px; }
  button, input, select, textarea { font: inherit; color: inherit; }

  #app {
    display: grid; height: 100%; height: 100dvh;
    grid-template-columns: 300px minmax(0, 1fr) 380px;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "cab cab cab" "esquema zona inspector";
  }

  /* ---------- Cabecera ---------- */
  #cab {
    grid-area: cab; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 6px 12px; background: var(--barra); border-bottom: 1px solid var(--borde);
  }
  .marca { display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; margin-right: auto; }
  .marca img { width: 32px; height: 32px; }
  .marca b { font-size: 18px; }
  .marca span { color: var(--texto-suave); font-size: 14px; }
  .acciones { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .acciones .sep { width: 1px; height: 26px; background: var(--borde); margin: 0 4px; }

  .btn {
    min-width: var(--btn); height: var(--btn); border: none; border-radius: 10px;
    background: transparent; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 0 8px; cursor: pointer; touch-action: manipulation; white-space: nowrap;
  }
  .btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .btn svg .a { fill: var(--acento); }
  @media (hover: hover) { .btn:hover:not(:disabled) { background: var(--hover); } }
  .btn[aria-pressed="true"] { background: var(--activo-fondo); color: var(--activo); box-shadow: inset 0 0 0 2px var(--activo); }
  .btn[aria-pressed="true"] svg .a { fill: var(--acento-activo); }
  .btn:disabled { opacity: .3; cursor: default; }
  .btn.primario { background: var(--activo); color: #fff; padding: 0 14px; }
  .btn.primario svg .a { fill: rgba(255,255,255,.35); }
  @media (hover: hover) { .btn.primario:hover:not(:disabled) { background: #245cb3; } }
  .btn:focus-visible, .chip:focus-visible, .paso-item:focus-visible, .esq-item:focus-visible { outline: 3px solid var(--foco); outline-offset: 1px; }
  .btn .txt { font-size: 14px; }
  @media (max-width: 1250px) { .acciones .btn .txt.opc { display: none; } }

  /* ---------- Esquema (izquierda) ---------- */
  #esquema {
    grid-area: esquema; overflow-y: auto; background: var(--barra); border-right: 1px solid var(--borde);
    padding: 10px; display: flex; flex-direction: column; gap: 6px;
  }
  .esq-titulo { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--texto-suave); margin: 10px 4px 2px; display: flex; align-items: center; justify-content: space-between; }
  .esq-item, .paso-item {
    display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left;
    padding: 9px 10px; border: 1px solid var(--borde); border-radius: var(--radio); background: #fff; cursor: pointer;
  }
  .esq-item svg { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--texto); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .esq-item svg .a { fill: var(--acento); }
  .esq-item .t { display: flex; flex-direction: column; min-width: 0; }
  .esq-item small, .paso-item small { color: var(--texto-suave); font-size: 13px; }
  @media (hover: hover) { .esq-item:hover, .paso-item:hover { border-color: var(--activo); } }
  .esq-item.sel, .paso-item.sel { border-color: var(--activo); background: var(--activo-fondo); box-shadow: inset 0 0 0 1px var(--activo); }
  .paso-item .num {
    flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    background: var(--acento); font-weight: 700; font-size: 14px;
  }
  .paso-item.sel .num { background: var(--paso); color: #fff; }
  .paso-item .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .paso-item .texto { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; font-size: 14px; }
  .paso-item .texto.vacio { color: var(--error); font-style: italic; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 12px; padding: 1px 7px; border-radius: 999px; background: #f2eee6; color: var(--texto-suave); }
  .tag.tag-obj { background: #fdeedd; color: #8a4a08; font-weight: 600; }
  button.tag { border: 1px solid transparent; font: inherit; font-size: 12px; cursor: pointer; }
  button.tag:hover, button.tag:focus-visible { border-color: var(--activo); background: var(--activo-fondo); color: var(--texto); outline: none; }
  .marca-error { width: 9px; height: 9px; border-radius: 50%; background: var(--error); flex: none; margin-top: 4px; }
  .marca-aviso { width: 9px; height: 9px; border-radius: 50%; background: #e0a800; flex: none; margin-top: 4px; }
  .paso-item.arrastrado { opacity: .4; }
  .paso-item.destino { box-shadow: 0 -3px 0 var(--activo); }
  .anadir {
    width: 100%; padding: 10px; border: 2px dashed var(--borde); border-radius: var(--radio);
    background: transparent; color: var(--activo); font-weight: 600; cursor: pointer;
  }
  @media (hover: hover) { .anadir:hover { border-color: var(--activo); background: var(--activo-fondo); } }

  /* ---------- Zona central ---------- */
  #zona { grid-area: zona; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; }
  #herr {
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    padding: 6px 8px; background: var(--barra); border-bottom: 1px solid var(--borde);
  }
  #herr .sep { width: 1px; height: 26px; background: var(--borde); margin: 0 4px; }
  #herr .espacio { flex: 1; }
  #lienzo { position: relative; overflow: hidden; background: var(--mesa); touch-action: none; }
  #lienzo svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
  #lienzo.h-sel { cursor: default; }
  #lienzo.h-punto, #lienzo.h-recta, #lienzo.h-arco, #lienzo.eligiendo { cursor: crosshair; }
  #lienzo.sobre { cursor: pointer; }
  #lienzo.arrastrando { cursor: grabbing; }
  #banda {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 20px);
    background: var(--texto); color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,.2); display: flex; gap: 10px; align-items: center; pointer-events: auto;
  }
  #banda[hidden] { display: none; }
  #banda button { border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff; border-radius: 8px; padding: 2px 10px; cursor: pointer; }
  #leyenda {
    position: absolute; left: 10px; bottom: 10px; background: rgba(255,255,255,.92); border: 1px solid var(--borde);
    border-radius: 10px; padding: 6px 10px; font-size: 12.5px; display: flex; gap: 12px; flex-wrap: wrap; max-width: calc(100% - 20px);
  }
  #leyenda[hidden] { display: none; }
  #leyenda i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
  #estado {
    display: flex; align-items: center; gap: 12px; min-height: 34px; padding: 4px 12px;
    background: var(--barra); border-top: 1px solid var(--borde); font-size: 13.5px; color: var(--texto-suave);
  }
  #mensaje { flex: 1; min-width: 0; color: var(--texto); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #coords { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mover-mm { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; margin: 8px 0 12px; }
  .seg.seg-varias button span { vertical-align: middle; }
  .seg.seg-varias button svg { width: 16px; height: 16px; vertical-align: middle; margin-right: 6px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .seg.seg-varias button svg .a { fill: var(--acento); }
  #lienzo.mover-todo { cursor: move; }
  #lienzo.mover-todo.arrastrando { cursor: grabbing; }
  #btn-comprobar { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--borde); background: #fff; border-radius: 999px; padding: 3px 12px 3px 8px; cursor: pointer; font-size: 13.5px; white-space: nowrap; color: var(--texto); }
  #btn-comprobar svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #btn-comprobar svg .a { fill: var(--acento); }
  @media (hover: hover) { #btn-comprobar:hover { border-color: var(--activo); color: var(--activo); } }
  #btn-comprobar.girando svg { animation: girar .6s ease-in-out; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #btn-comprobar.girando svg { animation: none; } }
  #btn-problemas { border: 1px solid var(--borde); background: #fff; border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: 13.5px; white-space: nowrap; }
  #btn-problemas.mal { border-color: var(--error); color: var(--error); background: var(--error-fondo); font-weight: 600; }
  #btn-problemas.regular { border-color: #e0a800; color: var(--avisoc); background: var(--aviso-fondo); font-weight: 600; }
  #btn-problemas.bien { border-color: var(--bien); color: var(--bien); }

  /* ---------- Inspector (derecha) ---------- */
  #inspector { grid-area: inspector; overflow-y: auto; background: var(--barra); border-left: 1px solid var(--borde); padding: 12px 14px 40px; }
  #inspector h2 { font-size: 18px; margin: 2px 0 4px; display: flex; align-items: center; gap: 8px; }
  #inspector h2 .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--paso); color: #fff; font-size: 14px; flex: none; }
  #inspector h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--texto-suave); margin: 18px 0 6px; }
  #inspector .ayuda { font-size: 13px; color: var(--texto-suave); line-height: 1.4; margin: 4px 0 8px; }
  .fila { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; }
  .fila > label, .fila > .et { font-size: 13.5px; font-weight: 600; }
  .fila.linea { flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
  .fila.linea > label { font-weight: 500; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; min-height: 36px; padding: 6px 9px; border: 1px solid var(--borde); border-radius: 9px; background: #fff;
  }
  textarea { resize: vertical; min-height: 64px; line-height: 1.4; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--activo); outline-offset: -1px; border-color: var(--activo); }
  input.mal { border-color: var(--error); background: var(--error-fondo); }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--activo); }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tres { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .dos label, .tres label { font-size: 12.5px; color: var(--texto-suave); display: flex; flex-direction: column; gap: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 6px; min-height: 34px;
    border: 1px solid var(--borde); border-radius: 999px; background: #fff; cursor: pointer; font-size: 13.5px;
  }
  .chip svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .chip svg .a { fill: var(--acento); }
  .chip[aria-pressed="true"] { border-color: var(--activo); background: var(--activo-fondo); color: var(--activo); font-weight: 600; }
  .chip[aria-pressed="true"] svg .a { fill: var(--acento-activo); }
  .seg { display: inline-flex; border: 1px solid var(--borde); border-radius: 9px; overflow: hidden; }
  .seg button { border: none; background: #fff; padding: 6px 10px; cursor: pointer; font-size: 13.5px; }
  .seg button + button { border-left: 1px solid var(--borde); }
  .seg button[aria-pressed="true"] { background: var(--activo-fondo); color: var(--activo); font-weight: 600; }
  .seg.seg-varias { display: flex; flex-wrap: wrap; width: 100%; }
  .seg.seg-varias button { flex: 1 1 auto; min-height: 34px; }
  .seg.seg-varias button + button { border-left: 1px solid var(--borde); }
  #inspector .ayuda.mal { color: var(--error); font-weight: 600; }
  .margenes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 13.5px; color: var(--texto-suave); margin: 4px 0 10px; font-variant-numeric: tabular-nums; }
  .botones-centrar { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .botones-centrar .btn-texto { display: flex; align-items: center; gap: 8px; justify-content: flex-start; }
  .otro-corte { cursor: pointer; }

  .obj {
    border: 1px solid var(--borde); border-left: 4px solid var(--paso); border-radius: var(--radio);
    padding: 8px 10px 10px; margin: 10px 0; background: #fffdf9;
  }
  .obj-cab { display: flex; align-items: center; gap: 6px; }
  .obj-cab select { flex: 1; font-weight: 600; }
  .obj-cab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .obj-cab svg .a { fill: var(--acento); }
  .mini {
    width: 32px; height: 32px; flex: none; border: 1px solid var(--borde); border-radius: 8px; background: #fff;
    cursor: pointer; display: inline-grid; place-items: center; padding: 0; font-size: 15px; line-height: 1;
  }
  .mini svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mini svg .a { fill: var(--acento); }
  @media (hover: hover) { .mini:hover:not(:disabled) { border-color: var(--activo); color: var(--activo); } }
  .mini:disabled { opacity: .35; cursor: default; }
  .mini.peligro { color: var(--error); }
  .mini[aria-pressed="true"] { background: var(--activo-fondo); border-color: var(--activo); color: var(--activo); }
  .cond { border-top: 1px dashed var(--borde); padding-top: 8px; margin-top: 8px; }
  .cond-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
  .cond-cab .et { font-size: 13.5px; font-weight: 600; flex: 1; }
  .btn-opt { border: 1px solid var(--borde); background: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--texto-suave); white-space: nowrap; }
  .btn-opt[aria-pressed="true"] { background: #eef6ee; border-color: #8cc79a; color: #2c7a43; font-weight: 600; }
  @media (hover: hover) { .btn-opt:hover { border-color: var(--activo); } }
  .marca-opt { margin-left: 6px; font-size: 11.5px; font-weight: 600; color: #2c7a43; background: #eef6ee; border-radius: 999px; padding: 1px 7px; }
  .cond.optativa { border-left: 3px dashed #8cc79a; padding-left: 8px; }
  .tag.tag-opt { background: #eef6ee; color: #2c7a43; font-weight: 600; }
  .cond-cab .ex { font-size: 12px; color: var(--texto-suave); font-weight: 400; }
  .ref { display: flex; gap: 4px; align-items: center; }
  .ref input { flex: 1; min-width: 0; }
  .ref .xy { display: flex; gap: 4px; flex: 1; min-width: 0; }
  .ref .xy input { width: 50%; }
  .lista-ref { display: flex; flex-direction: column; gap: 5px; }
  .lista-ref .par { display: flex; gap: 4px; align-items: center; }
  .lista-ref .par > .ref { flex: 1; min-width: 0; }
  .anadir-cond { display: flex; gap: 6px; margin-top: 10px; }
  .anadir-cond select { flex: 1; }
  .btn-texto {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; min-height: 36px;
    border: 1px solid var(--borde); border-radius: 9px; background: #fff; cursor: pointer; font-size: 14px;
  }
  .btn-texto svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn-texto svg .a { fill: var(--acento); }
  @media (hover: hover) { .btn-texto:hover { border-color: var(--activo); color: var(--activo); } }
  .btn-texto.peligro { color: var(--error); }
  .botonera { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  details.mas { margin-top: 8px; }
  details.mas > summary { cursor: pointer; font-size: 13px; color: var(--activo); font-weight: 600; }
  .vista-tarjeta {
    border: 2px solid var(--activo); border-radius: 14px; padding: 10px 12px; background: #fff;
    box-shadow: 0 6px 18px rgba(47,111,208,.15); margin: 8px 0 4px; font-size: 14.5px; line-height: 1.45;
  }
  .vista-tarjeta .vt-cab { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--activo); font-weight: 700; margin-bottom: 4px; }
  .vista-tarjeta .vt-pista { margin-top: 6px; font-size: 13.5px; color: var(--texto-suave); border-top: 1px dashed var(--borde); padding-top: 6px; }
  .tabla-textos { display: grid; grid-template-columns: 90px 1fr 32px; gap: 6px; align-items: center; }
  .problema { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; margin: 6px 0; cursor: pointer; font-size: 14px; line-height: 1.4; border: 1px solid transparent; text-align: left; width: 100%; }
  .problema.error { background: var(--error-fondo); border-color: #f2c4bf; }
  .problema.aviso { background: var(--aviso-fondo); border-color: #f0dc9c; }
  .problema b { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .problema.error b { color: var(--error); }
  .problema.aviso b { color: var(--avisoc); }
  .vacio-insp { color: var(--texto-suave); font-size: 14px; line-height: 1.5; }

  /* ---------- Ventanas ---------- */
  dialog {
    border: none; border-radius: 16px; padding: 0; width: min(760px, calc(100% - 24px)); max-height: calc(100% - 40px);
    box-shadow: 0 20px 60px rgba(0,0,0,.3); color: var(--texto);
  }
  dialog::backdrop { background: rgba(30, 32, 50, .35); }
  .dlg-cab { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--borde); position: sticky; top: 0; background: #fff; z-index: 1; }
  .dlg-cab h2 { margin: 0; font-size: 19px; }
  .dlg-cuerpo { padding: 12px 16px 18px; }
  .dlg-cuerpo p, .dlg-cuerpo li { line-height: 1.5; }
  #json-texto { width: 100%; min-height: 50vh; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
  .ej-lista { display: flex; flex-direction: column; gap: 6px; }
  .ej-lista button { text-align: left; padding: 9px 12px; border: 1px solid var(--borde); border-radius: 12px; background: #fff; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .ej-lista button small { color: var(--texto-suave); }
  @media (hover: hover) { .ej-lista button:hover { border-color: var(--activo); background: var(--activo-fondo); } }
  pre.cod { background: #faf8f4; border: 1px solid var(--borde); border-radius: 10px; padding: 10px; overflow-x: auto; font-size: 13px; }

  #aviso {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%) translateY(20px);
    background: var(--texto); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14.5px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100% - 24px);
  }
  #aviso.visible { opacity: 1; transform: translateX(-50%); }

  /* ---------- Pantallas estrechas: todo en una columna ---------- */
  @media (max-width: 1000px) {
    html, body { height: auto; }
    #app {
      height: auto; grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto 70vh auto auto;
      grid-template-areas: "cab" "zona" "inspector" "esquema";
    }
    #inspector, #esquema { border: none; border-top: 1px solid var(--borde); overflow: visible; }
    .acciones .btn .txt { display: none; }
  }
</style>
</head>
<body>

/* =====================================================================
   Utilidades
   ===================================================================== */
const U = {
  r3: n => Math.round(n * 1000) / 1000,
  r05: n => Math.round(n * 2) / 2,
  copia: o => JSON.parse(JSON.stringify(o)),
  esObj: v => v !== null && typeof v === 'object' && !Array.isArray(v),
  esCoord: v => U.esObj(v) && Number.isFinite(v.x) && Number.isFinite(v.y),
  num: s => { const n = parseFloat(String(s).replace(',', '.')); return Number.isFinite(n) ? n : null; },
  el(tag, props, ...hijos) {
    const e = document.createElement(tag);
    if (props) for (const k in props) {
      const v = props[k];
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k in e && typeof v !== 'string') e[k] = v;
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const h of hijos.flat()) if (h != null && h !== false) e.append(h);
    return e;
  },
  esc: s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])),
  fmt: n => (Math.round(n * 10) / 10).toLocaleString('es-ES'),
  slug: s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50),
};

/* =====================================================================
   Geometría (mm; y hacia abajo; los arcos guardan a0, a1 en radianes de pantalla)
   ===================================================================== */
const G = {
  DOS_PI: Math.PI * 2,
  dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
  distSeg(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - ax - t * dx, py - ay - t * dy);
  },
  completo: a => Math.abs(a.a1 - a.a0) >= G.DOS_PI - 1e-6,
  enArco(a, t) {
    if (G.completo(a)) return true;
    const lo = Math.min(a.a0, a.a1), hi = Math.max(a.a0, a.a1);
    const u = lo + (((t - lo) % G.DOS_PI) + G.DOS_PI) % G.DOS_PI;
    return u <= hi + 1e-9;
  },
  distArco(px, py, a) {
    const t = Math.atan2(py - a.cy, px - a.cx);
    if (G.enArco(a, t)) return Math.abs(G.dist(px, py, a.cx, a.cy) - a.r);
    const e = [a.a0, a.a1].map(u => ({ x: a.cx + a.r * Math.cos(u), y: a.cy + a.r * Math.sin(u) }));
    return Math.min(...e.map(q => G.dist(px, py, q.x, q.y)));
  },
  distForma(p, f) {
    return f.tipo === 'recta' ? G.distSeg(p.x, p.y, f.x1, f.y1, f.x2, f.y2) : f.tipo === 'arco' ? G.distArco(p.x, p.y, f) : G.dist(p.x, p.y, f.x, f.y);
  },
  // Cortes entre dos rectas (segmentos) o arcos
  cortes(A, B) {
    if (A.tipo === 'arco' && B.tipo === 'recta') return G.cortes(B, A);
    const out = [];
    if (A.tipo === 'recta' && B.tipo === 'recta') {
      const d1x = A.x2 - A.x1, d1y = A.y2 - A.y1, d2x = B.x2 - B.x1, d2y = B.y2 - B.y1;
      const den = d1x * d2y - d1y * d2x;
      if (Math.abs(den) < 1e-9) return out;
      const t = ((B.x1 - A.x1) * d2y - (B.y1 - A.y1) * d2x) / den;
      const u = ((B.x1 - A.x1) * d1y - (B.y1 - A.y1) * d1x) / den;
      if (t >= -1e-6 && t <= 1 + 1e-6 && u >= -1e-6 && u <= 1 + 1e-6) out.push({ x: A.x1 + t * d1x, y: A.y1 + t * d1y });
      return out;
    }
    if (A.tipo === 'recta' && B.tipo === 'arco') {
      const dx = A.x2 - A.x1, dy = A.y2 - A.y1, fx = A.x1 - B.cx, fy = A.y1 - B.cy;
      const a = dx * dx + dy * dy, b = 2 * (fx * dx + fy * dy), c = fx * fx + fy * fy - B.r * B.r;
      const disc = b * b - 4 * a * c;
      if (disc < 0 || !a) return out;
      const s = Math.sqrt(disc);
      for (const t of disc === 0 ? [-b / (2 * a)] : [(-b - s) / (2 * a), (-b + s) / (2 * a)]) {
        if (t < -1e-6 || t > 1 + 1e-6) continue;
        const p = { x: A.x1 + t * dx, y: A.y1 + t * dy };
        if (G.enArco(B, Math.atan2(p.y - B.cy, p.x - B.cx))) out.push(p);
      }
      return out;
    }
    // Arco con arco
    const d = G.dist(A.cx, A.cy, B.cx, B.cy);
    if (d < 1e-9 || d > A.r + B.r + 1e-9 || d < Math.abs(A.r - B.r) - 1e-9) return out;
    const a = (A.r * A.r - B.r * B.r + d * d) / (2 * d), h = Math.sqrt(Math.max(0, A.r * A.r - a * a));
    const mx = A.cx + a * (B.cx - A.cx) / d, my = A.cy + a * (B.cy - A.cy) / d;
    const cands = h < 1e-9 ? [{ x: mx, y: my }] : [
      { x: mx + h * (B.cy - A.cy) / d, y: my - h * (B.cx - A.cx) / d },
      { x: mx - h * (B.cy - A.cy) / d, y: my + h * (B.cx - A.cx) / d },
    ];
    for (const p of cands)
      if (G.enArco(A, Math.atan2(p.y - A.cy, p.x - A.cx)) && G.enArco(B, Math.atan2(p.y - B.cy, p.x - B.cx))) out.push(p);
    return out;
  },
  // Recta larga que pasa por p con dirección ang (rad, pantalla)
  rectaPor(p, ang, L = 90) {
    const c = Math.cos(ang) * L, s = Math.sin(ang) * L;
    return { tipo: 'recta', x1: p.x - c, y1: p.y - s, x2: p.x + c, y2: p.y + s };
  },
  dir: r => Math.atan2(r.y2 - r.y1, r.x2 - r.x1),
};

const CAMPOS_EXTRA = [
