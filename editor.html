/* =====================================================================
   Inspector: propiedades de lo seleccionado
   ===================================================================== */
const Inspector = {
  vivos: [],      // partes del panel que se rehacen tras cada cambio sin repintarlo entero
  pintar() {
    const c = document.getElementById('inspector'), s = Editor.sel;
    const scroll = c.scrollTop;
    c.textContent = '';
    this.vivos = [];
    const f = { ficha: this.ficha, enunciado: this.enunciado, punto: this.punto, recta: this.recta, arco: this.arco,
      instrumentos: this.instrumentos, inst: this.instrumentos, textos: this.textos, final: this.final, paso: this.paso }[s.tipo];
    if (f) f.call(this, c, s);
    // Problemas de lo seleccionado (los del paso van en su sitio, dentro del panel del paso)
    const filtro = {
      ficha: ir => ir.tipo === 'ficha', textos: ir => ir.tipo === 'textos', final: ir => ir.tipo === 'final',
      enunciado: ir => ['punto', 'recta', 'arco'].includes(ir.tipo),
      punto: ir => ir.tipo === 'punto' && ir.i === s.i, recta: ir => ir.tipo === 'recta' && ir.i === s.i, arco: ir => ir.tipo === 'arco' && ir.i === s.i,
    }[s.tipo];
    if (filtro) { const r = this.revisionDe(filtro, s.tipo === 'enunciado'); c.insertBefore(r, c.children[1] || null); }
    c.scrollTop = scroll;
  },
  // Zona que se vuelve a construir con fn(el) después de cada cambio
  vivo(fn, attrs = {}) {
    const el = U.el('div', attrs);
    const hacer = () => { el.textContent = ''; fn(el); };
    hacer();
    this.vivos.push(() => { if (el.isConnected) hacer(); });
    return el;
  },
  actualizarVivos() {
    for (const f of this.vivos) { try { f(); } catch (e) { console.error(e); } }
  },
  // Lista de errores y avisos que cumplen filtro(ir), siempre al día
  revisionDe(filtro, irA = false) {
    return this.vivo(el => {
      const probs = Editor.revision.filter(r => filtro(r.ir));
      if (!probs.length) return;
      el.append(U.el('h3', { text: 'Revisión' }));
      for (const r of probs) el.append(U.el(irA ? 'button' : 'div', { type: irA ? 'button' : undefined, class: 'problema ' + r.nivel, onclick: irA ? () => Editor.seleccionar(r.ir) : undefined },
        U.el('div', null, U.el('b', { text: r.nivel === 'error' ? 'Error' : 'Aviso' }), U.el('div', { text: r.texto }))));
    }, { class: 'revision-viva', 'aria-live': 'polite' });
  },
  // ---------- Piezas ----------
  fila(etiqueta, control, ayuda) {
    const id = 'c' + Math.random().toString(36).slice(2, 8);
    if (control.tagName && ['INPUT', 'SELECT', 'TEXTAREA'].includes(control.tagName)) control.id = id;
    return U.el('div', { class: 'fila' }, U.el('label', { for: id, text: etiqueta }), control, ayuda ? U.el('div', { class: 'ayuda', text: ayuda }) : null);
  },
  texto(obj, k, { area = false, ph = '', clave = '', alCambiar, inspector = false } = {}) {
    const e = U.el(area ? 'textarea' : 'input', { type: area ? undefined : 'text', placeholder: ph });
    e.value = obj[k] == null ? '' : obj[k];
    e.addEventListener('input', () => {
      if (alCambiar) alCambiar(e.value); else obj[k] = e.value;
      Editor.cambio(clave || k, { inspector });
    });
    return e;
  },
  numero(obj, k, { clave, paso = 'any', min, opcional = true, alCambiar } = {}) {
    const e = U.el('input', { type: 'number', step: paso, min, inputmode: 'decimal' });
    e.value = Number.isFinite(obj[k]) ? obj[k] : '';
    e.addEventListener('input', () => {
      const n = U.num(e.value);
      if (n === null) { if (opcional) delete obj[k]; } else obj[k] = n;
      if (alCambiar) alCambiar(n);
      else Editor.cambio(clave || k, { inspector: false });
    });
    return e;
  },
  selector(obj, k, ops, { clave, vacio, alCambiar, inspector = true } = {}) {
    const e = U.el('select');
    if (vacio) e.append(U.el('option', { value: '', text: vacio }));
    for (const [v, t] of ops) e.append(U.el('option', { value: String(v), text: t }));
    e.value = obj[k] === undefined ? '' : String(obj[k]);
    e.addEventListener('change', () => {
      const op = ops.find(o => String(o[0]) === e.value);
      if (!op) delete obj[k]; else obj[k] = op[0];
      if (alCambiar) alCambiar();
      Editor.cambio(clave || k, { inspector });
    });
    return e;
  },
  casilla(obj, k, etiqueta, { alCambiar, inspector = false, quitarSiNo = true } = {}) {
    const e = U.el('input', { type: 'checkbox' });
    e.checked = !!obj[k];
    e.addEventListener('change', () => {
      if (e.checked) obj[k] = true; else if (quitarSiNo) delete obj[k]; else obj[k] = false;
      if (alCambiar) alCambiar(e.checked);
      Editor.cambio(null, { inspector });
    });
    const id = 'c' + Math.random().toString(36).slice(2, 8);
    e.id = id;
    return U.el('div', { class: 'fila linea' }, U.el('label', { for: id, text: etiqueta }), e);
  },
  datalist(id, nombres) {
    let dl = document.getElementById(id);
    if (!dl) { dl = U.el('datalist', { id }); document.body.append(dl); }
    dl.textContent = '';
    for (const [n, info] of nombres) dl.append(U.el('option', { value: n, label: `${info.tipo} · ${info.origen}` }));
    return id;
  },
  // Campo de nombre que renombra las referencias al cambiar
  nombre(obj, k, tipo) {
    const e = U.el('input', { type: 'text', maxlength: 12 });
    e.value = obj[k] || '';
    let previo = obj[k] || '';
    e.addEventListener('input', () => {
      const v = e.value.trim();
      const usado = v && v !== previo && Nombres.todos(Editor.ej).has(v);
      e.classList.toggle('mal', !!usado);
      if (usado) { mensaje(`Ya hay algo que se llama «${v}».`); return; }
      if (v) { Editor.renombrar(previo, v); obj[k] = v; previo = v; } else delete obj[k];
      if (tipo === 'punto' && obj.etiqueta === undefined) { /* la etiqueta es el nombre */ }
      Editor.cambio('nombre', { inspector: false });
    });
    return e;
  },
  btnMini(icono, titulo, alPulsar, { peligro = false, deshab = false, pulsado } = {}) {
    return U.el('button', { type: 'button', class: 'mini' + (peligro ? ' peligro' : ''), title: titulo, 'aria-label': titulo, html: Iconos[icono] || icono, onclick: alPulsar, disabled: deshab, 'aria-pressed': pulsado === undefined ? undefined : String(pulsado) });
  },

  // ---------- Ficha ----------
  ficha(c) {
    const ej = Editor.ej;
    c.append(U.el('h2', { html: 'Ficha del ejercicio' }),
      U.el('p', { class: 'ayuda', text: 'Lo que se ve en la lista de ejercicios de DibuTec.' }));
    const idIn = this.texto(ej, 'id', { ph: U.slug(ej.titulo) || 'mi-ejercicio' });
    c.append(this.fila('Título', this.texto(ej, 'titulo', { alCambiar: v => { ej.titulo = v; idIn.placeholder = U.slug(v) || 'mi-ejercicio'; } })),
      this.fila('Nivel', (() => {
        const e = this.texto(ej, 'nivel', { ph: '1.º ESO' });
        e.setAttribute('list', this.datalist('dl-niveles', [['1.º ESO', { tipo: 'nivel', origen: 'ESO' }], ['2.º ESO', { tipo: 'nivel', origen: 'ESO' }], ['3.º ESO', { tipo: 'nivel', origen: 'ESO' }], ['4.º ESO', { tipo: 'nivel', origen: 'ESO' }]]));
        return e;
      })()),
      this.fila('Descripción', this.texto(ej, 'descripcion', { area: true, ph: 'Texto corto para la lista de ejercicios.' })),
      this.fila('Identificador y nombre del archivo', idIn, `Se guardará como ${Modelo.nombreArchivo()}. Letras, números y guiones; si lo dejas vacío, se saca del título.`));
    // Papel
    c.append(U.el('h3', { text: 'Papel' }));
    const pa = ej.papel;
    const repintarPapel = () => { Vista.ajustar(); };
    c.append(this.fila('Tipo de papel', this.selector(pa, 'papel', [['blanco', 'En blanco'], ['cuadriculado', 'Cuadriculado'], ['milimetrado', 'Milimetrado'], ['isometrico', 'Isométrico']], { vacio: 'El que tenga cada persona', alCambiar: repintarPapel })),

        caja.append(U.el('div', { class: 'xy' },
          this.numero(xy, 'x', { opcional: false, alCambiar: cambiarXY, clave: 'xy' }),
          this.numero(xy, 'y', { opcional: false, alCambiar: cambiarXY, clave: 'xy' })));
        caja.querySelectorAll('input')[0].title = 'x (mm)';
        caja.querySelectorAll('input')[1].title = 'y (mm)';
        caja.append(this.btnMini('cambiar', 'Usar un punto con nombre', () => {
          // Si hay un punto con nombre justo ahí, se usa
          const C = Construccion.calcular(Editor.ej, iPaso - 1);
          let n = '';
          for (const [nm, f] of C.geo) if (f.tipo === 'punto' && disp.has(nm) && G.dist(f.x, f.y, val.x, val.y) < .01) n = nm;
          alCambiar(n); pintar(n);
        }));
      } else {
        const inp = U.el('input', { type: 'text', list: idDl, placeholder: tipo === 'punto' ? 'Nombre del punto' : 'Nombre de la línea', value: typeof val === 'string' ? val : '' });
        comprobar(inp, inp.value);
        inp.addEventListener('input', () => { comprobar(inp, inp.value.trim()); alCambiar(inp.value.trim()); });
        inp.addEventListener('focus', () => { Editor.ultimoCampo = { inp, tipo }; });
        // Tras cualquier cambio (un nombre nuevo, uno cambiado…) se vuelve a comprobar
        this.vivos.push(() => { if (inp.isConnected) { leer(); comprobar(inp, inp.value.trim()); } });
        caja.append(inp);
        if (tipo === 'punto') caja.append(this.btnMini('cambiar', 'Usar coordenadas', () => {
          const C = Construccion.calcular(Editor.ej, iPaso - 1), f = C.geo.get(inp.value.trim());
          const [W, H] = Editor.hoja();
          const nv = f && f.tipo === 'punto' ? { x: U.r3(f.x), y: U.r3(f.y) } : { x: U.r05(W / 2), y: U.r05(H / 2) };
          alCambiar(nv); pintar(nv);
        }));
      }
      caja.append(this.btnMini('elegir', 'Elegir en la hoja', () => {
        Editor.elegir(tipo === 'punto' ? 'punto' : 'linea', nv => {
          Editor.ultimoCambio = { clave: null, t: 0 };   // cada elección, un paso de deshacer
          alCambiar(nv);
          Editor.repintar();
        });
      }));
    };
    pintar(v);
    return caja;
  },
};

/* =====================================================================
   Mensajes
   ===================================================================== */
function mensaje(t) { document.getElementById('mensaje').textContent = t || ''; }
let temporizadorAviso = 0;
function aviso(t) {
  const a = document.getElementById('aviso');
  a.textContent = t;
  a.classList.add('visible');
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(() => a.classList.remove('visible'), 2600);
}

/* =====================================================================
   Entrada: ratón, táctil y teclado
   ===================================================================== */
function iniciarEntrada() {
  const lz = document.getElementById('lienzo'), svg = Vista.svg;
  const punteros = new Map();
  let gesto = null;
  svg.addEventListener('pointerdown', e => {
    if (e.button === 2) return;
    svg.setPointerCapture(e.pointerId);
    punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (punteros.size === 2) {
      // Dos dedos: zoom y desplazamiento
      Editor.arrastre = null;
      const [a, b] = [...punteros.values()];
      gesto = { d: Math.hypot(b.x - a.x, b.y - a.y), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, esc: Vista.esc, m: Vista.aMm((a.x + b.x) / 2, (a.y + b.y) / 2) };
      return;
    }
    if (e.button === 1 || espacio) { Editor.arrastre = { tipo: 'pan', x: e.clientX, y: e.clientY, vx: Vista.x, vy: Vista.y }; lz.classList.add('arrastrando'); return; }
    Editor.arrastre = Editor.alPulsar(e);
    if (Editor.arrastre && Editor.arrastre.tipo !== 'borrador') lz.classList.add('arrastrando');
  });
  svg.addEventListener('pointermove', e => {
    if (punteros.has(e.pointerId)) punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gesto && punteros.size === 2) {
      const [a, b] = [...punteros.values()], t = Vista.tam();
      const d = Math.hypot(b.x - a.x, b.y - a.y), cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      Vista.esc = Math.max(.3, Math.min(40, gesto.esc * d / (gesto.d || 1)));
      Vista.x = gesto.m.x - (cx - t.l) / Vista.esc;
      Vista.y = gesto.m.y - (cy - t.t) / Vista.esc;
      Editor.pintarHoja();
      return;
    }
    if (Editor.arrastre && Editor.arrastre.tipo !== 'borrador') Editor.alArrastrar(Editor.arrastre, e);
    else if (Editor.borrador) Editor.alArrastrar({ tipo: 'borrador' }, e);
    else Editor.alMoverRaton(e);
  });
  const fin = e => {
    punteros.delete(e.pointerId);
    if (gesto) { if (punteros.size < 2) gesto = null; return; }
    lz.classList.remove('arrastrando');
    const a = Editor.arrastre;
    Editor.arrastre = null;
    if (a) Editor.alSoltar(a, e);
  };
  svg.addEventListener('pointerup', fin);
  svg.addEventListener('pointercancel', fin);
  svg.addEventListener('pointerleave', () => { if (!Editor.arrastre) { document.getElementById('coords').textContent = ''; } });
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.ctrlKey || Math.abs(e.deltaY) >= Math.abs(e.deltaX)) Vista.zoom(Math.exp(-e.deltaY * (e.deltaMode ? .05 : .0015)), e.clientX, e.clientY);
    else { Vista.x += e.deltaX / Vista.esc; Editor.pintarHoja(); }
  }, { passive: false });
  svg.addEventListener('contextmenu', e => e.preventDefault());

  let espacio = false;
  const escribiendo = () => { const a = document.activeElement; return a && (['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName) || a.isContentEditable); };
  window.addEventListener('keydown', e => {
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && e.key.toLowerCase() === 's') { e.preventDefault(); Editor.descargar(); return; }
    if (e.key === 'F7') { e.preventDefault(); if (!document.getElementById('dlg').open) Editor.comprobarAhora(); return; }
    if (document.getElementById('dlg').open) return;
    if (ctrl && !escribiendo() && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); Editor.deshacer(); return; }
    if (ctrl && !escribiendo() && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) { e.preventDefault(); Editor.rehacer(); return; }
    if (ctrl && !escribiendo() && e.key.toLowerCase() === 'd' && Editor.sel.tipo === 'paso') { e.preventDefault(); Editor.duplicarPaso(Editor.sel.i); return; }
    if (e.key === 'Escape') {
      if (Editor.eligiendo) Editor.cancelarEleccion();
      else if (Editor.borrador) { Editor.borrador = null; Editor.pintarHoja(); mensaje('Trazo cancelado.'); }
      else if (Editor.herr !== 'sel') Editor.herramienta('sel');
      if (escribiendo()) document.activeElement.blur();
      return;
    }
    if (escribiendo() || ctrl || e.altKey) return;
    if (e.key === ' ') { espacio = true; e.preventDefault(); return; }
    const k = e.key.toLowerCase();
    if (k === 'v') Editor.herramienta('sel');
    else if (k === 'p') Editor.herramienta('punto');
    else if (k === 'r') Editor.herramienta('recta');
    else if (k === 'c') Editor.herramienta('arco');
    else if (k === '+' || k === '=') Vista.zoom(1.25);
    else if (k === '-') Vista.zoom(1 / 1.25);
    else if (k === '0') Vista.ajustar();
    else if ((e.key === 'Delete' || e.key === 'Backspace') && ['punto', 'recta', 'arco', 'inst'].includes(Editor.sel.tipo)) { e.preventDefault(); Editor.eliminarSeleccion(); }
    else if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key) && Editor.sel.tipo === 'final' && Editor.moverLibre) {
      e.preventDefault();
      const d = e.shiftKey ? 10 : 1;
      Encuadre.desplazar(Editor.ej, e.key === 'ArrowLeft' ? -d : e.key === 'ArrowRight' ? d : 0, e.key === 'ArrowUp' ? -d : e.key === 'ArrowDown' ? d : 0);
      Editor.cambio('flechasTodo', { inspector: false });
    }
    else if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key) && Editor.sel.tipo === 'punto') {
      e.preventDefault();
      const q = Editor.ej.inicial.puntos[Editor.sel.i], d = e.shiftKey ? 5 : .5;
      if (e.key === 'ArrowLeft') q.x = U.r3(q.x - d); if (e.key === 'ArrowRight') q.x = U.r3(q.x + d);
      if (e.key === 'ArrowUp') q.y = U.r3(q.y - d); if (e.key === 'ArrowDown') q.y = U.r3(q.y + d);
      Editor.cambio('flechas', { inspector: true });
    }
  });
  window.addEventListener('keyup', e => { if (e.key === ' ') espacio = false; });

  // Abrir archivos: botón y arrastrar sobre la ventana
  const abrirArchivo = f => {
    if (!f) return;
    if (f.size > 5e6) { aviso('Ese archivo es demasiado grande.'); return; }
    f.text().then(t => Editor.abrirTexto(t, f.name));
  };
  document.getElementById('abrir-archivo').addEventListener('change', e => { abrirArchivo(e.target.files && e.target.files[0]); e.target.value = ''; });
  window.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    e.preventDefault();
    abrirArchivo(f);
  });
  document.getElementById('btn-problemas').addEventListener('click', () => Editor.mostrarProblemas());
  const bc = document.getElementById('btn-comprobar');
  bc.innerHTML = Iconos.comprobar + '<span>Comprobar</span>';
  bc.setAttribute('aria-label', 'Comprobar ahora todos los errores y avisos');
  bc.addEventListener('click', () => Editor.comprobarAhora());
  document.getElementById('dlg-cerrar').addEventListener('click', () => Editor.cerrarDialogo());
  new ResizeObserver(() => Editor.pintarHoja()).observe(lz);
}

/* =====================================================================
   Arranque
   ===================================================================== */
function iniciar() {
  Vista.svg = document.getElementById('hoja');
  Barra.construir();
  iniciarEntrada();
  // ¿Se pide un ejercicio por la dirección? editor.html?ejercicio=ejercicios/mediatriz.json
  const ruta = new URLSearchParams(location.search).get('ejercicio');
  let borrador = null;
  try { borrador = JSON.parse(localStorage.getItem(Editor.CLAVE)); } catch (_) { borrador = null; }
  if (borrador && borrador.formato === 'dibutec-ejercicio' && Array.isArray(borrador.pasos)) {
    Editor.abrir(borrador, { avisar: false });
    mensaje(`Sigues con «${borrador.titulo || 'el ejercicio'}» donde lo dejaste. Pulsa ? para ver cómo se usa.`);
  } else {
    Editor.abrir(Modelo.nuevo(), { avisar: false });
    mensaje('Empieza por la ficha, dibuja el enunciado en la hoja y añade los pasos. Pulsa ? para ver cómo se usa.');
  }
  if (ruta && /^[\w./-]+\.json$/.test(ruta) && !ruta.includes('..') && !ruta.startsWith('/')) {
    fetch(ruta, { cache: 'no-cache' }).then(r => r.text()).then(t => Editor.abrirTexto(t, ruta))
      .catch(() => aviso('No se ha podido abrir el ejercicio indicado en la dirección.'));
  }
  Editor.herramienta('sel');
  requestAnimationFrame(() => Vista.ajustar());
}

window.Editor = { Editor, Modelo, Revision, Construccion, Vista, Nombres, bonito };
iniciar();
</script>
