  ['toleranciaGrados', 'num', 'Tolerancia (°)', 'Margen de error de los ángulos. Por defecto, 1°.'],
  ['permitirDados', 'bool', 'Vale lo del enunciado', 'También cuentan los elementos que ya están dibujados.'],
];
// Claves cuyos valores son referencias a elementos (para renombrar y revisar)
const CLAVES_NO_REF = new Set(['tipo', 'instrumento', 'apoyadoEn', 'sentido', 'nombrar', 'opcionales']);

/* =====================================================================
   Modelo: el ejercicio tal como se guarda, con los objetivos siempre en lista
   ===================================================================== */
const Modelo = {
  ej: null,
  nuevo() {
    return this.normalizar({
      formato: 'dibutec-ejercicio', version: 1, id: '', titulo: 'Ejercicio nuevo', nivel: '1.º ESO', descripcion: '',
      papel: { papel: 'blanco', hoja: 'A4-h' },
      inicial: { puntos: [], rectas: [], arcos: [] },
      pasos: [{ texto: '', objetivo: { tipo: 'punto' } }],
      final: '¡Muy bien! Has terminado el ejercicio.',
    });
  },
  normalizar(d) {
    const e = U.copia(d);
    e.formato = 'dibutec-ejercicio';
    if (!U.esObj(e.inicial)) e.inicial = {};
    for (const k of ['puntos', 'rectas', 'arcos']) if (!Array.isArray(e.inicial[k])) e.inicial[k] = [];
    if (!U.esObj(e.papel)) e.papel = {};
    if (!U.esObj(e.textos)) e.textos = {};
    if (!U.esObj(e.instrumentos)) e.instrumentos = {};
    if (!Array.isArray(e.pasos)) e.pasos = [];
    e.pasos = e.pasos.map(p => {
      const q = U.esObj(p) ? p : { texto: '' };
      const objs = Array.isArray(q.objetivos) ? q.objetivos : q.objetivo ? [q.objetivo] : [];
      q._enLista = '_enLista' in q ? !!q._enLista : Array.isArray(q.objetivos);
      delete q.objetivo;
      q.objetivos = objs.filter(U.esObj);
      if (typeof q.texto !== 'string') q.texto = '';
      return q;
    });
    return e;
  },
  // Archivo final con las claves en un orden cómodo de leer
  exportar(e = this.ej) {
    const o = {};
    const orden = ['formato', 'version', 'id', 'titulo', 'nivel', 'descripcion', 'papel', 'inicial', 'instrumentos', 'textos', 'pasos', 'final'];
    const poner = (k, v) => {
      if (v === undefined || v === null) return;
      if (typeof v === 'string' && !v.trim() && !['titulo'].includes(k)) return;
      if (U.esObj(v) && !Object.keys(v).length) return;
      o[k] = v;
    };
    for (const k of orden) {
      if (k === 'version') { o.version = e.version || 1; continue; }
      if (k === 'id') { o.id = e.id || U.slug(e.titulo) || 'ejercicio'; continue; }
      if (k === 'inicial') {
        const ini = {};
        for (const t of ['puntos', 'rectas', 'arcos']) if (e.inicial[t].length) ini[t] = e.inicial[t];
        for (const t in e.inicial) if (!['puntos', 'rectas', 'arcos'].includes(t)) ini[t] = e.inicial[t];
        poner(k, ini);
      } else if (k === 'pasos') {
        o.pasos = e.pasos.map(p => {
          const q = {};
          for (const c of ['texto', 'pista', 'herramientas']) if (p[c] !== undefined && !(c === 'pista' && !p.pista) && !(c === 'herramientas' && !p.herramientas.length)) q[c] = p[c];
          if (p.objetivos.length === 1 && !p._enLista) q.objetivo = p.objetivos[0];
          else q.objetivos = p.objetivos;
          for (const c in p) if (!(c in q) && !['objetivos', '_enLista', 'pista', 'herramientas'].includes(c)) q[c] = p[c];
          return q;
        });
      } else poner(k, e[k]);
    }
    for (const k in e) if (!(k in o) && !orden.includes(k) && !k.startsWith('_')) o[k] = e[k];
    return o;
  },
  texto(e) { return bonito(this.exportar(e)) + '\n'; },
  nombreArchivo() { return (this.ej.id || U.slug(this.ej.titulo) || 'ejercicio') + '.json'; },
};

// JSON legible, con el mismo estilo que los ejercicios de la carpeta
function plano(x) {
  if (Array.isArray(x)) return x.length ? '[' + x.map(plano).join(', ') + ']' : '[]';
  if (U.esObj(x)) { const k = Object.keys(x); return k.length ? '{ ' + k.map(c => JSON.stringify(c) + ': ' + plano(x[c])).join(', ') + ' }' : '{}'; }
  return JSON.stringify(x);
}
function bonito(v, sangria = '', clave = '') {
  const s2 = sangria + '  ';
  const lineas = (pares, abre, cierra) => pares.length ? abre + '\n' + pares.map(t => s2 + t).join(',\n') + '\n' + sangria + cierra : abre + cierra;
  const objeto = (o, f) => lineas(Object.keys(o).map(k => JSON.stringify(k) + ': ' + f(o[k], k)), '{', '}');
  if (!sangria) return objeto(v, (x, k) => bonito(x, s2, k));
  if (clave === 'inicial' && U.esObj(v)) return objeto(v, x => Array.isArray(x) ? lineas(x.map(plano), '[', ']').replace(/\n/g, '\n  ') : plano(x));
  if (clave === 'textos' && U.esObj(v) && Object.keys(v).length > 1) return objeto(v, plano);
  if (clave === 'pasos' && Array.isArray(v)) {
    // Cada paso, con sus claves una por línea; cada objetivo, en una sola línea
    const sp = s2 + '  ', so = sp + '  ';
    return lineas(v.map(p => !U.esObj(p) ? plano(p) : '{\n' + Object.keys(p).map(k => {
      const x = p[k];
      const t = k === 'objetivo' ? objetivoBonito(x, sp)
        : k === 'objetivos' && Array.isArray(x) ? (x.length ? '[\n' + x.map(o => so + objetivoBonito(o, so)).join(',\n') + '\n' + sp + ']' : '[]')
        : plano(x);
      return sp + JSON.stringify(k) + ': ' + t;
    }).join(',\n') + '\n' + s2 + '}'), '[', ']');
  }
  const p = plano(v);
  if (typeof v !== 'object' || v === null || sangria.length + clave.length + p.length <= 118) return p;
  return Array.isArray(v) ? lineas(v.map(x => bonito(x, s2)), '[', ']') : objeto(v, (x, k) => bonito(x, s2, k));
}
// Un objetivo, en una línea; si es muy largo, sus listas largas van una por línea
function objetivoBonito(o, sangria) {
  const p = plano(o);
  const larga = v => Array.isArray(v) && v.length > 1 && v.every(Array.isArray);   // varios segmentos
  if (!U.esObj(o) || (p.length + sangria.length <= 200 && !Object.values(o).some(larga))) return p;
  return '{ ' + Object.keys(o).map(k => {
    const v = o[k];
    if (larga(v) || (Array.isArray(v) && v.length > 1 && plano(v).length > 80))
      return JSON.stringify(k) + ': [\n' + v.map(x => sangria + '  ' + plano(x)).join(',\n') + '\n' + sangria + ']';
    return JSON.stringify(k) + ': ' + plano(v);
  }).join(', ') + ' }';
}

/* =====================================================================
   Construcción esperada: dónde estarán los elementos que nombra cada paso
   ===================================================================== */
const Construccion = {
  // Devuelve { geo: Map(nombre -> forma), fantasmas: [{forma, paso, etiqueta}], tipos: Map(nombre -> tipo) }
  calcular(ej, hasta) {
    const geo = this.geo = new Map(), fantasmas = [];
    this.tam = HOJAS[ej.papel && ej.papel.hoja] || HOJAS['A4-h'];
    const pt = ref => {
      if (U.esCoord(ref)) return { tipo: 'punto', x: ref.x, y: ref.y };
      const g = typeof ref === 'string' ? geo.get(ref) : null;
      return g && g.tipo === 'punto' ? g : null;
    };
    const lin = ref => { const g = typeof ref === 'string' ? geo.get(ref) : null; return g && g.tipo !== 'punto' ? g : null; };
    // Enunciado
    for (const p of ej.inicial.puntos) {
      if (!p || !Number.isFinite(p.x) || !Number.isFinite(p.y)) continue;
      const n = p.nombre || p.etiqueta;
      if (n) geo.set(n, { tipo: 'punto', x: p.x, y: p.y, dado: true });
    }
    for (const r of ej.inicial.rectas) {
      const f = this.rectaInicial(r, pt);
      if (f && r.nombre) geo.set(r.nombre, f);
    }
    for (const c of ej.inicial.arcos) {
      const f = this.arcoInicial(c, pt);
      if (f && c.nombre) geo.set(c.nombre, f);
    }
    const n = Math.min(hasta, ej.pasos.length - 1);
    for (let i = 0; i <= n; i++) {
      const nuevos = [];
      for (const o of ej.pasos[i].objetivos) {
        const r = this.objetivo(o, pt, lin);
        for (const f of r.formas) fantasmas.push({ forma: f, paso: i, objetivo: o });
        const noms = o.nombrar === undefined ? [] : [].concat(o.nombrar);
        noms.forEach((nm, k) => { if (typeof nm === 'string' && r.nombrables[k]) nuevos.push([nm, r.nombrables[k]]); });
        if (r.nombrables.length && OBJ[o.tipo] && OBJ[o.tipo].crea === 'punto')
          r.nombrables.forEach((f, k) => fantasmas.push({ forma: f, paso: i, etiqueta: noms[k] }));
      }
      // Los nombres de un paso solo se pueden usar en los siguientes
      for (const [nm, f] of nuevos) geo.set(nm, Object.assign({}, f, { paso: i, nombre: nm }));
    }
    return { geo, fantasmas };
  },
  rectaInicial(r, pt) {
    if (!r) return null;
    const a = pt(r.desde) || (Number.isFinite(r.x1) && Number.isFinite(r.y1) ? { x: r.x1, y: r.y1 } : null);
    const b = pt(r.hasta) || (Number.isFinite(r.x2) && Number.isFinite(r.y2) ? { x: r.x2, y: r.y2 } : null);
    return a && b ? { tipo: 'recta', x1: a.x, y1: a.y, x2: b.x, y2: b.y, dado: true } : null;
  },
  arcoInicial(c, pt) {
    if (!c) return null;
    const o = pt(c.centro) || (Number.isFinite(c.cx) && Number.isFinite(c.cy) ? { x: c.cx, y: c.cy } : null);
    if (!o || !Number.isFinite(c.radio) || c.radio <= 0) return null;
    const g0 = Number.isFinite(c.desde) ? c.desde : 0, g1 = Number.isFinite(c.hasta) ? c.hasta : g0 + 360;
    return { tipo: 'arco', cx: o.x, cy: o.y, r: c.radio, a0: -g0 * Math.PI / 180, a1: -g1 * Math.PI / 180, dado: true };
  },
  circ: (c, r) => ({ tipo: 'arco', cx: c.x, cy: c.y, r, a0: 0, a1: G.DOS_PI }),
  // De varias direcciones (rad), la de la semirrecta desde p que más recorre dentro de la hoja
  mejorSentido(p, dirs, largo) {
    const [W, H] = this.tam || HOJAS['A4-h'], m = 8;
    const dentro = t => {
      let s = 0;
      for (; s <= largo; s += 2) {
        const x = p.x + Math.cos(t) * s, y = p.y + Math.sin(t) * s;
        if (x < m || y < m || x > W - m || y > H - m) break;
      }
      return Math.min(s, largo);
    };
    let mejor = dirs[0], dm = -1;
    for (const t of dirs) { const d = dentro(t); if (d > dm + .5) { dm = d; mejor = t; } }
    return mejor;
  },
  // Formas que se dibujan para un objetivo y elementos a los que se pondrá nombre
  objetivo(o, pt, lin) {
    const formas = [], nombrables = [], geo = this.geo || new Map();
    switch (o.tipo) {
      case 'punto': {
        let cand = null;
        if (o.cerca !== undefined && pt(o.cerca)) cand = [pt(o.cerca)];
        else if (Array.isArray(o.cruce) && lin(o.cruce[0]) && lin(o.cruce[1])) cand = G.cortes(lin(o.cruce[0]), lin(o.cruce[1]));
        else if (o.angulo && pt(o.angulo.vertice) && pt(o.angulo.desde) && Number.isFinite(o.angulo.grados)) {
          const V = pt(o.angulo.vertice), H = pt(o.angulo.desde);
          const base = Math.atan2(-(H.y - V.y), H.x - V.x) * 180 / Math.PI;
          const signos = o.angulo.sentido === 'horario' ? [-1] : o.angulo.sentido === 'antihorario' ? [1] : [1, -1];
          const d = o.distancia && pt(o.distancia.de) && Number.isFinite(o.distancia.mm) ? o.distancia : null;
          cand = [];
          for (const s of signos) {
            const g = (base + s * o.angulo.grados) * Math.PI / 180;
            const ux = Math.cos(g), uy = -Math.sin(g);
            if (d && G.dist(pt(d.de).x, pt(d.de).y, V.x, V.y) < 1e-6) cand.push({ x: V.x + ux * d.mm, y: V.y + uy * d.mm });
            else {
              formas.push({ tipo: 'recta', x1: V.x, y1: V.y, x2: V.x + ux * 90, y2: V.y + uy * 90, guia: true });
              // Sin distancia: en el borde del transportador (65 mm), como al marcarlo en DibuTec
              if (s === signos[0]) cand.push({ x: V.x + ux * 65, y: V.y + uy * 65 });
            }
          }
          if (!cand.length) cand = null;
        } else if (o.sobre !== undefined && lin(o.sobre) && o.distancia && pt(o.distancia.de) && Number.isFinite(o.distancia.mm)) {
          cand = G.cortes(lin(o.sobre), this.circ(pt(o.distancia.de), o.distancia.mm));
        } else if (o.distancia && pt(o.distancia.de) && Number.isFinite(o.distancia.mm)) {
          formas.push(Object.assign(this.circ(pt(o.distancia.de), o.distancia.mm), { guia: true }));
        }
        const ref = U.esCoord(o.corte) ? o.corte : null;
        if (cand && o.cruce !== undefined && ref && cand.length > 1) {
          // El autor ha elegido uno de los cortes: va primero el más cercano a ese sitio
          cand = cand.slice().sort((a, b) => G.dist(a.x, a.y, ref.x, ref.y) - G.dist(b.x, b.y, ref.x, ref.y));
        } else if (cand && o.cruce !== undefined) {
          // En un cruce se prefieren los cortes que cumplen las demás condiciones y los puntos nuevos
          const tol = Number.isFinite(o.tolerancia) ? o.tolerancia : 1;
          const existe = q => [...geo.values()].some(f => f.tipo === 'punto' && G.dist(f.x, f.y, q.x, q.y) < .5);
          const desvio = q => {
            let d = 0;
            if (o.distancia && pt(o.distancia.de) && Number.isFinite(o.distancia.mm)) d += Math.abs(G.dist(q.x, q.y, pt(o.distancia.de).x, pt(o.distancia.de).y) - o.distancia.mm);
            if (o.cerca !== undefined && pt(o.cerca)) d += G.dist(q.x, q.y, pt(o.cerca).x, pt(o.cerca).y);
            if (o.sobre !== undefined && lin(o.sobre)) d += G.distForma(q, lin(o.sobre));
            return d;
          };
          const clave = q => [desvio(q) > tol ? 1 : 0, existe(q) ? 1 : 0, desvio(q)];
          cand = cand.map(q => [clave(q), q]).sort((a, b) => a[0][0] - b[0][0] || a[0][1] - b[0][1] || a[0][2] - b[0][2]).map(x => x[1]);
        }
        if (cand) {
          const k = Number.isInteger(o.cantidad) && o.cantidad > 0 ? o.cantidad : 1;
          cand.slice(0, k).forEach(p => nombrables.push({ tipo: 'punto', x: p.x, y: p.y }));
          // Los demás cortes se marcan para poder elegirlos en la hoja
          if (o.cruce !== undefined) cand.slice(k).forEach(p => formas.push({ tipo: 'otroCorte', x: p.x, y: p.y }));
        }
        break;
      }
      case 'recta': {
        const a = pt(o.desde), b = pt(o.hasta), pp = [].concat(o.pasaPor || []).map(pt).filter(Boolean);
        let f = null;
        if (a && b) f = { tipo: 'recta', x1: a.x, y1: a.y, x2: b.x, y2: b.y };
        else if (pp.length >= 2) {
          const [p, q] = pp, d = G.dist(p.x, p.y, q.x, q.y) || 1, e = 15 / d;
          f = { tipo: 'recta', x1: p.x - (q.x - p.x) * e, y1: p.y - (q.y - p.y) * e, x2: q.x + (q.x - p.x) * e, y2: q.y + (q.y - p.y) * e };
        } else {
          const p = a || b || pp[0];
          let angs = null;
          const L = k => { const g = lin(k); return g && g.tipo === 'recta' ? g : null; };
          if (L(o.paralelaA)) angs = [G.dir(L(o.paralelaA))];
          else if (L(o.perpendicularA)) angs = [G.dir(L(o.perpendicularA)) + Math.PI / 2];
          else if (o.angulo && L(o.angulo.con) && Number.isFinite(o.angulo.grados)) {
            // DibuTec acepta el ángulo hacia cualquiera de los dos lados
            const base = G.dir(L(o.angulo.con)), g = o.angulo.grados * Math.PI / 180;
            angs = [base - g, base + g];
          }
          if (p && angs) {
            if ((a || b) && !pp.length) {
              // Solo un extremo: una semirrecta, hacia el lado que mejor cabe en la hoja
              const largo = Number.isFinite(o.longitudMin) ? Math.max(o.longitudMin, 40) : 90;
              const dirs = angs.concat(angs.map(t => t + Math.PI));
              const t = this.mejorSentido(p, dirs, largo);
              const q = { x: p.x + Math.cos(t) * largo, y: p.y + Math.sin(t) * largo };
              f = a ? { tipo: 'recta', x1: p.x, y1: p.y, x2: q.x, y2: q.y } : { tipo: 'recta', x1: q.x, y1: q.y, x2: p.x, y2: p.y };
            } else {
              // Recta de largo libre: en la hoja se dibuja larga, pero solo ocupa sitio cerca de su punto
              f = G.rectaPor(p, angs[0]);
              const m = Number.isFinite(o.longitudMin) ? o.longitudMin / 2 : 0, c = Math.cos(angs[0]) * m, sn = Math.sin(angs[0]) * m;
              f.ocupa = [{ x: p.x - c, y: p.y - sn }, { x: p.x + c, y: p.y + sn }];
            }
          }
        }
        if (f) { formas.push(f); nombrables.push(f); }
        break;
      }
      case 'arco': {
        const c = pt(o.centro);
        let r = null, aprox = false;
        if (Number.isFinite(o.radio)) r = o.radio;
        else if (Array.isArray(o.radioComo)) {
          // Abertura igual a la distancia entre dos puntos
          const p1 = pt(o.radioComo[0]), p2 = pt(o.radioComo[1]);
          if (p1 && p2) r = G.dist(p1.x, p1.y, p2.x, p2.y);
        } else if (o.radioComo !== undefined && lin(o.radioComo) && lin(o.radioComo).tipo === 'arco') { r = lin(o.radioComo).r; aprox = !!lin(o.radioComo).aprox; }
        else if (U.esObj(o.radio)) {
          const mn = o.radio.min, mx = o.radio.max;
          r = Number.isFinite(mn) && Number.isFinite(mx) ? (mn + mx) / 2 : Number.isFinite(mn) ? mn + 10 : Number.isFinite(mx) ? mx * .8 : null;
          aprox = true;
        } else if (c && o.pasaPor !== undefined && pt([].concat(o.pasaPor)[0])) {
          const q = pt([].concat(o.pasaPor)[0]); r = G.dist(c.x, c.y, q.x, q.y);
        }
        if (c && !(r > 0)) { r = 50; aprox = true; }   // sin radio fijo: uno orientativo
        if (c && r > 0) {
          const f = Object.assign(this.circ(c, r), { aprox });
          nombrables.push(f);
          // Si tiene que cortar a algo, se dibuja solo un trozo de arco en cada corte (como se traza a mano)
          const cortes = o.completo ? [] : [].concat(o.cortaA || []).flatMap((x, ix) => {
            const l = lin(typeof x === 'string' ? x : x && x.elemento);
            if (!l) return [];
            let cs = G.cortes(f, l);
            const uno = !(x && x.cortes > 1);
            // Un solo corte y dos posibles: el elegido o, si no hay, los dos (tocando uno se elige)
            const lado = uno && cs.length > 1 && x && U.esCoord(x.corte) ? Cortes.porLado(cs, x.corte, r) : null;
            if (lado) cs = [lado];
            else if (uno && cs.length > 1) cs = cs.map(q => Object.assign(q, { eleccion: ix }));
            return cs;
          });
          if (cortes.length) {
            const medio = Math.min(Math.PI / 3, Math.max(14 / r, Number.isFinite(o.barridoMin) ? o.barridoMin * Math.PI / 360 : 0));
            for (const q of cortes) {
              const t = Math.atan2(q.y - c.y, q.x - c.x);
              formas.push(Object.assign({ tipo: 'arco', cx: c.x, cy: c.y, r, a0: t - medio, a1: t + medio, aprox },
                q.eleccion !== undefined ? { eleccion: q.eleccion, corte: { x: q.x, y: q.y } } : {}));
            }
            const t0 = Math.atan2(cortes[0].y - c.y, cortes[0].x - c.x) - medio;
            f.etq = { x: c.x + r * Math.cos(t0), y: c.y + r * Math.sin(t0) };
          } else formas.push(f);
        }
        break;
      }
      case 'rectas': {
        const refs = Array.isArray(o.poligono) ? o.poligono : null;
        const segs = refs ? refs.map((r, i) => [r, refs[(i + 1) % refs.length]]).slice(0, o.cerrado === false ? refs.length - 1 : refs.length)
          : Array.isArray(o.segmentos) ? o.segmentos : [];
        for (const s of segs) {
          const a = pt(s && s[0]), b = pt(s && s[1]);
          if (a && b) formas.push({ tipo: 'recta', x1: a.x, y1: a.y, x2: b.x, y2: b.y });
        }
        break;
      }
      case 'vertices': {
        const L = lin(o.circunferencia), P0 = pt(o.desde), n = o.lados;
        if (L && L.tipo === 'arco' && P0 && Number.isInteger(n) && n >= 3) {
          const a0 = Math.atan2(P0.y - L.cy, P0.x - L.cx);
          for (let k = 0; k < n; k++) {
            const t = a0 + k * G.DOS_PI / n;
            nombrables.push({ tipo: 'punto', x: L.cx + L.r * Math.cos(t), y: L.cy + L.r * Math.sin(t) });
          }
        }
        break;
      }
      case 'instrumento': {
        const pp = [].concat(o.cantoPasaPor || []).map(pt).filter(Boolean);
        if (pp.length >= 2) {
          const [p, q] = pp, d = G.dist(p.x, p.y, q.x, q.y) || 1, e = 20 / d;
          formas.push({ tipo: 'recta', x1: p.x - (q.x - p.x) * e, y1: p.y - (q.y - p.y) * e, x2: q.x + (q.x - p.x) * e, y2: q.y + (q.y - p.y) * e, guia: true });
        }
        if (o.origenEn !== undefined && pt(o.origenEn)) formas.push({ tipo: 'diana', x: pt(o.origenEn).x, y: pt(o.origenEn).y });
        break;
      }
    }
    return { formas, nombrables };
  },
};

/* =====================================================================
   Nombres disponibles en cada paso y revisión del ejercicio
   ===================================================================== */
const Nombres = {
  // Nombres que existen antes de empezar el paso i (i = −1: solo el enunciado)
  disponibles(ej, i) {
    const m = new Map();
    for (const p of ej.inicial.puntos) { const n = p && (p.nombre || p.etiqueta); if (n) m.set(n, { tipo: 'punto', origen: 'enunciado' }); }
    for (const r of ej.inicial.rectas) if (r && r.nombre) m.set(r.nombre, { tipo: 'recta', origen: 'enunciado' });
    for (const c of ej.inicial.arcos) if (c && c.nombre) m.set(c.nombre, { tipo: 'arco', origen: 'enunciado' });
    for (let k = 0; k < Math.min(i, ej.pasos.length); k++)
      for (const o of ej.pasos[k].objetivos) {
        const t = OBJ[o.tipo] && OBJ[o.tipo].crea;
        if (!t || o.nombrar === undefined) continue;
        for (const n of [].concat(o.nombrar)) if (typeof n === 'string' && n) m.set(n, { tipo: t, origen: `paso ${k + 1}` });
      }
    return m;
  },
  todos(ej) { return this.disponibles(ej, ej.pasos.length); },
  // El siguiente nombre libre de la misma serie: c1 → c2, P4 → P5, arcoA → arcoA2
  enSerie(ej, nombre, ocupados = new Set()) {
    const usados = this.todos(ej), m = /^(.*?)(\d+)$/.exec(nombre);
    const base = m ? m[1] : nombre;
    for (let k = m ? +m[2] + 1 : 2; ; k++) { const n = base + k; if (!usados.has(n) && !ocupados.has(n)) return n; }
  },
  // Pone a los objetivos copiados los siguientes nombres de su serie; devuelve los cambios («c1 → c2»)
  renombrarCopia(ej, objetivos) {
    const ocupados = new Set(), cambios = [];
    for (const o of objetivos) {
      if (o.nombrar === undefined) continue;
      const nuevos = [].concat(o.nombrar).map(n => {
        if (typeof n !== 'string' || !n) return n;
        const s = this.enSerie(ej, n, ocupados);
        ocupados.add(s); cambios.push(`${n} → ${s}`);
        return s;
      });
      o.nombrar = Array.isArray(o.nombrar) ? nuevos : nuevos[0];
    }
    return cambios;
  },
  siguiente(ej, tipo) {
    const usados = this.todos(ej);
    if (tipo === 'punto') {
      for (let v = 0; ; v++) for (const L of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') { const n = v ? L + v : L; if (!usados.has(n)) return n; }
    }
    const base = tipo === 'recta' ? ['r', 's', 't', 'u', 'v', 'w'] : ['c', 'd', 'e', 'f'];
    for (let v = 0; ; v++) for (const L of base) { const n = v ? L + v : L; if (!usados.has(n)) return n; }
  },
};

/* =====================================================================
   Cortes de un objetivo «En el cruce de» y encuadre del ejercicio en la hoja
   ===================================================================== */
const Cortes = {
  // Puntos donde se cortan las dos líneas del cruce, según la construcción hasta el paso anterior
  de(ej, i, o) {
    if (!Array.isArray(o.cruce)) return [];
    const { geo } = Construccion.calcular(ej, i - 1);
    const lin = r => (typeof r === 'string' && geo.get(r) && geo.get(r).tipo !== 'punto' ? geo.get(r) : null);
    const A = lin(o.cruce[0]), B = lin(o.cruce[1]);
    if (!A || !B) return [];
    const cs = G.cortes(A, B);
    // Nombre de un punto que ya está en ese sitio, si lo hay
    for (const q of cs) for (const [n, f] of geo) if (f.tipo === 'punto' && G.dist(f.x, f.y, q.x, q.y) < .5) { q.en = n; break; }
    return cs;
  },
  // De los cortes de un arco de radio r, el más cercano al sitio elegido, como lo comprueba DibuTec.
  // Si los dos quedan casi igual de cerca, el sitio no distingue: null.
  porLado(cs, ref, r) {
    const orden = cs.map(q => [G.dist(q.x, q.y, ref.x, ref.y), q]).sort((a, b) => a[0] - b[0]);
    return orden.length > 1 && orden[1][0] - orden[0][0] < Math.max(3, (r || 0) / 4) ? null : orden[0][1];
  },
  masCercano(cs, ref) { return cs.reduce((m, q) => (G.dist(q.x, q.y, ref.x, ref.y) < G.dist(m.x, m.y, ref.x, ref.y) ? q : m), cs[0]); },
  // Cómo se llama cada corte: «El de la izquierda», «El de arriba»…
  nombres(cs) {
    if (cs.length !== 2) return cs.map((q, k) => `Corte ${k + 1}`);
    const [a, b] = cs, dx = b.x - a.x, dy = b.y - a.y;
    const n = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? ['El de la izquierda', 'El de la derecha'] : ['El de la derecha', 'El de la izquierda'])
      : (dy > 0 ? ['El de arriba', 'El de abajo'] : ['El de abajo', 'El de arriba']);
    return n.map((t, k) => cs[k].en ? `${t} (en ${cs[k].en})` : t);
  },
  elegir(o, q) { o.corte = { x: Math.round(q.x * 10) / 10, y: Math.round(q.y * 10) / 10 }; },
  // «Corta a» de un arco: dónde puede cortar su circunferencia a la línea ix
  deArco(ej, i, o, ix) {
    const x = [].concat(o.cortaA || [])[ix];
    const { geo } = Construccion.calcular(ej, i - 1);
    const pt = r => { if (U.esCoord(r)) return { tipo: 'punto', x: r.x, y: r.y }; const g = typeof r === 'string' ? geo.get(r) : null; return g && g.tipo === 'punto' ? g : null; };
    const lin = r => (typeof r === 'string' && geo.get(r) && geo.get(r).tipo !== 'punto' ? geo.get(r) : null);
    const f = Construccion.objetivo(o, pt, lin).nombrables[0], l = lin(typeof x === 'string' ? x : x && x.elemento);
    if (!f || !l) return [];
    const cs = G.cortes(f, l);
    for (const q of cs) for (const [n, g] of geo) if (g.tipo === 'punto' && G.dist(g.x, g.y, q.x, q.y) < .5) { q.en = n; break; }
    cs.radio = f.r;
    return cs;
  },
  elegirArco(o, ix, q) {
    const l = [].concat(o.cortaA || []), x = l[ix];
    const e = U.esObj(x) ? Object.assign({}, x) : { elemento: x };
    if (q) e.corte = { x: Math.round(q.x * 10) / 10, y: Math.round(q.y * 10) / 10 }; else delete e.corte;
    l[ix] = e.cortes > 1 || e.corte ? e : e.elemento;
    o.cortaA = l;
  },
};

const Encuadre = {
  // Rectángulo que ocupa el dibujo completo (enunciado y solución), sin los instrumentos
  caja(ej) {
    const C = Construccion.calcular(ej, ej.pasos.length - 1);
    const pt = r => U.esCoord(r) ? r : (C.geo.get(r) && C.geo.get(r).tipo === 'punto' ? C.geo.get(r) : null);
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const meter = (x, y) => { if (!Number.isFinite(x) || !Number.isFinite(y)) return; x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
    const forma = f => {
      if (!f) return;
      if (f.aprox) { meter(f.cx, f.cy); return; }   // radio libre: su tamaño real no se sabe
      if (f.tipo === 'punto') meter(f.x, f.y);
      else if (f.tipo === 'recta' && f.ocupa) f.ocupa.forEach(q => meter(q.x, q.y));
      else if (f.tipo === 'recta') { meter(f.x1, f.y1); meter(f.x2, f.y2); }
      else if (f.tipo === 'arco') {
        if (G.completo(f)) { meter(f.cx - f.r, f.cy - f.r); meter(f.cx + f.r, f.cy + f.r); return; }
        for (let k = 0; k <= 48; k++) { const t = f.a0 + (f.a1 - f.a0) * k / 48; meter(f.cx + f.r * Math.cos(t), f.cy + f.r * Math.sin(t)); }
      }
    };
    for (const p of ej.inicial.puntos) if (p) meter(p.x, p.y);
    for (const r of ej.inicial.rectas) forma(Construccion.rectaInicial(r, pt));
    for (const c of ej.inicial.arcos) forma(Construccion.arcoInicial(c, pt));
    for (const g of C.fantasmas) if (!g.forma.guia && ['punto', 'recta', 'arco'].includes(g.forma.tipo)) forma(g.forma);
    return x0 <= x1 ? { x0, y0, x1, y1 } : null;
  },
  // Mueve todo lo que tiene coordenadas: enunciado, instrumentos y sitios de los objetivos
  desplazar(ej, dx, dy) {
    const mv = (o, kx, ky) => { if (Number.isFinite(o[kx])) o[kx] = U.r3(o[kx] + dx); if (Number.isFinite(o[ky])) o[ky] = U.r3(o[ky] + dy); };
    for (const p of ej.inicial.puntos) if (p) mv(p, 'x', 'y');
    for (const r of ej.inicial.rectas) if (r) { mv(r, 'x1', 'y1'); mv(r, 'x2', 'y2'); }
    for (const c of ej.inicial.arcos) if (c) mv(c, 'cx', 'cy');
    for (const k in ej.instrumentos) if (U.esObj(ej.instrumentos[k])) mv(ej.instrumentos[k], 'x', 'y');
    const coords = v => {
      if (U.esCoord(v)) mv(v, 'x', 'y');
      else if (Array.isArray(v)) v.forEach(coords);
      else if (U.esObj(v)) for (const c in v) coords(v[c]);
    };
    for (const p of ej.pasos) for (const o of p.objetivos) coords(o);
  },
  centrar(ej, horizontal, vertical) {
    const c = this.caja(ej);
    if (!c) return null;
    const [W, H] = HOJAS[ej.papel.hoja || 'A4-h'] || HOJAS['A4-h'];
    // En milímetros enteros, para que las coordenadas sigan siendo redondas
    const dx = horizontal ? Math.round((W - c.x0 - c.x1) / 2) : 0, dy = vertical ? Math.round((H - c.y0 - c.y1) / 2) : 0;
    if (!dx && !dy) return { dx: 0, dy: 0 };
    this.desplazar(ej, dx, dy);
    return { dx, dy };
  },
};

const Revision = {
  // Lista de {nivel: 'error'|'aviso', texto, ir: selección}
  revisar(ej) {
    const out = [], mal = (texto, ir) => out.push({ nivel: 'error', texto, ir }), ojo = (texto, ir) => out.push({ nivel: 'aviso', texto, ir });
    const ficha = { tipo: 'ficha' };
    if (!ej.titulo || !String(ej.titulo).trim()) mal('Falta el título del ejercicio.', ficha);
    if (ej.id && !/^[a-z0-9-]+$/i.test(ej.id)) ojo('El identificador solo debería tener letras, números y guiones.', ficha);
    if (!ej.pasos.length) mal('El ejercicio no tiene pasos.', ficha);
    const [W, H] = HOJAS[ej.papel.hoja || 'A4-h'] || HOJAS['A4-h'];
    // Enunciado
    const vistos = new Map();
    const registrar = (n, donde, ir) => {
      if (typeof n !== 'string' || !n) return;
      if (vistos.has(n)) mal(`El nombre «${n}» se usa dos veces (${vistos.get(n)} y ${donde}). Cada elemento necesita un nombre distinto.`, ir);
      else vistos.set(n, donde);
    };
    const ini0 = Nombres.disponibles(ej, -1);
    const refPunto = (ref, ir, donde) => {
      if (U.esCoord(ref)) return;
      if (typeof ref !== 'string' || !ref) { mal(`${donde}: falta un punto.`, ir); return; }
      const t = ini0.get(ref);
      if (!t) mal(`${donde}: no hay ningún punto «${ref}» en el enunciado.`, ir);
      else if (t.tipo !== 'punto') mal(`${donde}: «${ref}» no es un punto.`, ir);
    };
    ej.inicial.puntos.forEach((p, i) => {
      const ir = { tipo: 'punto', i };
      if (!p || !Number.isFinite(p.x) || !Number.isFinite(p.y)) { mal(`Al punto ${i + 1} del enunciado le faltan las coordenadas.`, ir); return; }
      if (p.x < 0 || p.y < 0 || p.x > W || p.y > H) ojo(`El punto ${p.nombre || i + 1} está fuera de la hoja.`, ir);
      registrar(p.nombre || p.etiqueta, 'enunciado', ir);
    });
    ej.inicial.rectas.forEach((r, i) => {
      const ir = { tipo: 'recta', i }, nm = `Recta ${r.nombre || i + 1} del enunciado`;
      if (r.desde !== undefined) refPunto(r.desde, ir, nm); else if (!Number.isFinite(r.x1) || !Number.isFinite(r.y1)) mal(`${nm}: falta el primer extremo.`, ir);
      if (r.hasta !== undefined) refPunto(r.hasta, ir, nm); else if (!Number.isFinite(r.x2) || !Number.isFinite(r.y2)) mal(`${nm}: falta el segundo extremo.`, ir);
      registrar(r.nombre, 'enunciado', ir);
    });
    ej.inicial.arcos.forEach((c, i) => {
      const ir = { tipo: 'arco', i }, nm = `Arco ${c.nombre || i + 1} del enunciado`;
      if (c.centro !== undefined) refPunto(c.centro, ir, nm); else if (!Number.isFinite(c.cx) || !Number.isFinite(c.cy)) mal(`${nm}: falta el centro.`, ir);
      if (!Number.isFinite(c.radio) || c.radio <= 0) mal(`${nm}: el radio tiene que ser mayor que 0.`, ir);
      registrar(c.nombre, 'enunciado', ir);
    });
    // Pasos
    ej.pasos.forEach((p, i) => {
      const ir = { tipo: 'paso', i }, P = `Paso ${i + 1}`;
      if (!p.texto.trim()) mal(`${P}: falta la instrucción.`, ir);
      if (!p.objetivos.length) mal(`${P}: no tiene ningún objetivo.`, ir);
      const disp = Nombres.disponibles(ej, i);
      const ref = (v, tipos, que) => {
        if (tipos.includes('punto') && U.esCoord(v)) return;
        if (typeof v !== 'string' || !v.trim()) { mal(`${P}: falta ${que}.`, ir); return; }
        const t = disp.get(v);
        if (!t) {
          const luego = Nombres.todos(ej).get(v);
          mal(luego ? `${P}: «${v}» todavía no existe (se nombra en el ${luego.origen}).` : `${P}: no hay nada que se llame «${v}».`, ir);
        } else if (!tipos.includes(t.tipo)) mal(`${P}: «${v}» es ${t.tipo === 'punto' ? 'un punto' : t.tipo === 'recta' ? 'una recta' : 'un arco'}; aquí hace falta ${tipos[0] === 'punto' ? 'un punto' : tipos.length > 1 ? 'una línea' : tipos[0] === 'recta' ? 'una recta' : 'un arco'}.`, ir);
      };
      for (const o of p.objetivos) {
        const def = OBJ[o.tipo];
        if (!def) { mal(`${P}: tipo de objetivo desconocido «${o.tipo}».`, ir); continue; }
        const conds = def.campos.filter(c => o[c[0]] !== undefined);
        if (['punto', 'recta', 'arco'].includes(o.tipo) && !conds.length) ojo(`${P}: el objetivo «${def.nombre.toLowerCase()}» no tiene condiciones; valdrá cualquiera.`, ir);
        for (const [k, t, et] of def.campos) {
          const v = o[k];
          if (v === undefined) continue;
          const q = `«${et.toLowerCase()}»`;
          if (t === 'pt') ref(v, ['punto'], `el punto de ${q}`);
          else if (t === 'linea' && k === 'radioComo' && Array.isArray(v)) {
            if (v.length !== 2) mal(`${P}: ${q} necesita una línea o dos puntos.`, ir); else v.forEach(x => ref(x, ['punto'], `un punto de ${q}`));
          }
          else if (t === 'linea') ref(v, k === 'circunferencia' || k === 'radioComo' ? ['arco'] : ['paralelaA', 'perpendicularA', 'cantoSobre', 'paraleloA'].includes(k) ? ['recta'] : ['recta', 'arco'], `la línea de ${q}`);
          else if (t === 'pts') { const l = [].concat(v); if (!l.length) ojo(`${P}: ${q} está vacío.`, ir); l.forEach(x => ref(x, ['punto'], `un punto de ${q}`)); }
          else if (t === 'par') { if (!Array.isArray(v) || v.length !== 2) mal(`${P}: ${q} necesita dos líneas.`, ir); else v.forEach(x => ref(x, ['recta', 'arco'], `una línea de ${q}`)); }
          else if (t === 'segs') { if (!Array.isArray(v) || !v.length) mal(`${P}: no hay segmentos.`, ir); else v.forEach(s => (Array.isArray(s) && s.length === 2 ? s : [null, null]).forEach(x => ref(x, ['punto'], 'un extremo de un segmento'))); }
          else if (t === 'cortes') [].concat(v).forEach(c => ref(typeof c === 'string' ? c : c && c.elemento, ['recta', 'arco'], `la línea de ${q}`));
          else if (t === 'angPunto') { if (!U.esObj(v)) continue; ref(v.vertice, ['punto'], 'el vértice del ángulo'); ref(v.desde, ['punto'], 'el punto desde el que se mide el ángulo'); if (!Number.isFinite(v.grados)) mal(`${P}: faltan los grados del ángulo.`, ir); }
          else if (t === 'angRecta') { if (!U.esObj(v)) continue; ref(v.con, ['recta'], 'la recta del ángulo'); if (!Number.isFinite(v.grados)) mal(`${P}: faltan los grados del ángulo.`, ir); }
          else if (t === 'dist') { if (!U.esObj(v)) continue; ref(v.de, ['punto'], 'el punto de la distancia'); if (!Number.isFinite(v.mm)) mal(`${P}: faltan los milímetros de la distancia.`, ir); }
          else if (t === 'inst' && !NOMBRE_INST[v]) mal(`${P}: instrumento desconocido «${v}».`, ir);
          else if ((t === 'num' || t === 'int') && !Number.isFinite(v)) mal(`${P}: ${q} tiene que ser un número.`, ir);
        }
        if (o.tipo === 'rectas' && o.segmentos === undefined && o.poligono === undefined) mal(`${P}: indica los segmentos o el polígono.`, ir);
        if (o.tipo === 'vertices') {
          if (!Number.isInteger(o.lados) || o.lados < 3) mal(`${P}: el polígono necesita al menos 3 lados.`, ir);
          for (const k of ['circunferencia', 'desde']) if (o[k] === undefined) mal(`${P}: falta «${k}» en los vértices.`, ir);
        }
        if (o.tipo === 'punto' && o.cruce !== undefined && o.corte === undefined && !(o.cantidad > 1) &&
            !['cerca', 'sobre', 'angulo', 'distancia'].some(k => o[k] !== undefined)) {
          const n = Cortes.de(ej, i, o).length;
          if (n > 1) ojo(`${P}: «${o.cruce[0]}» y «${o.cruce[1]}» se cortan en ${n} puntos y DibuTec daría por bueno cualquiera. Elige el correcto en «En el cruce de» (o «Cualquiera», si los dos sirven).`, ir);
        }
        if (o.tipo === 'punto' && U.esCoord(o.corte) && !(o.cantidad > 1)) {
          const cs = Cortes.de(ej, i, o);
          if (cs.length === 2 && Math.abs(G.dist(cs[0].x, cs[0].y, o.corte.x, o.corte.y) - G.dist(cs[1].x, cs[1].y, o.corte.x, o.corte.y)) < 1)
            ojo(`${P}: el corte elegido en «En el cruce de» está a la misma distancia de los dos cortes, así que no distingue cuál vale (¿se copió de otro paso?). Vuelve a elegirlo.`, ir);
        }
        if (o.tipo === 'arco') [].concat(o.cortaA || []).forEach((x, ix) => {
          if (!U.esObj(x) || !U.esCoord(x.corte) || x.cortes > 1) return;
          const cs = Cortes.deArco(ej, i, o, ix);
          if (cs.length > 1 && !Cortes.porLado(cs, x.corte, cs.radio))
            ojo(`${P}: el sitio elegido en «Corta a ${x.elemento}» está casi a la misma distancia de los dos cortes, así que no indica por qué lado va el arco (¿se copió de otro paso?). Vuelve a elegir el arco que vale.`, ir);
        });
        if (o.tipo === 'punto') {
          const ya = this.puntoQueYaCumple(ej, i, o);
          if (ya) ojo(`${P}: en la construcción esperada, el punto «${ya.nombre}» (paso ${ya.paso + 1}) ya cumple este objetivo, así que DibuTec lo daría por bueno sin que se marque ninguno nuevo. Añade una condición que lo distinga, como «A una distancia» o «Cerca de»${o.cruce !== undefined ? ', o elige el otro corte' : ''}.`, ir);
        }
        if (o.tipo === 'instrumento' && !o.instrumento) mal(`${P}: elige el instrumento.`, ir);
        if (o.tipo === 'instrumento' && (o.paraleloA !== undefined || o.perpendicularA !== undefined) && o.cantoPasaPor === undefined)
          ojo(`${P}: «paralelo a» y «perpendicular a» solo cuentan junto con «Un canto pasa por».`, ir);
        if (o.nombrar !== undefined) {
          if (!def.crea) ojo(`${P}: el objetivo «${def.nombre.toLowerCase()}» no puede poner nombres.`, ir);
          for (const n of [].concat(o.nombrar)) registrar(n, P.toLowerCase(), ir);
          const k = o.tipo === 'punto' ? (o.cantidad || 1) : o.tipo === 'vertices' ? o.lados : 1;
          if ([].concat(o.nombrar).length > k) ojo(`${P}: hay más nombres (${[].concat(o.nombrar).length}) que elementos (${k}).`, ir);
        }
      }
      if (Array.isArray(p.herramientas)) for (const h of p.herramientas)
        if (!HERRAMIENTAS.some(x => x[0] === h)) ojo(`${P}: herramienta desconocida «${h}».`, ir);
    });
    // La construcción completa tiene que caber en la hoja
    const caja = ej.pasos.length ? Encuadre.caja(ej) : null;
    if (caja && (caja.x0 < 0 || caja.y0 < 0 || caja.x1 > W || caja.y1 > H))
      ojo('Parte de la construcción esperada se sale de la hoja. Muévela con los botones de «Solución final».', { tipo: 'final' });
    // Lo optativo no puede ser imprescindible para los pasos siguientes
    ej.pasos.forEach((p, i) => {
      const ir = { tipo: 'paso', i }, P = `Paso ${i + 1}`;
      const opc = p.optativo === true || p.objetivos.some(o => Array.isArray(o.opcionales) && o.opcionales.length);
      if (!opc) return;
      if (i === ej.pasos.length - 1) ojo(`${P}: el último paso no se puede saltar (no hay un paso siguiente con el que seguir), así que lo optativo no cuenta.`, ir);
      if (p.optativo !== true) return;
      const noms = p.objetivos.flatMap(o => o.nombrar === undefined ? [] : [].concat(o.nombrar)).filter(n => typeof n === 'string' && n);
      for (const n of noms) {
        const usa = ej.pasos.findIndex((q, j) => j > i && JSON.stringify(q.objetivos, (k, v) => (CLAVES_NO_REF.has(k) ? undefined : v)).includes(JSON.stringify(n)));
        if (usa >= 0) ojo(`${P} es optativo, pero lo que nombra («${n}») se usa en el paso ${usa + 1}: si el alumno se lo salta, no podrá seguir.`, ir);
      }
    });
    const todos = Nombres.todos(ej);
    for (const k in ej.textos) if (!todos.has(k)) ojo(`Hay un texto para «${k}», pero no hay nada con ese nombre.`, { tipo: 'textos' });
    return out;
  },
  // DibuTec acepta cualquier punto marcado por el alumno que cumpla las condiciones, también los de pasos
  // anteriores. Devuelve el primero de esos puntos (según la construcción esperada) que ya cumple «o».
  puntoQueYaCumple(ej, i, o) {
    if (Number.isInteger(o.cantidad) && o.cantidad > 1) return null;
    if (o.nombrar !== undefined) return null;   // DibuTec pide un punto nuevo (sin otro nombre del ejercicio)
    if (!['cerca', 'sobre', 'cruce', 'angulo', 'distancia'].some(k => o[k] !== undefined)) return null;
    const { geo } = Construccion.calcular(ej, i - 1);
    const tol = Number.isFinite(o.tolerancia) ? o.tolerancia : 1, tolA = Number.isFinite(o.toleranciaGrados) ? o.toleranciaGrados : 1;
    const pt = r => U.esCoord(r) ? r : (geo.get(r) && geo.get(r).tipo === 'punto' ? geo.get(r) : null);
    const lin = r => (typeof r === 'string' && geo.get(r) && geo.get(r).tipo !== 'punto' ? geo.get(r) : null);
    const cumple = p => {
      if (o.cerca !== undefined) { const c = pt(o.cerca); if (!c || G.dist(p.x, p.y, c.x, c.y) > tol) return false; }
      if (o.sobre !== undefined) { const l = lin(o.sobre); if (!l || G.distForma(p, l) > tol) return false; }
      if (o.cruce !== undefined) {
        const A = Array.isArray(o.cruce) && lin(o.cruce[0]), B = Array.isArray(o.cruce) && lin(o.cruce[1]);
        if (!A || !B) return false;
        let cs = G.cortes(A, B);
        if (U.esCoord(o.corte) && cs.length > 1) cs = [Cortes.masCercano(cs, o.corte)];
        if (!cs.some(q => G.dist(p.x, p.y, q.x, q.y) <= tol)) return false;
      }
      if (o.distancia) { const c = pt(o.distancia.de); if (!c || !Number.isFinite(o.distancia.mm) || Math.abs(G.dist(p.x, p.y, c.x, c.y) - o.distancia.mm) > tol) return false; }
      if (o.angulo) {
        const a = o.angulo, V = pt(a.vertice), Hh = pt(a.desde);
        if (!V || !Hh || !Number.isFinite(a.grados)) return false;
        let g = (Math.atan2(-(p.y - V.y), p.x - V.x) - Math.atan2(-(Hh.y - V.y), Hh.x - V.x)) * 180 / Math.PI;
        g = ((g % 360) + 540) % 360 - 180;
        const ok = a.sentido === 'antihorario' ? Math.abs(g - a.grados) <= tolA : a.sentido === 'horario' ? Math.abs(g + a.grados) <= tolA : Math.abs(Math.abs(g) - a.grados) <= tolA;
        if (!ok) return false;
      }
      return true;
    };
    for (const [nombre, f] of geo) {
      if (f.tipo !== 'punto' || f.paso === undefined) continue;   // solo los que marca el alumno
      if (cumple(f)) return { nombre, paso: f.paso };
    }
    return null;
  },
  // Lo mismo que comprueba DibuTec al abrir el archivo
  validarComoApp(d) {
    if (!d || typeof d !== 'object' || d.formato !== 'dibutec-ejercicio') throw new Error('falta "formato": "dibutec-ejercicio"');
    if (typeof d.titulo !== 'string' || !d.titulo.trim()) throw new Error('falta el título');
    if (!Array.isArray(d.pasos) || !d.pasos.length) throw new Error('no tiene pasos');
    d.pasos.forEach((p, i) => {
      if (!p || typeof p.texto !== 'string') throw new Error(`el paso ${i + 1} no tiene texto`);
      const objs = Array.isArray(p.objetivos) ? p.objetivos : p.objetivo ? [p.objetivo] : [];
      if (!objs.length) throw new Error(`el paso ${i + 1} no tiene objetivo`);
      for (const o of objs) if (!o || !OBJ[o.tipo]) throw new Error(`paso ${i + 1}: tipo de objetivo desconocido «${o && o.tipo}»`);
    });
    return d;
  },
};

/* =====================================================================
   Instrumentos: forma con los tamaños por defecto de DibuTec
   ===================================================================== */
const Inst = {
  local(tipo, c) {
    switch (tipo) {
      case 'regla': return { poli: [[0, 0], [310, 0], [310, 32], [0, 32]], asa: [296, 16], marcas: Array.from({ length: 31 }, (_, i) => [5 + i * 10, 0, i % 5 ? 4 : 7]) };
      case 'escuadra': return { poli: [[0, 0], [160, 0], [0, -160]], asa: [105, -18], marcas: Array.from({ length: 15 }, (_, i) => [5 + i * 10, 0, i % 5 ? 4 : 7]) };
      case 'cartabon': {
        const Lg = 160 * Math.SQRT2, S = Lg / Math.sqrt(3);
        return { poli: [[0, 0], [S, 0], [0, -Lg]], asa: [S - 50, -16], marcas: Array.from({ length: 21 }, (_, i) => [0, -5 - i * 10, i % 5 ? 4 : 7]) };
      }
      case 'transportador': {
        const v = [];
        for (let g = 0; g <= 180; g += 4) v.push([65 * Math.cos(g * Math.PI / 180), -65 * Math.sin(g * Math.PI / 180)]);
        return { poli: v, asa: [0, -58], marcas: [] };
      }
      case 'compas': {
        const r = Number.isFinite(c && c.radio) ? c.radio : 40, m = r / 2;
        const h = Math.sqrt(Math.max(75 * 75 - m * m, (75 * .18) ** 2));
        return { compas: true, r, bisagra: [m, -h], asa: [r, 0], poli: [[0, 0], [m, -h], [r, 0]] };
      }
    }
    return null;
  },
  // Posición del instrumento; sin x/y, DibuTec lo coloca a la vista (aquí, cerca del centro de la hoja)
  pose(tipo, c, W, H) {
    const fija = c && Number.isFinite(c.x) && Number.isFinite(c.y);
    const def = { regla: [W / 2 - 155, H * .72], escuadra: [W * .2, H * .8], cartabon: [W * .62, H * .85], compas: [W * .7, H * .45], transportador: [W / 2, H * .55] }[tipo];
    return { x: fija ? c.x : def[0], y: fija ? c.y : def[1], rot: -((c && Number.isFinite(c.giro)) ? c.giro : 0) * Math.PI / 180, sx: c && c.volteado ? -1 : 1, fija };
  },
  aMundo(p, lx, ly) {
    const cs = Math.cos(p.rot), sn = Math.sin(p.rot);
    lx *= p.sx;
    return { x: p.x + lx * cs - ly * sn, y: p.y + lx * sn + ly * cs };
  },
  dentro(pt, v) {
    let d = false;
    for (let i = 0, j = v.length - 1; i < v.length; j = i++)
      if ((v[i][1] > pt.y) !== (v[j][1] > pt.y) && pt.x < (v[j][0] - v[i][0]) * (pt.y - v[i][1]) / (v[j][1] - v[i][1]) + v[i][0]) d = !d;
    return d;
  },
};

/* =====================================================================
   Vista: zoom y desplazamiento de la hoja (viewBox en mm)
   ===================================================================== */
const Vista = {
  x: -10, y: -10, esc: 3,      // esc = px por mm
  svg: null,
  tam() { const r = this.svg.getBoundingClientRect(); return { w: r.width || 1, h: r.height || 1, l: r.left, t: r.top }; },
  aMm(cx, cy) { const t = this.tam(); return { x: this.x + (cx - t.l) / this.esc, y: this.y + (cy - t.t) / this.esc }; },
  px(mm) { return mm * this.esc; },
  mmDe(px) { return px / this.esc; },
  ajustar() {
    const [W, H] = Editor.hoja(), t = this.tam(), m = 24;
    this.esc = Math.max(.3, Math.min((t.w - 2 * m) / W, (t.h - 2 * m) / H));
    this.x = -(t.w / this.esc - W) / 2;
    this.y = -(t.h / this.esc - H) / 2;
    Editor.pintarHoja();
  },
  zoom(f, cx, cy) {
    const t = this.tam();
    if (cx === undefined) { cx = t.l + t.w / 2; cy = t.t + t.h / 2; }
    const a = this.aMm(cx, cy);
    this.esc = Math.max(.3, Math.min(40, this.esc * f));
    this.x = a.x - (cx - t.l) / this.esc;
    this.y = a.y - (cy - t.t) / this.esc;
    Editor.pintarHoja();
  },
  viewBox() { const t = this.tam(); return `${this.x} ${this.y} ${t.w / this.esc} ${t.h / this.esc}`; },
};

/* =====================================================================
   Editor
   ===================================================================== */
const Editor = {
  sel: { tipo: 'ficha' },     // ficha | enunciado | instrumentos | textos | final | paso{i} | punto{i} | recta{i} | arco{i} | inst{k}
  herr: 'sel',                // sel | punto | recta | arco
  iman: true,
  verConstruccion: true,
  moverLibre: false,          // en «Solución final»: arrastrar mueve todo el ejercicio
  pasoVista: -1,              // construcción que se ve en la hoja
  borrador: null,             // trazo en curso: {tipo, a}
  eligiendo: null,            // {tipo: 'punto'|'linea', alElegir, paso}
  arrastre: null,
  raton: null,                // última posición del ratón en mm
  iman_: null,                // objetivo del imán bajo el ratón
  historial: [], futuro: [], ultimoCambio: { clave: null, t: 0 },
  CLAVE: 'dibutec.editor.borrador',
  CLAVE_PRUEBA: 'dibutec.editor.prueba',

  get ej() { return Modelo.ej; },
  hoja() { return HOJAS[this.ej.papel.hoja || 'A4-h'] || HOJAS['A4-h']; },
  papel(k) { return this.ej.papel[k] !== undefined ? this.ej.papel[k] : PAPEL_DEF[k]; },

  // ---------- Cambios, historial y borrador ----------
  cambio(clave = null, { inspector = true } = {}) {
    const ahora = Date.now(), texto = JSON.stringify(this.ej);
    if (clave && this.ultimoCambio.clave === clave && ahora - this.ultimoCambio.t < 1200 && this.historial.length) {
      // Se sigue escribiendo en el mismo campo: un solo paso de deshacer
    } else {
      this.historial.push(this.estadoAnterior);
      if (this.historial.length > 200) this.historial.shift();
    }
    this.estadoAnterior = texto;
    this.futuro = [];
    this.ultimoCambio = { clave, t: ahora };
    this.guardarBorrador();
    this.repintar({ inspector });
  },
  deshacer() {
    if (!this.historial.length) return;
    this.futuro.push(JSON.stringify(this.ej));
    this.cargarEstado(this.historial.pop());
  },
  rehacer() {
    if (!this.futuro.length) return;
    this.historial.push(JSON.stringify(this.ej));
    this.cargarEstado(this.futuro.pop());
  },
  cargarEstado(t) {
    Modelo.ej = JSON.parse(t);
    this.estadoAnterior = t;
    this.ultimoCambio = { clave: null, t: 0 };
    if (!this.selValida()) this.sel = { tipo: 'ficha' };
    this.guardarBorrador();
    this.repintar();
  },
  selValida() {
    const s = this.sel;
    if (s.tipo === 'paso') return s.i < this.ej.pasos.length;
    if (['punto', 'recta', 'arco'].includes(s.tipo)) return s.i < this.ej.inicial[s.tipo + 's'].length;
    return true;
  },
  guardarBorrador() {
    try { localStorage.setItem(this.CLAVE, JSON.stringify(this.ej)); } catch (_) { /* sin almacenamiento */ }
  },
  abrir(def, { avisar = true } = {}) {
    Modelo.ej = Modelo.normalizar(def);
    this.estadoAnterior = JSON.stringify(Modelo.ej);
    this.historial = []; this.futuro = [];
    this.sel = { tipo: 'ficha' };
    this.pasoVista = -1;
    this.guardarBorrador();
    this.repintar();
    Vista.ajustar();
    if (avisar) aviso(`Abierto: ${Modelo.ej.titulo}`);
  },
  abrirTexto(t, origen) {
    let d;
    try { d = JSON.parse(t); } catch (e) { aviso('El archivo no es JSON válido: ' + e.message); return false; }
    if (!d || d.formato !== 'dibutec-ejercicio') { aviso('Ese archivo no es un ejercicio de DibuTec.'); return false; }
    this.abrir(d);
    if (origen) mensaje(`Abierto «${origen}». Los cambios se guardan solos en este navegador; usa «Guardar» para descargar el archivo.`);
    return true;
  },

  // ---------- Selección ----------
  seleccionar(s) {
    this.sel = s;
    if (s.tipo === 'paso') this.pasoVista = s.i;
    else if (s.tipo === 'final') this.pasoVista = this.ej.pasos.length - 1;   // la solución completa
    else if (['ficha', 'enunciado', 'punto', 'recta', 'arco', 'instrumentos', 'inst'].includes(s.tipo)) this.pasoVista = Math.min(this.pasoVista, -1);
    this.cancelarEleccion();
    this.repintar();
  },
  eliminarSeleccion() {
    const s = this.sel;
    if (['punto', 'recta', 'arco'].includes(s.tipo)) {
      const l = this.ej.inicial[s.tipo + 's'], el = l[s.i];
      l.splice(s.i, 1);
      if (el && el.nombre && this.ej.textos[el.nombre] !== undefined) delete this.ej.textos[el.nombre];
      this.sel = { tipo: 'enunciado' };
      this.cambio();
      mensaje('Elemento borrado del enunciado.');
    } else if (s.tipo === 'inst') {
      delete this.ej.instrumentos[s.k];
      this.sel = { tipo: 'instrumentos' };
      this.cambio();
    } else if (s.tipo === 'paso') this.borrarPaso(s.i);
  },

  // ---------- Pasos ----------
  anadirPaso(tras = this.ej.pasos.length - 1) {
    const p = { texto: '', objetivos: [{ tipo: 'punto' }] };
    this.ej.pasos.splice(tras + 1, 0, p);
    this.sel = { tipo: 'paso', i: tras + 1 };
    this.pasoVista = tras + 1;
    this.cambio();
    setTimeout(() => { const t = document.querySelector('#inspector textarea'); if (t) t.focus(); }, 0);
  },
  borrarPaso(i) {
    if (this.ej.pasos.length <= 1) { aviso('El ejercicio necesita al menos un paso.'); return; }
    this.ej.pasos.splice(i, 1);
    this.sel = { tipo: 'paso', i: Math.min(i, this.ej.pasos.length - 1) };
    this.pasoVista = this.sel.i;
    this.cambio();
    aviso('Paso borrado. Ctrl+Z para recuperarlo.');
  },
  moverPaso(i, j) {
    if (j < 0 || j >= this.ej.pasos.length || i === j) return;
    const [p] = this.ej.pasos.splice(i, 1);
    this.ej.pasos.splice(j, 0, p);
    this.sel = { tipo: 'paso', i: j };
    this.pasoVista = j;
    this.cambio();
  },
  duplicarPaso(i) {
    const copia = U.copia(this.ej.pasos[i]);
    const cambios = Nombres.renombrarCopia(this.ej, copia.objetivos);
    this.ej.pasos.splice(i + 1, 0, copia);
    this.sel = { tipo: 'paso', i: i + 1 };
    this.pasoVista = i + 1;
    this.cambio();
    aviso(cambios.length ? `Paso duplicado. Nombres nuevos: ${cambios.join(', ')}. Revisa los puntos y líneas que usa.` : 'Paso duplicado.');
  },
  duplicarObjetivo(i, j) {
    const objs = this.ej.pasos[i].objetivos, copia = U.copia(objs[j]);
    const cambios = Nombres.renombrarCopia(this.ej, [copia]);
    objs.splice(j + 1, 0, copia);
    this.cambio();
    aviso(cambios.length ? `Objetivo duplicado: ${cambios.join(', ')}.` : 'Objetivo duplicado.');
  },

  // ---------- Renombrar: cambia también todas las referencias ----------
  // Varios a la vez (A→B y B→A sin mezclarse): primero a nombres provisionales
  renombrarVarios(pares) {
    pares = pares.filter(([a, b]) => a && b && a !== b);
    const tmp = pares.map((_, k) => `\u0000tmp${k}\u0000`);
    pares.forEach(([a], k) => this.renombrar(a, tmp[k]));
    pares.forEach(([, b], k) => this.renombrar(tmp[k], b));
  },
  renombrar(viejo, nuevo) {
    if (!viejo || viejo === nuevo) return;
    const cambiar = (v, k) => {
      if (CLAVES_NO_REF.has(k)) return v;
      if (typeof v === 'string') return v === viejo ? nuevo : v;
      if (Array.isArray(v)) return v.map(x => cambiar(x, null));
      if (U.esObj(v)) { for (const c in v) v[c] = cambiar(v[c], c); return v; }
      return v;
    };
    for (const p of this.ej.pasos) for (const o of p.objetivos) cambiar(o, null);
    for (const r of this.ej.inicial.rectas) { if (r.desde === viejo) r.desde = nuevo; if (r.hasta === viejo) r.hasta = nuevo; }
    for (const c of this.ej.inicial.arcos) if (c.centro === viejo) c.centro = nuevo;
    if (this.ej.textos[viejo] !== undefined && this.ej.textos[nuevo] === undefined) { this.ej.textos[nuevo] = this.ej.textos[viejo]; delete this.ej.textos[viejo]; }
  },

  // ---------- Repintado ----------
  repintar({ inspector = true } = {}) {
    this.revision = Revision.revisar(this.ej);
    Esquema.pintar();
    if (inspector) Inspector.pintar(); else Inspector.actualizarVivos();
    document.getElementById('lienzo').classList.toggle('mover-todo', this.sel.tipo === 'final' && this.moverLibre);
    this.pintarHoja();
    this.pintarEstado();
    Barra.actualizar();
  },
  pintarEstado() {
    const b = document.getElementById('btn-problemas');
    const e = this.revision.filter(p => p.nivel === 'error').length, a = this.revision.length - e;
    b.className = e ? 'mal' : a ? 'regular' : 'bien';
    b.textContent = e ? `${e} ${e === 1 ? 'error' : 'errores'}${a ? ` · ${a} ${a === 1 ? 'aviso' : 'avisos'}` : ''}` : a ? `${a} ${a === 1 ? 'aviso' : 'avisos'}` : '✓ Sin problemas';
  },

  // ---------- Hoja (SVG) ----------
  pintarHoja() {
    const svg = Vista.svg, ej = this.ej;
    if (!ej) return;
    svg.setAttribute('viewBox', Vista.viewBox());
    const [W, H] = this.hoja(), k = 1 / Vista.esc;   // mm por píxel
    const partes = [];
    const tr = (w) => (w * k).toFixed(4);
    // Papel
    partes.push(`<rect x="${1.2 * k}" y="${2 * k}" width="${W}" height="${H}" fill="rgba(0,0,0,.18)"/>`);
    partes.push(`<rect x="0" y="0" width="${W}" height="${H}" fill="${COLOR_PAPEL[this.papel('colorPapel')] || '#fff'}"/>`);
    partes.push(this.cuadricula(W, H, k));
    if (this.papel('margen')) partes.push(`<rect x="10" y="10" width="${W - 20}" height="${H - 20}" fill="none" stroke="rgba(${COLOR_LINEAS[this.papel('colorLineas')] || COLOR_LINEAS.azul}, .5)" stroke-width="${tr(1)}"/>`);

    const vista = this.verConstruccion ? this.pasoVista : -1;
    const C = Construccion.calcular(ej, vista);
    this.construccion = C;
    const actual = this.sel.tipo === 'paso' ? this.sel.i : -99;
    // Elementos a los que se refiere el paso seleccionado
    const refs = new Set();
    if (actual >= 0 && ej.pasos[actual]) {
      const juntar = (v, kk) => {
        if (CLAVES_NO_REF.has(kk)) return;
        if (typeof v === 'string') refs.add(v);
        else if (Array.isArray(v)) v.forEach(x => juntar(x, null));
        else if (U.esObj(v)) for (const c in v) juntar(v[c], c);
      };
      ej.pasos[actual].objetivos.forEach(o => juntar(o, null));
    }
    const forma = (f, color, ancho, extra = '') => {
      const w = tr(ancho);
      if (f.tipo === 'recta') return `<line x1="${f.x1}" y1="${f.y1}" x2="${f.x2}" y2="${f.y2}" stroke="${color}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
      if (f.tipo === 'arco') {
        if (G.completo(f)) return `<circle cx="${f.cx}" cy="${f.cy}" r="${f.r}" fill="none" stroke="${color}" stroke-width="${w}" ${extra}/>`;
        const p0 = { x: f.cx + f.r * Math.cos(f.a0), y: f.cy + f.r * Math.sin(f.a0) }, p1 = { x: f.cx + f.r * Math.cos(f.a1), y: f.cy + f.r * Math.sin(f.a1) };
        const barr = Math.abs(f.a1 - f.a0), grande = barr > Math.PI ? 1 : 0, sentido = f.a1 > f.a0 ? 1 : 0;
        return `<path d="M${p0.x} ${p0.y}A${f.r} ${f.r} 0 ${grande} ${sentido} ${p1.x} ${p1.y}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
      }
      return '';
    };
    const cruz = (x, y, color, t = 5, ancho = 1.6) => {
      const s = t * k;
      return `<path d="M${x - s} ${y - s}L${x + s} ${y + s}M${x + s} ${y - s}L${x - s} ${y + s}" stroke="${color}" stroke-width="${tr(ancho)}" stroke-linecap="round"/>`;
    };
    const etiqueta = (x, y, txt, color, negrita = true) =>
      `<text x="${x + 6 * k}" y="${y - 6 * k}" font-size="${14 * k}" font-weight="${negrita ? 700 : 500}" fill="${color}" stroke="#fff" stroke-width="${3 * k}" paint-order="stroke" font-family="system-ui, sans-serif">${U.esc(txt)}</text>`;

    // Construcción esperada (fantasmas)
    if (this.verConstruccion && vista >= 0) {
      for (const g of C.fantasmas) {
        const esActual = g.paso === vista, col = esActual ? COLOR.paso : COLOR.previo;
        const discont = `stroke-dasharray="${tr(esActual ? 7 : 5)} ${tr(esActual ? 5 : 5)}" opacity="${esActual ? .95 : .7}"`;
        if (g.forma.tipo === 'punto') {
          partes.push(cruz(g.forma.x, g.forma.y, col, 4.5, esActual ? 2 : 1.4));
          if (g.etiqueta) partes.push(etiqueta(g.forma.x, g.forma.y, g.etiqueta, col));
        } else if (g.forma.tipo === 'otroCorte') {
          if (!esActual) continue;
          partes.push(`<g class="otro-corte"><title>Otro corte. Tócalo para elegirlo como el bueno.</title><circle cx="${g.forma.x}" cy="${g.forma.y}" r="${9 * k}" fill="rgba(255,255,255,.01)" stroke="${COLOR.previo}" stroke-width="${tr(1.6)}" stroke-dasharray="${tr(3)} ${tr(3)}"/>${cruz(g.forma.x, g.forma.y, COLOR.previo, 3, 1.2)}</g>`);
        } else if (g.forma.tipo === 'diana') {
          partes.push(`<circle cx="${g.forma.x}" cy="${g.forma.y}" r="${8 * k}" fill="none" stroke="${col}" stroke-width="${tr(2)}" ${discont}/>`);
        } else partes.push(forma(g.forma, col, g.forma.guia ? 1.2 : 2, discont));
      }
      // Nombres de las líneas construidas
      for (const [n, f] of C.geo) {
        if (f.dado || f.tipo === 'punto') continue;
        const col = f.paso === vista ? COLOR.paso : COLOR.previo;
        const p = f.etq || (f.tipo === 'recta' ? { x: f.x2, y: f.y2 } : { x: f.cx + f.r * Math.cos(-Math.PI / 4), y: f.cy + f.r * Math.sin(-Math.PI / 4) });
        partes.push(etiqueta(p.x, p.y, n + (f.aprox ? ' (≈)' : ''), col, false));
      }
    }

    // Enunciado
    const pt = r => U.esCoord(r) ? r : (C.geo.get(r) && C.geo.get(r).tipo === 'punto' ? C.geo.get(r) : null);
    const s = this.sel;
    ej.inicial.rectas.forEach((r, i) => {
      const f = Construccion.rectaInicial(r, pt);
      if (!f) return;
      const marcado = (s.tipo === 'recta' && s.i === i), ref = refs.has(r.nombre);
      if (marcado) partes.push(forma(f, 'rgba(224,123,18,.35)', 9));
      partes.push(forma(f, ref ? COLOR.ref : COLOR.dado, ref ? 2.6 : 1.6));
      if (r.nombre) partes.push(etiqueta((f.x1 + f.x2) / 2, (f.y1 + f.y2) / 2, r.nombre, ref ? COLOR.ref : COLOR.dado, false));
    });
    ej.inicial.arcos.forEach((c, i) => {
      const f = Construccion.arcoInicial(c, pt);
      if (!f) return;
      const marcado = (s.tipo === 'arco' && s.i === i), ref = refs.has(c.nombre);
      if (marcado) partes.push(forma(f, 'rgba(224,123,18,.35)', 9));
      partes.push(forma(f, ref ? COLOR.ref : COLOR.dado, ref ? 2.6 : 1.6));
      partes.push(cruz(f.cx, f.cy, COLOR.dado, 2.5, 1));
      if (c.nombre) { const a = (f.a0 + f.a1) / 2; partes.push(etiqueta(f.cx + f.r * Math.cos(a), f.cy + f.r * Math.sin(a), c.nombre, ref ? COLOR.ref : COLOR.dado, false)); }
    });
    ej.inicial.puntos.forEach((p, i) => {
      if (!Number.isFinite(p.x) || !Number.isFinite(p.y)) return;
      const marcado = s.tipo === 'punto' && s.i === i, n = p.nombre || p.etiqueta, ref = refs.has(n);
      if (marcado) partes.push(`<circle cx="${p.x}" cy="${p.y}" r="${11 * k}" fill="rgba(224,123,18,.25)" stroke="${COLOR.sel}" stroke-width="${tr(2)}"/>`);
      else if (ref) partes.push(`<circle cx="${p.x}" cy="${p.y}" r="${10 * k}" fill="rgba(47,111,208,.15)" stroke="${COLOR.ref}" stroke-width="${tr(1.5)}"/>`);
      partes.push(cruz(p.x, p.y, COLOR.dado, 5, 1.8));
      if (p.etiqueta || p.nombre) partes.push(etiqueta(p.x, p.y, p.etiqueta || p.nombre, COLOR.dado));
    });

    // Coordenadas sueltas del paso seleccionado (objetivos con {x, y})
    if (actual >= 0 && ej.pasos[actual]) {
      const coords = [];
      const juntar = v => {
        if (U.esCoord(v)) coords.push(v);
        else if (Array.isArray(v)) v.forEach(juntar);
        else if (U.esObj(v)) for (const c in v) juntar(v[c]);
      };
      ej.pasos[actual].objetivos.forEach(juntar);
      for (const c of coords) partes.push(`<circle cx="${c.x}" cy="${c.y}" r="${6 * k}" fill="none" stroke="${COLOR.ref}" stroke-width="${tr(1.5)}"/>${cruz(c.x, c.y, COLOR.ref, 3, 1.2)}`);
    }

    // Instrumentos
    for (const [tipo] of INSTRUMENTOS) {
      const c = ej.instrumentos[tipo];
      if (!c) continue;
      partes.push(this.dibujoInstrumento(tipo, c, W, H, k, s.tipo === 'inst' && s.k === tipo));
    }

    // Trazo en curso y objetivo del imán
    if (this.borrador && this.raton) {
      const a = this.borrador.a, b = this.iman_ || this.raton;
      if (this.borrador.tipo === 'recta') partes.push(`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${COLOR.dado}" stroke-width="${tr(1.6)}" stroke-dasharray="${tr(6)} ${tr(4)}"/>`);
      else {
        const r = G.dist(a.x, a.y, b.x, b.y);
        partes.push(`<circle cx="${a.x}" cy="${a.y}" r="${r}" fill="none" stroke="${COLOR.dado}" stroke-width="${tr(1.6)}" stroke-dasharray="${tr(6)} ${tr(4)}"/><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${COLOR.dado}" stroke-width="${tr(1)}"/>`);
        partes.push(etiqueta((a.x + b.x) / 2, (a.y + b.y) / 2, `r = ${U.fmt(this.radioRedondo(r, this.iman_))} mm`, COLOR.dado));
      }
      partes.push(cruz(a.x, a.y, COLOR.dado, 4, 1.5));
    }
    if (this.iman_ && (this.herr !== 'sel' || this.eligiendo || this.arrastre)) {
      partes.push(`<circle cx="${this.iman_.x}" cy="${this.iman_.y}" r="${9 * k}" fill="rgba(255,159,28,.25)" stroke="${COLOR.iman}" stroke-width="${tr(2)}"/>`);
      if (this.iman_.nombre && this.eligiendo) partes.push(etiqueta(this.iman_.x, this.iman_.y + 22 * k, this.iman_.nombre, COLOR.iman));
    }
    if (this.eligiendo && this.eligiendo.tipo === 'linea' && this.lineaBajo) partes.push(forma(this.lineaBajo, 'rgba(255,159,28,.6)', 8));
    svg.innerHTML = partes.join('');
    this.pintarLeyenda(vista);
  },
  pintarLeyenda(vista) {
    const l = document.getElementById('leyenda');
    if (!this.verConstruccion || vista < 0) { l.hidden = true; return; }
    l.hidden = false;
    l.innerHTML = `<span><i style="border-color:${COLOR.dado}"></i>Enunciado</span>` +
      (vista > 0 ? `<span><i style="border-color:${COLOR.previo};border-top-style:dashed"></i>Pasos anteriores</span>` : '') +
      `<span><i style="border-color:${COLOR.paso};border-top-style:dashed"></i>Paso ${vista + 1} (lo esperado)</span>` +
      `<span><i style="border-color:${COLOR.ref}"></i>Lo que usa el paso</span>`;
  },
  cuadricula(W, H, k) {
    const tipo = this.papel('papel');
    if (tipo === 'blanco') return '';
    const m = this.papel('margen') ? 10 : 0, a = { x0: m, y0: m, x1: W - m, y1: H - m };
    const rgb = COLOR_LINEAS[this.papel('colorLineas')] || COLOR_LINEAS.azul;
    const vis = sep => Math.max(0, Math.min(1, (sep * Vista.esc - 3) / 5));
    let d = '';
    const capa = (sep, alfa, ancho, saltar) => {
      const v = vis(sep);
      if (v <= 0) return '';
      let p = '';
      for (let i = 0; a.x0 + i * sep <= a.x1 + 1e-6; i++) { if (saltar && Math.round(i * sep) % saltar === 0) continue; p += `M${a.x0 + i * sep} ${a.y0}V${a.y1}`; }
      for (let j = 0; a.y0 + j * sep <= a.y1 + 1e-6; j++) { if (saltar && Math.round(j * sep) % saltar === 0) continue; p += `M${a.x0} ${a.y0 + j * sep}H${a.x1}`; }
      return `<path d="${p}" stroke="rgba(${rgb}, ${alfa * v})" stroke-width="${ancho * k}" fill="none"/>`;
    };
    if (tipo === 'cuadriculado') d += capa(this.papel('cuadro'), .55, .8);
    else if (tipo === 'milimetrado') d += capa(1, .28, .5, 5) + capa(5, .5, .8, 10) + capa(10, .75, 1.2);
    else if (tipo === 'isometrico') {
      const s = this.papel('triangulo'), h = s * Math.sqrt(3) / 2, mm = 1 / Math.sqrt(3), v = vis(s * .5);
      if (v > 0) {
        let p = '';
        for (let i = 0; a.x0 + i * h <= a.x1 + 1e-6; i++) p += `M${a.x0 + i * h} ${a.y0}V${a.y1}`;
        const dx = a.x1 - a.x0;
        for (let q = Math.ceil((a.y0 - mm * dx - a.y0) / s); q <= Math.floor((a.y1 - a.y0) / s); q++) { const c = a.y0 + q * s; p += `M${a.x0} ${c}L${a.x1} ${c + mm * dx}`; }
        for (let q = Math.ceil(0); q <= Math.floor((a.y1 + mm * dx - a.y0) / s); q++) { const c = a.y0 + q * s; p += `M${a.x0} ${c}L${a.x1} ${c - mm * dx}`; }
        d += `<path d="${p}" stroke="rgba(${rgb}, ${.55 * v})" stroke-width="${.8 * k}" fill="none"/>`;
      }
    }
    return `<defs><clipPath id="zona-cuadricula"><rect x="${a.x0}" y="${a.y0}" width="${a.x1 - a.x0}" height="${a.y1 - a.y0}"/></clipPath></defs><g clip-path="url(#zona-cuadricula)">${d}</g>`;
  },
  dibujoInstrumento(tipo, c, W, H, k, marcado) {
    const L = Inst.local(tipo, c), P = Inst.pose(tipo, c, W, H);
    const m = (x, y) => Inst.aMundo(P, x, y);
    const borde = marcado ? COLOR.sel : 'rgba(8, 92, 34, .9)', relleno = 'rgba(14, 150, 52, .32)';
    const dash = P.fija ? '' : `stroke-dasharray="${6 * k} ${4 * k}"`;
    let s = '';
    if (L.compas) {
      const o = m(0, 0), b = m(...L.bisagra), mi = m(L.r, 0);
      s += `<path d="M${o.x} ${o.y}L${b.x} ${b.y}L${mi.x} ${mi.y}" fill="none" stroke="${borde}" stroke-width="${(marcado ? 4 : 3) * k}" stroke-linecap="round" stroke-linejoin="round" ${dash}/>`;
      s += `<circle cx="${b.x}" cy="${b.y}" r="${6 * k}" fill="#8a8d9e" stroke="${borde}" stroke-width="${1.5 * k}"/>`;
      s += `<circle cx="${o.x}" cy="${o.y}" r="${3.5 * k}" fill="${borde}"/>`;
      s += `<circle cx="${mi.x}" cy="${mi.y}" r="${3.5 * k}" fill="#3b3b40"/>`;
      s += `<circle cx="${o.x}" cy="${o.y}" r="${L.r}" fill="none" stroke="rgba(8,92,34,.35)" stroke-width="${k}" stroke-dasharray="${3 * k} ${4 * k}"/>`;
    } else {
      const pts = L.poli.map(v => m(...v)).map(p => `${p.x},${p.y}`).join(' ');
      s += `<polygon points="${pts}" fill="${relleno}" stroke="${borde}" stroke-width="${(marcado ? 2.5 : 1.3) * k}" stroke-linejoin="round" ${dash}/>`;
      if (tipo === 'transportador') { const c0 = m(-65, 0), c1 = m(65, 0); s += `<line x1="${c0.x}" y1="${c0.y}" x2="${c1.x}" y2="${c1.y}" stroke="${borde}" stroke-width="${1.3 * k}"/>`; }
      let mk = '';
      for (const [x, y, l] of L.marcas || []) {
        const vert = tipo === 'cartabon';
        const a = m(x, y), b = vert ? m(x + l, y) : m(x, y + (tipo === 'escuadra' ? -l : l));
        mk += `M${a.x} ${a.y}L${b.x} ${b.y}`;
      }
      if (mk) s += `<path d="${mk}" stroke="rgba(12,36,20,.7)" stroke-width="${.9 * k}"/>`;
      const c0 = L.poli.reduce((acc, v) => [acc[0] + v[0] / L.poli.length, acc[1] + v[1] / L.poli.length], [0, 0]);
      const cm = m(...c0);
      s += `<text x="${cm.x}" y="${cm.y}" text-anchor="middle" dominant-baseline="middle" font-size="${12 * k}" font-weight="700" fill="rgba(12,36,20,.75)" font-family="system-ui, sans-serif">${NOMBRE_INST[tipo]}${P.fija ? '' : ' (posición automática)'}</text>`;
      const o = m(0, 0);
      s += `<circle cx="${o.x}" cy="${o.y}" r="${3 * k}" fill="${borde}"/>`;
    }
    if (marcado) {
      const a = m(...L.asa);
      s += `<circle cx="${a.x}" cy="${a.y}" r="${9 * k}" fill="#fff" stroke="${COLOR.sel}" stroke-width="${2 * k}"/>` +
        `<path d="M${a.x - 4 * k} ${a.y - 2 * k}a${4.5 * k} ${4.5 * k} 0 1 1 ${1 * k} ${5 * k}" fill="none" stroke="${COLOR.sel}" stroke-width="${1.6 * k}" stroke-linecap="round"/>`;
    }
    return `<g opacity="${P.fija ? 1 : .75}">${s}</g>`;
  },

  // ---------- Imán ----------
  // Puntos con nombre (enunciado y, al elegir para un paso, los construidos en pasos anteriores),
  // extremos y centros con coordenadas, cortes del enunciado y cruces de la cuadrícula
  objetivoIman(p, { excluir = null, soloNombres = false, sinLineas = false } = {}) {
    const radio = Vista.mmDe(window.matchMedia('(pointer: coarse)').matches ? 20 : 12);
    let mejor = null;
    const probar = (x, y, extra) => {
      const d = G.dist(p.x, p.y, x, y);
      if (d <= radio && (!mejor || d < mejor.d - 1e-9 || (extra.nombre && !mejor.nombre && d <= mejor.d + radio * .3))) mejor = Object.assign({ x, y, d }, extra);
    };
    const C = this.construccion;
    if (C) for (const [n, f] of C.geo) {
      if (f.tipo !== 'punto') continue;
      if (excluir && excluir.tipo === 'punto' && this.ej.inicial.puntos[excluir.i] && (this.ej.inicial.puntos[excluir.i].nombre || this.ej.inicial.puntos[excluir.i].etiqueta) === n) continue;
      if (!f.dado && !(this.eligiendo && f.paso < this.eligiendo.paso)) continue;
      probar(f.x, f.y, { nombre: n });
    }
    if (soloNombres) return mejor;
    if (!this.iman) return mejor;
    if (C && !sinLineas) {
      const lineas = [...C.geo.values()].filter(f => f.dado && f.tipo !== 'punto');
      for (let i = 0; i < lineas.length; i++) for (let j = i + 1; j < lineas.length; j++)
        for (const q of G.cortes(lineas[i], lineas[j])) probar(q.x, q.y, { cruce: true });
      for (const f of lineas) {
        if (f.tipo === 'recta') { probar(f.x1, f.y1, {}); probar(f.x2, f.y2, {}); }
        else probar(f.cx, f.cy, {});
      }
    }
    if (!mejor) {
      const n = this.nodoCuadricula(p);
      if (n && G.dist(p.x, p.y, n.x, n.y) <= radio) mejor = { x: n.x, y: n.y, rejilla: true };
    }
    return mejor;
  },
  nodoCuadricula(p) {
    const tipo = this.papel('papel');
    if (tipo === 'blanco') return null;
    const [W, H] = this.hoja(), m = this.papel('margen') ? 10 : 0;
    const a = { x0: m, y0: m, x1: W - m, y1: H - m };
    let mejor = null;
    const probar = (nx, ny) => {
      if (nx < a.x0 - 1e-6 || nx > a.x1 + 1e-6 || ny < a.y0 - 1e-6 || ny > a.y1 + 1e-6) return;
      const d = G.dist(p.x, p.y, nx, ny);
      if (!mejor || d < mejor.d) mejor = { x: U.r3(nx), y: U.r3(ny), d };
    };
    if (tipo === 'isometrico') {
      const s = this.papel('triangulo'), h = s * Math.sqrt(3) / 2, i0 = Math.round((p.x - a.x0) / h);
      for (let i = i0 - 1; i <= i0 + 1; i++) {
        const desfase = (((i % 2) + 2) % 2) * s / 2, j = Math.round((p.y - a.y0 - desfase) / s);
        for (let jj = j - 1; jj <= j + 1; jj++) probar(a.x0 + i * h, a.y0 + desfase + jj * s);
      }
    } else {
      const sep = tipo === 'cuadriculado' ? this.papel('cuadro') : 1;
      probar(a.x0 + Math.round((p.x - a.x0) / sep) * sep, a.y0 + Math.round((p.y - a.y0) / sep) * sep);
    }
    return mejor;
  },
  // Punto final: el imán o, si no hay, redondeado a medio milímetro
  ajustarPunto(p, opc) {
    const t = this.objetivoIman(p, opc);
    if (t) return t;
    return { x: U.r05(p.x), y: U.r05(p.y) };
  },
  radioRedondo(r, iman) { return iman ? U.r3(r) : U.r05(r); },

  // ---------- Elegir en la hoja (desde el inspector) ----------
  elegir(tipo, alElegir) {
    this.eligiendo = { tipo, alElegir, paso: this.sel.tipo === 'paso' ? this.sel.i : 0 };
    this.verConstruccion = true;
    this.pasoVista = Math.max(this.pasoVista, this.eligiendo.paso - 1);
    if (this.sel.tipo === 'paso') this.pasoVista = this.sel.i;
    document.getElementById('lienzo').classList.add('eligiendo');
    const b = document.getElementById('banda');
    b.hidden = false;
    b.innerHTML = '';
    b.append(U.el('span', { text: tipo === 'punto'
      ? 'Toca la hoja para elegir el punto: un punto con nombre o un sitio cualquiera (coordenadas).'
      : 'Toca una línea con nombre del enunciado o de un paso anterior.' }),
      U.el('button', { type: 'button', text: 'Cancelar', onclick: () => this.cancelarEleccion() }));
    this.pintarHoja();
    Barra.actualizar();
  },
  cancelarEleccion() {
    if (!this.eligiendo) return;
    this.eligiendo = null;
    this.lineaBajo = null;
    document.getElementById('lienzo').classList.remove('eligiendo');
    document.getElementById('banda').hidden = true;
    this.pintarHoja();
  },
  lineaCercana(p) {
    const C = this.construccion, radio = Vista.mmDe(12), paso = this.eligiendo ? this.eligiendo.paso : 0;
    let mejor = null;
    if (C) for (const [n, f] of C.geo) {
      if (f.tipo === 'punto' || (!f.dado && !(f.paso < paso))) continue;
      const d = G.distForma(p, f);
      if (d <= radio && (!mejor || d < mejor.d)) mejor = { nombre: n, forma: f, d };
    }
    return mejor;
  },

  // ---------- Pulsaciones sobre la hoja ----------
  tocar(p) {
    // Asas y elementos, de arriba abajo
    const k = Vista.mmDe(1), s = this.sel, [W, H] = this.hoja();
    if (s.tipo === 'inst' && this.ej.instrumentos[s.k]) {
      const c = this.ej.instrumentos[s.k], P = Inst.pose(s.k, c, W, H), a = Inst.aMundo(P, ...Inst.local(s.k, c).asa);
      if (G.dist(p.x, p.y, a.x, a.y) <= 14 * k) return { tipo: 'asa', k: s.k };
    }
    if (s.tipo === 'arco') {
      const c = this.ej.inicial.arcos[s.i], f = c && Construccion.arcoInicial(c, r => this.construccion.geo.get(r));
      if (f) { const a = { x: f.cx + f.r * Math.cos(f.a0), y: f.cy + f.r * Math.sin(f.a0) }; if (G.dist(p.x, p.y, a.x, a.y) <= 10 * k) return { tipo: 'radio', i: s.i }; }
    }
    if (s.tipo === 'recta') {
      const r = this.ej.inicial.rectas[s.i];
      if (r && r.desde === undefined && G.dist(p.x, p.y, r.x1, r.y1) <= 10 * k) return { tipo: 'extremo', i: s.i, e: 1 };
      if (r && r.hasta === undefined && G.dist(p.x, p.y, r.x2, r.y2) <= 10 * k) return { tipo: 'extremo', i: s.i, e: 2 };
    }
    let mejor = null;
    this.ej.inicial.puntos.forEach((q, i) => { const d = G.dist(p.x, p.y, q.x, q.y); if (d <= 10 * k && (!mejor || d < mejor.d)) mejor = { tipo: 'punto', i, d }; });
    if (mejor) return mejor;
    const pt = r => U.esCoord(r) ? r : (this.construccion.geo.get(r) || null);
    this.ej.inicial.rectas.forEach((r, i) => { const f = Construccion.rectaInicial(r, pt); if (f) { const d = G.distForma(p, f); if (d <= 8 * k && (!mejor || d < mejor.d)) mejor = { tipo: 'recta', i, d }; } });
    this.ej.inicial.arcos.forEach((c, i) => { const f = Construccion.arcoInicial(c, pt); if (f) { const d = G.distForma(p, f); if (d <= 8 * k && (!mejor || d < mejor.d)) mejor = { tipo: 'arco', i, d }; } });
    if (mejor) return mejor;
    for (const [tipo] of INSTRUMENTOS.slice().reverse()) {
      const c = this.ej.instrumentos[tipo];
      if (!c) continue;

  // ---------- Probar en DibuTec ----------

    const d = Modelo.exportar();

  },
  descargar() {
    const t = Modelo.texto(), nombre = Modelo.nombreArchivo();
    const a = U.el('a', { href: URL.createObjectURL(new Blob([t], { type: 'application/json' })), download: nombre });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);

    const t = Modelo.texto();

      sep(),
      this.boton('deshacer', 'deshacer', 'Deshacer (Ctrl+Z)', () => Editor.deshacer()),
      this.boton('rehacer', 'rehacer', 'Rehacer (Ctrl+Y)', () => Editor.rehacer()),
      this.boton('ayuda', 'ayuda', 'Cómo se usa', () => Editor.ayuda()),
      sep(),

      this.boton('h-recta', 'recta', 'Añadir una recta al enunciado (R)', () => Editor.herramienta('recta'), { texto: 'Recta', opc: true }),
      this.boton('h-arco', 'arco', 'Añadir un arco o circunferencia al enunciado (C)', () => Editor.herramienta('arco'), { texto: 'Arco', opc: true }),
      sep(),
      this.boton('iman', 'iman', 'Imán: pegar a puntos, cruces y cuadrícula', () => { Editor.iman = !Editor.iman; Barra.actualizar(); }),
      this.boton('ver', 'ojo', 'Ver la construcción esperada de los pasos', () => { Editor.verConstruccion = !Editor.verConstruccion; Barra.actualizar(); Editor.pintarHoja(); }),
      U.el('span', { class: 'espacio' }),
